<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3E9D9">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Níveis e times equilibrados para futsal, fut7, society e pelada. Marque quem chegou, os times saem sozinhos e cada partida se registra com um toque.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raxa">
<title>Raxa — níveis e times de racha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  /* ---- QUADRA AO SOL (padrão) ----
     papel esverdeado de quadra descoberta, tinta quase preta, giz branco.
     As cores fortes são só dos coletes: verde, vermelho, azul e amarelo.   */
  --bg:#E3E9D9; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#EEF2E5;
  --line:rgba(15,31,22,.10); --line2:rgba(15,31,22,.18); --fill:#F1F4EC;
  --chalk:#0F1F16; --mute:#5A6A5F; --mute2:#8E9A92;
  --onink:#F3F7EE;                 /* texto em cima da tinta (botão principal) */
  /* coletes: A verde · B vermelho · C azul · D amarelo (nomes antigos mantidos) */
  --lime:#1C7A3A; --lime2:#14602D; --coral:#D2381F; --cyan:#1E5BC6; --white:#B08400;
  --bibA:#1C7A3A; --bibB:#D2381F; --bibC:#1E5BC6; --bibD:#F2C21B;
  --gold:#A06E00;
  --ok:#1C7A3A; --bad:#C62828;
  --glow:none;
  --r:14px;
  --toph:56px; --navh:calc(60px + env(safe-area-inset-bottom));
  --disp:'Big Shoulders Display','Impact','Arial Narrow',sans-serif;
  --cond:'Big Shoulders Display','Impact','Arial Narrow',sans-serif;
  --body:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
}
:root[data-theme="escuro"]{
  /* ---- QUADRA À NOITE: refletor, tinta vira giz ---- */
  --bg:#0B1410; --bg2:#101A15; --panel:#13201A; --panel2:#1A2820;
  --line:rgba(230,242,232,.08); --line2:rgba(230,242,232,.16); --fill:#1A2620;
  --chalk:#ECF3EC; --mute:#93A398; --mute2:#66756C;
  --onink:#0B1410;
  --lime:#4ADE80; --lime2:#22C55E; --coral:#FF6B4A; --cyan:#6AB0FF; --white:#FFD23F;
  --bibA:#22A354; --bibB:#E0492F; --bibC:#2F6FE0; --bibD:#F2C21B;
  --gold:#FFC53D;
  --ok:#4ADE80; --bad:#FF5F5F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{overscroll-behavior-y:contain;background:var(--bg)}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.35;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:0 12px calc(var(--navh) + 20px);position:relative;z-index:1}
body.hasbar #app{padding-bottom:calc(var(--navh) + 92px)}

h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;letter-spacing:.005em;text-transform:uppercase;line-height:1}
.k{font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:11px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)} .tiny{font-size:12.5px;line-height:1.5}
.card>.row+.tiny,.card>.tiny+.row{margin-top:8px}
.hr{height:1px;background:var(--line);margin:14px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.hide{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- topo compacto ---------- */
.hdr{display:flex;align-items:center;gap:10px;height:var(--toph);padding:0 2px;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  margin:0 -12px;padding-left:12px;padding-right:12px}
.hdr h1{font-size:22px;letter-spacing:.01em}
.hdr .sub{font-size:11.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--chalk);color:var(--onink);font-family:var(--disp);font-weight:900;font-size:20px;line-height:1}
.iconbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--chalk);
  width:40px;height:40px;border-radius:11px;font-size:17px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.iconbtn:active{transform:scale(.94)}

/* ---------- navegação de polegar ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--navh);
  padding:0 0 env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:center}
.nav:empty{display:none}
.nav button{flex:1;max-width:128px;border:0;background:transparent;color:var(--mute);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px 4px;
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;position:relative;
  -webkit-touch-callout:none;user-select:none;touch-action:manipulation}
.nav button svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--chalk)}
.nav button.on::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--chalk);border-radius:0 0 3px 3px}
.nav button:active{opacity:.6}

/* ---------- cartão ---------- */
.card{background:var(--panel);border:0;border-radius:var(--r);padding:14px;
  box-shadow:0 1px 2px rgba(15,31,22,.05)}
.card+.card{margin-top:10px}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty .big{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--chalk);margin-bottom:6px;text-transform:uppercase}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;
  background:var(--fill);color:var(--chalk);padding:0 16px;min-height:48px;
  font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;line-height:1.1;
  cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--chalk);border-color:var(--chalk);color:var(--onink)}
.btn.ghost{background:var(--fill)}
.card .btn.ghost,.sheet .btn.ghost{background:var(--fill)}
.bar .btn.ghost{background:var(--panel);border-color:var(--line2)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px;letter-spacing:.04em}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn[disabled]{opacity:.35;pointer-events:none}
input,textarea,select{font-family:var(--body);font-size:16px;background:var(--fill);border:1px solid transparent;color:var(--chalk);
  border-radius:11px;padding:12px 13px;width:100%;outline:none;min-height:48px}
input:focus,textarea:focus{border-color:var(--chalk);box-shadow:0 0 0 1px var(--chalk) inset}
label.f{display:block;margin-bottom:12px}
label.f .k{display:block;margin-bottom:6px}

/* abas dentro de conteúdo (login) e segmentos */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--fill);border:0;
  padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{background:transparent;border:0;color:var(--mute);font-family:var(--disp);font-weight:700;font-size:14px;
  text-transform:uppercase;letter-spacing:.05em;padding:11px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--chalk);color:var(--onink)}
.seg{display:flex;gap:4px;background:var(--fill);border:0;border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:8px;padding:9px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.seg button.on{background:var(--chalk);color:var(--onink)}

/* ---------- home ---------- */
.ligacard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px;cursor:pointer;color:var(--chalk)}
.ligacard .dot{width:46px;height:46px;border-radius:12px;background:var(--chalk);color:var(--onink);
  display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:24px;flex:0 0 auto}
.ligacard h3{font-size:22px}
.ligacard:active{background:var(--panel2)}
.steps{display:grid;gap:12px;margin:4px 0 6px}
.steps .st{display:flex;gap:12px;align-items:flex-start}
.steps .n{flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:18px;
  background:var(--chalk);color:var(--onink)}
.steps .t{font-weight:600;font-size:15px;color:var(--chalk);line-height:1.2}
.steps .d{font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:2px}

/* ---------- patentes (nível) ---------- */
.pat{display:inline-flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:700;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:7px;white-space:nowrap;
  color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);
  background:color-mix(in srgb,var(--pc) 12%,transparent)}
.pat b{font-weight:800;opacity:.75;font-size:11px}
.pat.big{font-size:15px;padding:6px 11px;border-radius:9px}
/* divisões: 1 fosca → 2 metal → 3 polida. Passos pequenos, mesma direção. */
.pat.d1{border-color:color-mix(in srgb,var(--pc) 42%,transparent);background:color-mix(in srgb,var(--pc) 9%,transparent)}
.pat.d1 b{opacity:.6}
.pat.d2{border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.pat.d2 b{opacity:.85}
.pat.d3{border-color:color-mix(in srgb,var(--pc) 85%,transparent);background:color-mix(in srgb,var(--pc) 22%,transparent);
  box-shadow:0 0 6px -2px color-mix(in srgb,var(--pc) 45%,transparent)}
.pat.d3 b{opacity:1}
.pdot{width:9px;height:9px;border-radius:3px;background:var(--pc);flex:0 0 auto}
.pdot.d1{opacity:.7}
.pdot.d3{box-shadow:0 0 4px color-mix(in srgb,var(--pc) 70%,transparent)}
.prov{font-size:10.5px;color:var(--gold);font-family:var(--body);letter-spacing:.04em;font-weight:700}
.gk{font-size:11px;color:var(--cyan)}

/* ---------- presença ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.pcw{display:flex;gap:6px;min-width:0}
.pcw .pchip{flex:1;min-width:0}
.pchip{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:50px;border-radius:12px;border:1px solid transparent;
  background:var(--fill);cursor:pointer;text-align:left;color:var(--chalk);transition:background .12s,border-color .12s}
.pchip:active{transform:scale(.97)}
.pchip,.gktog{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.painting{touch-action:none;overflow:hidden}
.pchip .nm{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.15;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .pat{font-size:11px;padding:2px 5px;gap:3px}
.pchip .tiny{font-size:11px}
.pchip.on{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-color:var(--ok)}
.gktog{flex:0 0 auto;width:46px;min-height:50px;border-radius:12px;border:1px solid transparent;background:var(--fill);
  color:var(--mute2);font-size:18px;cursor:pointer;filter:grayscale(1) opacity(.5)}
.gktog.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,var(--panel));filter:none}
.gktog:active{transform:scale(.94)}

/* ---------- times como coletes ---------- */
.teamwrap{display:grid;gap:10px}
.team{border:0;border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:0 1px 2px rgba(15,31,22,.05)}
.team .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;font-family:var(--disp);font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;font-size:17px;color:#fff}
.team .bd{padding:10px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px}
.tp{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border:1px solid transparent;border-radius:10px;
  padding:0 10px;min-height:38px;font-size:14px;font-weight:500;cursor:pointer;color:var(--chalk)}
.tp small{font-size:10px;opacity:.6;font-family:var(--body);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.tp.big{font-size:15px;padding:0 13px;min-height:46px}
.tp.lv{background:color-mix(in srgb,var(--pc) 12%,var(--panel));border-color:color-mix(in srgb,var(--pc) 40%,var(--line))}
.tp.lv.d1{background:color-mix(in srgb,var(--pc) 9%,var(--panel));border-color:color-mix(in srgb,var(--pc) 32%,var(--line))}
.tp.lv.d3{border-color:color-mix(in srgb,var(--pc) 55%,var(--line));background:color-mix(in srgb,var(--pc) 18%,var(--panel))}
.tp.sel{background:var(--chalk);color:var(--onink);border-color:var(--chalk)}
.tp.vaga{border-style:dashed;border-color:var(--line2);color:var(--mute);background:transparent}
.tp.emp{border-style:dashed;border-color:var(--line2)}
.cA{background:var(--bibA)} .cB{background:var(--bibB)} .cC{background:var(--bibC)} .cD{background:var(--bibD);color:#0F1F16!important}
.teamtag{display:inline-block;font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  font-size:12px;padding:4px 9px;border-radius:7px;color:#fff;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* filtros de período: uma linha só, rolando de lado se não couber */
.chips.perfil{flex-wrap:nowrap}
.chips.perfil .tp{flex:1 1 0;justify-content:center;white-space:nowrap;padding:0 6px;min-height:40px;font-size:14px}
.filapos{font-family:var(--disp);font-weight:800;font-size:13px;color:var(--mute2);align-self:center;margin-right:-2px}
.balbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:8px}
.balbar i{display:block;height:100%;background:var(--ok)}
.gkcard{box-shadow:inset 3px 0 0 var(--cyan)}
.benchcard{box-shadow:none;border:1px dashed var(--line2)!important;background:transparent}
.selbar{position:sticky;top:calc(var(--toph) + 6px);z-index:36;background:var(--chalk);color:var(--onink);border-radius:12px;
  padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar .btn{border-color:color-mix(in srgb,var(--onink) 40%,transparent);color:var(--onink);background:transparent}
/* arraste */
.tp[data-drag]{touch-action:manipulation}
.tp,.pchip,.gktog,.side,.btn,.tabs button,.slot,.rank,.rachaRow,.rkbtn,.iconbtn,.grab{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tp.dragging{opacity:.35}
.dragghost{position:fixed!important;pointer-events:none;z-index:300}
.dropok{outline:2px dashed var(--ok);outline-offset:3px;border-radius:10px}
.dropzone{outline:2px dashed color-mix(in srgb,var(--ok) 55%,transparent);outline-offset:2px}

/* ---------- próxima partida / escalação ---------- */
.esc2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.esc2 .pl{display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid transparent;border-radius:10px;margin-top:5px;
  font-size:14px;font-weight:500;background:var(--fill);color:var(--chalk);width:100%;text-align:left;cursor:pointer;min-height:42px;font-family:inherit}
.esc2 .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esc2 .pl.gk{border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 8%,var(--panel));margin-top:0}
.esc2 .pl.empty{border-style:dashed;border-color:var(--line2);color:var(--mute);background:transparent;font-weight:400}
.esc2 .pl .ic{font-size:11px;color:var(--mute);flex:0 0 auto}
.esc2 .pl .ic.sub{opacity:.7}
.esc2 .pl.sel{background:var(--chalk);color:var(--onink);border-color:var(--chalk)}
.esc2 .pl.sel .ic,.esc2 .pl.sel .nm{color:var(--onink)}
.esc2 .col .teamtag{margin-bottom:6px;display:block}
.esc2.vs3{grid-template-columns:1fr auto 1fr;align-items:start;margin-top:10px}
.esc2.vs3 .vs{align-self:center}
.esc2 .col>.slot{display:block;width:100%;margin-bottom:6px}
.esc2 .col .res{margin-top:8px}
.esc2 .col .res .k{margin-bottom:4px;font-size:10px}
.slot{border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;border:1px solid transparent;
  background:var(--fill);color:var(--chalk);border-top-width:5px}
.slot .nm{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:18px}
.slot .sub{font-size:11.5px;color:var(--mute);margin-top:3px}
.slot.a{border-top-color:var(--bibA)} .slot.b{border-top-color:var(--bibB)}
.slot.c{border-top-color:var(--bibC)} .slot.d{border-top-color:var(--bibD)}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.vs{display:grid;place-items:center;font-family:var(--disp);font-weight:800;color:var(--mute2);font-size:15px;letter-spacing:.06em}

/* ---------- partida ao vivo: o placar é a tela ---------- */
.livetop{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.livetop .t{font-family:var(--disp);font-weight:900;font-size:44px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.livetop .t.hit{color:var(--ok);animation:pulse .9s infinite alternate}
.livetop .t.pause{color:var(--mute);opacity:.6}
.livetop .meta{flex:1;min-width:0;line-height:1.35}
.livetop .iconbtn{margin-left:0;width:44px;height:44px;font-size:16px}
.clock{text-align:center;padding:6px 0 12px}
.clock .t{font-family:var(--disp);font-weight:900;font-size:44px;line-height:1}
.clock .t.hit{color:var(--ok);animation:pulse .9s infinite alternate}
.clock .t.pause{color:var(--mute);opacity:.6}
@keyframes pulse{to{opacity:.45}}
.stintline{margin:-4px 0 9px;text-align:center}
.scoreb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.side{border-radius:16px;padding:14px 10px 12px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
  border:0;transition:transform .08s;color:#fff}
.side:active{transform:scale(.98)}
.side .nm{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:16px;opacity:.92}
.side .sc{font-family:var(--disp);font-weight:900;font-size:72px;line-height:.9;margin:4px 0 4px;font-variant-numeric:tabular-nums}
.side .hint{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.side.a{background:var(--bibA)} .side.b{background:var(--bibB)} .side.c{background:var(--bibC)}
.side.d{background:var(--bibD);color:#0F1F16}
.scoreb.big .side{min-height:clamp(150px,30vh,240px);display:flex;flex-direction:column;justify-content:center;padding:22px 10px 16px}
.scoreb.big .side .sc{font-size:clamp(76px,22vw,120px)}
.minus{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:11px;border:1.5px solid currentColor;
  opacity:.75;display:grid;place-items:center;font-size:22px;background:transparent;color:inherit;cursor:pointer}
.minus:active{transform:scale(.92)}
@media(max-height:620px){
  .livetop .t{font-size:34px}
  .scoreb.big .side{min-height:132px}
  .scoreb.big .side .sc{font-size:clamp(54px,15vw,80px)}
}
.lineup{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lineup span{font-size:12px;color:var(--mute);background:var(--panel2);padding:3px 7px;border-radius:7px}
.scorerbar{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}
.scorerbar .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.goalrow{display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:0}
.goalrow .who{flex:1;text-align:left;background:transparent;border:0;color:var(--chalk);font-family:inherit;
  font-size:14.5px;padding:10px 0;min-height:44px;cursor:pointer}
.goalrow .who.none{color:var(--mute);font-style:italic}
.goalrow .x{width:40px;height:40px;border-radius:9px;border:0;background:var(--fill);
  color:var(--mute);font-size:15px;cursor:pointer;flex:0 0 auto}
.goalrow .x:active{transform:scale(.92)}

/* ---------- escada / ranking ---------- */
.secthd{display:flex;align-items:center;gap:10px;margin:20px 4px 8px}
.secthd .nm{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--pc);letter-spacing:.03em;text-transform:uppercase}
.secthd .ln{flex:1;height:2px;background:var(--pc);opacity:.35;border-radius:1px}
.secthd .ct{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--mute);letter-spacing:.06em}
.rank{display:flex;align-items:center;gap:11px;padding:12px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.rank:last-child{border-bottom:0}
.rank:active{background:var(--panel2)}
.rank .nm{font-weight:600;font-size:16px}
.rank .meta{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:flex;gap:3px}
.form i{width:7px;height:7px;border-radius:2px;background:var(--mute2);display:block}
.form i.v{background:var(--ok)} .form i.d{background:var(--bad)} .form i.e{background:var(--mute)}
.promo{border:1px solid var(--pc);border-radius:13px;padding:12px;margin-bottom:8px;background:color-mix(in srgb,var(--pc) 6%,var(--panel))}
.promo .t{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--pc);text-transform:uppercase}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* ---------- histórico ---------- */
.mrow{padding:12px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .l1{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.mrow .l1 .s{font-family:var(--disp);font-weight:900;font-size:20px}
.mrow .l2{font-size:12px;color:var(--mute);margin-top:4px}
.mrow.eu{border-left:3px solid var(--ok);padding-left:9px}
/* time escrito com os nomes de quem jogou: fonte de texto, menor, e pode
   quebrar em duas linhas — cortar nome no meio seria pior que descer a fonte */
.mrow.nomes .l1{font-family:var(--body);font-weight:600;font-size:12.5px;text-transform:none;
  letter-spacing:0;line-height:1.35;align-items:flex-start;gap:8px}
.mrow.nomes .l1>span:first-child{flex:1;min-width:0}
.mrow.nomes .l1 .s{font-family:var(--disp);font-weight:900;font-size:17px;line-height:1.1;flex:0 0 auto}
.mrow.nomes .l1 .flag{flex:0 0 auto}
.win{color:var(--ok)}
.flag{font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:6px}
.mine{font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:6px;border:1px solid currentColor}
/* linha do tempo da revisão: um evento por linha (gol, troca, goleiro, pausa) */
.evr{display:flex;align-items:center;gap:9px;padding:9px 10px;width:100%;background:transparent;
  border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left}
.evr:last-child{border-bottom:0}
button.evr{cursor:pointer;min-height:44px} button.evr:active{background:var(--panel2)}
.evr .t{min-width:42px;flex:0 0 auto}
.evr .d{flex:1;min-width:0}
.evr .nm{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evr .meta{font-size:11.5px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evr .plc{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--mute);flex:0 0 auto}
.evr.mut .nm{font-weight:500;color:var(--mute)}
.trecho{background:var(--panel2);border-radius:12px;padding:10px 11px;margin-bottom:7px}
.trecho.off{opacity:.55}
.rachaRow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--line);color:var(--chalk);padding:14px 12px;cursor:pointer;font-family:inherit;min-height:60px}
.rachaRow:last-child{border-bottom:0}
.rachaRow:active{background:var(--panel2)}
.rachaRow.eu{border-left:3px solid var(--ok);padding-left:9px}
.rachaRow .nm{font-weight:600;font-size:16px}
.rachaRow .meta{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}

/* ---------- destaques e números ---------- */
.k2{font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:11px;color:var(--mute);margin:16px 0 4px}
.dest{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.dest:last-of-type{border-bottom:0}
.dest .pos{font-size:18px;line-height:1;flex:0 0 auto}
.dest .who{flex:1;min-width:0}
.dest .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
@media(max-width:380px){.duo{grid-template-columns:1fr}}
.hl{background:var(--fill);border:1px solid transparent;border-radius:12px;padding:10px 11px}
.hl.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .hl.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.hl .t{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.hl .n{font-family:var(--disp);font-weight:800;font-size:20px;margin:3px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.hl .s{font-size:11.5px;color:var(--mute)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat.four{grid-template-columns:repeat(4,1fr)}
.stat.four b{font-size:20px}
.stat div{background:var(--fill);border:0;border-radius:12px;padding:11px 6px}
.stat b{font-family:var(--disp);font-weight:800;font-size:24px;display:block;line-height:1.1}
.stat span{font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2);margin-top:7px}
.vbar i{display:block;height:100%}
.vbar .v{background:var(--ok)} .vbar .e{background:var(--mute2)} .vbar .d{background:var(--bad)}
.rk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{width:18px;font-family:var(--disp);font-weight:800;color:var(--mute2);font-size:15px}
.rk .nm{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .val{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--chalk)}
.rkbtn{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);
  color:var(--chalk);padding:11px 2px;cursor:pointer;font-family:inherit;min-height:44px}
.rkbtn .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkbtn:active{opacity:.65}
.avatar{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:26px;
  background:var(--pc,var(--chalk));color:var(--onink);flex:0 0 auto}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:13px;
  background:var(--panel2);border:1px solid var(--line);color:var(--chalk);flex:0 0 auto}
.hero{display:flex;align-items:center;gap:12px}
.hero .who{flex:1;min-width:0}
.hero h2{font-size:26px;margin:1px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herogrid{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:18px;margin-bottom:6px}
.ring{position:relative;width:104px;height:104px;margin:4px 0 30px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--panel2);stroke-width:9}
.ring .pr{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:30px}
.ring .rl{position:absolute;left:-14px;right:-14px;bottom:-22px;text-align:center;font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ved{display:grid;gap:8px}
.ved .r{display:grid;grid-template-columns:70px 1fr 28px;gap:10px;align-items:center}
.ved .r span{font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-size:11px;font-weight:700}
.ved .r b{text-align:right;font-family:var(--disp);font-weight:800;font-size:17px}
.ved .prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.ved .prog i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tiles.five{grid-template-columns:repeat(5,1fr);gap:6px}
.tiles.five .tile{padding:12px 2px 8px}
.tiles.five .tile b{font-size:21px}
.tiles.five .tile span{font-size:9.5px;letter-spacing:.04em}
.tile{position:relative;overflow:hidden;background:var(--fill);border:0;border-radius:12px;padding:14px 4px 10px;text-align:center}
.tile::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc,var(--chalk))}
.tile b{display:block;font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;margin-bottom:5px}
.tiles.four .tile b{font-size:22px}
.tile span{font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);line-height:1.2;display:block}
.mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--fill);border:0;border-radius:12px;padding:10px 12px;margin-top:10px}
.mini .tm{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .tm.r{text-align:right}
.mini .sc{font-family:var(--disp);font-weight:900;font-size:28px;letter-spacing:.03em}
.rk2{display:grid;grid-template-columns:22px 30px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:default}
button.rk2{cursor:pointer;min-height:44px} button.rk2:active{opacity:.65}
.rk2:last-child{border-bottom:0}
.rk2 .pos{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--mute2);text-align:center}
.rk2.top .pos{color:var(--gold)}
.rk2 .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rk2 .sub{font-size:11px;color:var(--mute);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk2 .prog{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:8px}
.rk2 .prog i{display:block;height:100%;background:var(--ok)}
.rk2.top .prog i{background:var(--gold)}
.rk2 .val{font-family:var(--disp);font-weight:800;font-size:16px;white-space:nowrap;text-align:right}
.rk2 .val small{font-weight:500;color:var(--mute);margin-left:3px;font-size:11px;font-family:var(--body)}
.sec{margin-top:14px}
.sec .k2{display:flex;align-items:center;justify-content:space-between;margin-top:0;gap:8px}
.k2 .ord{border:1px solid var(--line);background:none;color:var(--mute);border-radius:7px;
  font:inherit;font-size:12px;line-height:1;padding:4px 9px;cursor:pointer;flex:0 0 auto}
.k2 .ord.on{color:var(--chalk);border-color:var(--mute)}
/* a regra do ranking (mínimo, unidade) é nota, não título: menor, sem caixa alta, e nunca empurra o título para a linha de baixo */
.sec .k2 .tiny{font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:500;text-align:right;white-space:nowrap;margin-left:8px;flex:0 0 auto}
.sec .k2>:first-child{white-space:nowrap}
.rk3{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rk3:last-child{border-bottom:0}
.rk3 .pos{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--mute2);text-align:center}
.rk3.top .pos{color:var(--gold)}
.rk3 .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rk3 .nm small{font-weight:400;color:var(--mute);font-size:11px;margin-left:6px}
/* time da noite: o rótulo é a escalação original, então pode ocupar duas linhas */
.rk3.time{align-items:start;padding:9px 0}
.rk3.time .nm{white-space:normal;overflow:visible;line-height:1.3}
.rk3.time .nm small{display:block;margin:3px 0 0}
.rk3 .val{font-family:var(--disp);font-weight:800;font-size:15px;white-space:nowrap}
.rk3 .val small{font-weight:500;color:var(--mute);margin-left:3px;font-size:10px;font-family:var(--body)}
.more{display:block;width:100%;background:none;border:0;color:var(--mute);font:inherit;font-size:12.5px;font-weight:600;padding:10px 0 2px;cursor:pointer;text-align:left;min-height:36px}

/* ---------- ficha do jogador ---------- */
.ps-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ps-hd .avatar{width:48px;height:48px;font-size:19px;flex:0 0 auto;border-radius:13px}
.ps-hd h2{margin:0;font-size:24px;line-height:1.1;display:flex;align-items:center;gap:8px;min-width:0}
.ps-hd h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-hd .sub{font-size:12px;color:var(--mute);margin-top:3px}
.ico{border:1px solid var(--line2);background:transparent;color:var(--mute);border-radius:8px;width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex:0 0 auto}
.lv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lv2 button{text-align:left;background:var(--fill);border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--chalk);cursor:pointer;position:relative}
.lv2 button .k{margin-bottom:6px;display:block}
.lv2 button.on{border-color:var(--chalk);box-shadow:0 0 0 1px var(--chalk) inset}
.lv2 button .best{font-size:11px;color:var(--mute);margin-top:6px}
.lv2 .none{font-size:13px;color:var(--mute)}
.ps-panel{background:var(--fill);border:0;border-radius:12px;padding:12px;margin-top:12px}
.ps-panel .k{margin-bottom:8px}
.ladder4{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.ladder4 button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 4px 8px;color:var(--chalk);
  font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
.ladder4 button i{display:block;width:100%;height:4px;border-radius:2px;background:var(--pc)}
.ladder4 button.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.step{display:flex;align-items:center;gap:8px;margin-top:10px}
.step .cur{flex:1;text-align:center;font-family:var(--disp);font-weight:800;font-size:20px}
.step .btn{flex:0 0 56px;padding:0;font-size:20px;line-height:1}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .lbl{font-size:14.5px}
.trow .lbl small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);position:relative;cursor:pointer;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.15s}
.sw.on{background:var(--ok);border-color:var(--ok)}
.sw.on::after{left:23px;background:#fff}
.ps-foot{display:flex;gap:8px;margin-top:14px}
.ps-foot .btn{flex:1}

/* ---------- folha, barra de ação, aviso ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--bg2);border-top:1px solid var(--line2);
  border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;
  max-width:640px;margin:0 auto;transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.8,.3,1);display:none}
.sheet.on{display:block;transform:translateY(0)}
.sheet h2{font-size:24px;margin-bottom:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet .grab{cursor:grab;touch-action:none;padding:6px 0;margin:-6px 0 6px;background-clip:content-box}
.bar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:49;padding:10px 12px 10px;
  background:linear-gradient(0deg,var(--bg) 70%,transparent);max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar:empty{display:none}
.bar .btn{flex:1;min-height:54px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px);transform:translateX(-50%) translateY(14px);background:var(--chalk);color:var(--onink);
  padding:12px 16px;border-radius:11px;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:15px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* claro: coletes com texto branco precisam de cor fechada — já são; o D amarelo usa tinta */
:root[data-theme="claro"] .side.d .hint,:root[data-theme="claro"] .side.d .nm{opacity:.85}
:root[data-theme="escuro"] .card{box-shadow:none}
:root[data-theme="escuro"] .hdr{background:color-mix(in srgb,var(--bg) 86%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar" id="bar"></div>
<nav class="nav" id="nav" aria-label="Seções"></nav>
<div class="scrim" id="scrim" data-a="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   RAXA v1 — dados no Postgres (Supabase), contas por usuário e senha.
   O motor não sabe que existe servidor: ele mexe no objeto da liga e chama
   save(); quem leva para o banco é o sincronizador, no fim deste arquivo.

const FORMATS=[{n:5,l:'5v5',d:'Futsal'},{n:6,l:'6v6',d:'Society'},{n:7,l:'7v7',d:'Fut7'},{n:11,l:'11v11',d:'Campo'}];
/* O peso de cada partida vem do formato DO RACHA em que ela foi jogada — nunca
   de uma configuração global. Uma liga pode ter rachas curtos e longos no mesmo
   histórico, e cada partida guarda o formato dela.
   Racha curto (2 gols ou 7 min) rende 10 a 15 partidas por noite — não 25 —
   então cada uma precisa pesar mais do que pesava.                            */
/* K por partida. base=22 era lento demais: um Ferro 1 vencendo tudo levava 18
   vitórias para subir 3 divisões, e o racha ficava desequilibrado esse tempo
   todo. Com 36 (e o acelerador de sequência abaixo) uma noite perfeita vale
   ~2 divisões; uma noite normal, meia.                                       */
/* K de jogo de TIME, não de xadrez (D-55). O 40/20 da FIDE assume sinal
   direto (1×1); em time equilibrado a expectativa é a média dos dez, então o
   sinal individual dilui e o K precisa ser maior. Referência testada em
   escala: o Elo do Faceit (CS2) — K fixo ≈50 (±25 por vitória parelha) com
   níveis de ~200 pontos, como a nossa patente. Aqui: base 32 (o K padrão
   fora da FIDE — USCF/online), dobrado para 64 na calibração de 15 partidas
   (D-53) — ±16 e ±32 por vitória parelha, a mesma banda do Faceit. Sem
   acelerador de sequência e sem decaimento por histórico — o que separa o
   racha curto da partida única é o peso da unidade (1/n × K contra fatia de
   tempo × K), não o K.                                                      */
const KMODE={curtas:{cal:64,base:32,min:32},unica:{cal:64,base:32,min:32}};
function kFor(km,tr){return km.base}
const streakK=tr=>1;
/* Histerese fixa: promove ao passar do corte + 21, rebaixa ao cair abaixo do
   corte − 21, sem proteção pós-promoção. A margem acompanha o K: precisa ser
   maior que meia vitória parelha (K/2 = 16), senão V-D-V-D em volta do corte
   vira ioiô. A banda é de 42 pontos (corte ± 21) num degrau de ~67: segura o
   ioiô sem travar a subida. Não é opção da liga de propósito — nível tem que
   variar igual em todo racha, senão a mesma escada significa coisas
   diferentes.                                                               */

const modoDe=(liga,m)=>KMODE[m&&m.mode]?m.mode:(KMODE[liga.cfg.matchMode]?liga.cfg.matchMode:'curtas');

/* ---------- escada de níveis ----------
   5 níveis × 3 divisões = 15 degraus. Cada nível ocupa 200 pontos de
   rating — o "intervalo de classe" clássico do Elo, em que o mais forte
   vence ~75% dos confrontos. Base 1000, então a escada cobre 1000–1999,
   centrada em 1500 — a média que o Elo (soma zero) mantém para a liga.
   Prata é 1400–1599 e quem entra no padrão (1500) nasce Prata 2: bem no
   meio, com dois níveis para cada lado. Dentro do nível, número maior é
   melhor: Diamante 3 é o topo, Ferro 1 o primeiro degrau.                  */
/* ferro · bronze · prata · ouro · diamante
   ferro: aço escuro (cinza fechado, longe da prata clara) · bronze: laranja ·
   prata: quase branca · ouro: amarelo vivo · diamante: azul-gelo            */
const PATC_ESCURO=['#5A646D','#D08A55','#DCE4EC','#FFD84D','#B9E6FF'];
const PATC_CLARO =['#3A4249','#9A5626','#5B6B7A','#A06E00','#1F8FD6'];
let PATC=PATC_ESCURO;   // trocado pelo tema: no claro, tom mais fechado para dar contraste
const PATSHORT=['FER','BRO','PRA','OUR','DIA'];
const DIVS=['1','2','3'];
const BASE=1000, STEP=200/3, TOP=14;
