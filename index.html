  const c=ACC[id];
  if(c&&c.carregando)return;
  ACC[id]=Object.assign({},c||{lista:null},{carregando:true});
  const {data,error}=await sb.rpc('league_accounts',{p_id:id});
  ACC[id]={at:Date.now(),lista:error?((c&&c.lista)||[]):(data||[]),erro:error?traduz(error):null};
  if(!ocupado())render();
}
/* Para o admin, o card Membros é a lista de CONTAS (com ou sem jogador): é
   a única lista que ele precisa. Para os outros, a versão do protótipo
   (jogadores com perfil vinculado).                                        */
function membrosCard(liga){
  if(!sb||!ME||!souAdmin(liga))return membrosCardBase(liga);
  const c=ACC[liga.id];
  if(!c||(!c.carregando&&Date.now()-c.at>ACC_TTL))setTimeout(()=>loadAccounts(liga.id),0);
  const eu=euId(liga),semConta=liga.players.filter(p=>!p.owner).length;
  if(!c||!c.lista)return `<div class="card"><div class="row" style="margin-bottom:6px"><div class="k">Membros</div></div><div class="tiny muted">Buscando contas…</div></div>`;
  const jog=a=>a.pending?null:liga.players.find(p=>p.owner===a.username);
  const pend=c.lista.filter(a=>a.pending),contas=c.lista.filter(a=>!a.pending);
  const semJog=contas.filter(a=>!jog(a));
  const ord=pend.concat([...contas].sort((a,b)=>{const pa=jog(a),pb=jog(b);
    if(!pa!==!pb)return pa?1:-1;                                   // sem jogador primeiro: é o que precisa de ação
    return ((pa?PAPEL_ORD[pa.role]??2:9)-(pb?PAPEL_ORD[pb.role]??2:9))||a.username.localeCompare(b.username)}));
  const linha=a=>{const p=jog(a);
    if(a.pending)return `<div class="rank" data-a="accSheet" data-u="${esc(a.user_id)}">
      <div style="min-width:0;flex:1"><div class="nm">@${esc(a.username)}</div>
        <div class="meta"><span class="tiny" style="color:var(--lime)">pediu para entrar — toque para aprovar</span></div></div>
      <span class="pat" style="--pc:var(--lime)">Pedido</span>
      <div style="color:var(--mute);font-size:18px">›</div></div>`;
    return p?`<div class="rank" data-a="pSheet" data-id="${p.id}">
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}${p.id===eu?' <span class="tiny muted">(você)</span>':''}</div>
        <div class="meta"><span class="tiny muted">@${esc(a.username)}${a.is_owner?' · dono':''}</span></div></div>
      <span class="pat" style="--pc:${p.role==='admin'?'var(--gold)':p.role==='editor'?'var(--cyan)':'var(--mute)'}">${PAPEL[p.role]||'Jogador'}</span>
      <div style="color:var(--mute);font-size:18px">›</div></div>`
    :`<div class="rank" data-a="accSheet" data-u="${esc(a.user_id)}">
      <div style="min-width:0;flex:1"><div class="nm">@${esc(a.username)}${a.user_id===ME.id?' <span class="tiny muted">(você)</span>':''}</div>
        <div class="meta"><span class="tiny" style="color:var(--gold)">sem jogador — toque para vincular</span></div></div>
      ${a.is_owner?'<span class="pat" style="--pc:var(--gold)">Dono</span>':''}
      <div style="color:var(--mute);font-size:18px">›</div></div>`};
  return `<div class="card">
    <div class="row" style="margin-bottom:6px"><div class="k">Membros</div>
      <div class="sp tiny muted num">${pend.length?pend.length+' pedido'+(pend.length===1?'':'s')+' · ':''}${contas.length} conta${contas.length===1?'':'s'}${semJog.length?' · '+semJog.length+' sem jogador':''}${semConta?' · '+semConta+' só no cadastro':''}</div></div>
    <div class="tiny muted" style="margin-bottom:10px">Você é <b>Admin</b>. Toque num membro para mudar permissão ou vínculo; só você vê as contas ainda sem jogador.</div>
    ${c.erro?`<div class="tiny" style="color:var(--red);margin-bottom:8px">${esc(c.erro)}</div>`:''}
    <div class="card" style="padding:0;margin:0 0 ${semConta?'8px':'0'}">${ord.map(linha).join('')}</div>
    ${semConta?`<div class="tiny muted">${semConta} jogador${semConta===1?'':'es'} sem conta — alguém lança por ele${semConta===1?'':'s'}. Estão na escada abaixo.</div>`:''}
  </div>`;
}

Object.assign(A,{
  accSheet(el){
    const l=L(),c=ACC[l.id];if(!c||!c.lista)return;
    const a=c.lista.find(x=>x.user_id===el.dataset.u);if(!a)return;
    if(!souAdmin(l))return toast('Só o admin gerencia contas');
    if(a.pending)return openSheet(`<h2>@${esc(a.username)}</h2>
      <div class="tiny muted" style="margin-bottom:12px">Pediu para entrar em ${new Date(a.joined_at).toLocaleDateString('pt-BR')} usando o código da liga. Ainda não vê nada daqui.</div>
      <button class="btn wide pri" data-a="accApprove" data-u="${esc(a.user_id)}" style="margin-bottom:8px">Aprovar entrada</button>
      <button class="btn wide ghost" data-a="accReject" data-u="${esc(a.user_id)}">Recusar</button>
      <div class="tiny muted" style="margin-top:8px">Depois de aprovar, vincule a conta a um jogador aqui mesmo em Membros.</div>`);
    const p=l.players.find(x=>x.owner===a.username);
    const livres=l.players.filter(x=>!x.owner).sort((x,y)=>x.name.localeCompare(y.name));
    openSheet(`<h2>@${esc(a.username)}</h2>
      <div class="tiny muted" style="margin-bottom:12px">${a.is_owner?'Dono da liga · ':''}entrou em ${new Date(a.joined_at).toLocaleDateString('pt-BR')}</div>
      <div class="k" style="margin-bottom:8px">Jogador</div>
      ${p?`<div class="tiny" style="margin-bottom:10px">Vinculada a <b>${esc(p.name)}</b> (${PAPEL[p.role]||'Jogador'})
          <button class="btn sm ghost" style="margin-left:8px" data-a="pSheet" data-id="${p.id}">abrir ficha</button>
          <button class="btn sm ghost" style="margin-left:4px" data-a="accUnlink" data-id="${p.id}">desvincular</button></div>`
        :`<div class="tiny muted" style="margin-bottom:10px">Essa conta ainda não é nenhum jogador. Escolha o perfil dela na lista, ou crie um novo com o nome da conta.</div>
          ${livres.length?`<div class="card" style="padding:0;margin:0 0 10px;max-height:40vh;overflow:auto">${livres.map(x=>`<div class="rank" data-a="accLink" data-u="${esc(a.user_id)}" data-id="${x.id}">
              <div style="min-width:0;flex:1"><div class="nm">${esc(x.name)}</div><div class="meta"><span class="tiny muted">${x.L.games+x.G.games} partidas · sem dono</span></div></div>
              <span class="tiny" style="color:var(--cyan)">vincular</span></div>`).join('')}</div>`
            :'<div class="tiny muted" style="margin-bottom:10px">Nenhum jogador sem dono no cadastro.</div>'}
          <button class="btn wide ghost" data-a="accCreate" data-u="${esc(a.user_id)}" style="margin-bottom:10px">+ Criar jogador “${esc(a.username)}”</button>`}
      <div class="hr"></div>
      ${a.is_owner?'<div class="tiny muted">O dono da liga não pode ser removido.</div>'
        :`<button class="btn wide danger" data-a="accRemove" data-u="${esc(a.user_id)}">Tirar da liga</button>
          <div class="tiny muted" style="margin-top:6px">O jogador e o histórico ficam; só o acesso sai.</div>`}`);
  },
  accLink(el){
    const l=L(),a=(ACC[l.id].lista||[]).find(x=>x.user_id===el.dataset.u),p=P(l,el.dataset.id);
    if(!a||!p)return;
    if(!souAdmin(l))return toast('Só o admin vincula contas');
    l.players.forEach(x=>{if(x.owner===a.username)x.owner=null});   // uma conta, um jogador
    p.owner=a.username;logAdd(l,'link',{pid:p.id,user:a.username});
    closeSheet();save();render();toast(p.name+' agora é @'+a.username);
  },
  accUnlink(el){
    const l=L(),p=P(l,el.dataset.id);if(!p)return;
    if(!souAdmin(l))return toast('Só o admin desvincula');
    if(p.owner===S.me.name)return toast('Para o seu próprio perfil, use "desvincular" na ficha');
    logAdd(l,'unlink',{pid:p.id,user:p.owner});
    p.owner=null;closeSheet();save();render();toast('Conta desvinculada');
  },
  accCreate(el){
    const l=L(),a=(ACC[l.id].lista||[]).find(x=>x.user_id===el.dataset.u);if(!a)return;
    if(!souAdmin(l))return toast('Só o admin cria jogador para conta');
    const p=mkPlayer(l,a.username,l.cfg.startElo,false);
    p.L.def=false;                                   // ninguém deu palpite: fica sem nível até calibrar
    p.owner=a.username;l.players.push(p);logAdd(l,'newPlayer',{pid:p.id,name:p.name,user:a.username});
    closeSheet();save();render();A.pSheet({dataset:{id:p.id}});toast('Jogador criado — ajuste o nível na ficha');
  },
  async accApprove(el){
    const l=L(),a=(ACC[l.id].lista||[]).find(x=>x.user_id===el.dataset.u);if(!a)return;
    const {error}=await sb.rpc('approve_request',{p_id:l.id,p_user:a.user_id});
    if(error)return toast('Não deu: '+traduz(error));
    a.pending=false;a.joined_at=new Date().toISOString();
    closeSheet();render();toast('@'+a.username+' entrou na liga');
  },
  async accReject(el){
    const l=L(),a=(ACC[l.id].lista||[]).find(x=>x.user_id===el.dataset.u);if(!a)return;
    const {error}=await sb.rpc('reject_request',{p_id:l.id,p_user:a.user_id});
    if(error)return toast('Não deu: '+traduz(error));
    ACC[l.id].lista=ACC[l.id].lista.filter(x=>x.user_id!==a.user_id);
    closeSheet();render();toast('Pedido recusado');
  },
  async accRemove(el){
    const l=L(),a=(ACC[l.id].lista||[]).find(x=>x.user_id===el.dataset.u);if(!a)return;
    if(!confirm('Tirar @'+a.username+' da liga? O jogador e o histórico ficam.'))return;
    const {error}=await sb.rpc('remove_member',{p_id:l.id,p_user:a.user_id});
    if(error)return toast('Não deu: '+traduz(error));
    ACC[l.id].lista=ACC[l.id].lista.filter(x=>x.user_id!==a.user_id);
    closeSheet();render();toast('@'+a.username+' saiu da liga');
  }
});

/* ---------- Ajustes = convite + corpo + cartões do admin ----------
   Definido aqui (e não junto do corpo) porque precisa de CODE e logCard;
   declaração de função sobe, então drawApp o encontra normalmente.         */
function viewCfg(liga){
  const c=CODE[liga.id]||'——————';
  return `<div class="card" style="display:flex;align-items:center;gap:12px">
      <div style="min-width:0;flex:1">
        <div class="k">Código de convite</div>
        <div style="font-family:var(--disp);font-size:26px;letter-spacing:.16em;line-height:1.15">${esc(c)}</div>
        <div class="tiny muted">Quem tiver esse código entra nesta liga.</div>
      </div>
      <button class="btn ghost" data-a="copyCode" style="width:auto;padding:10px 14px">Copiar</button>
    </div>`+viewCfgBody(liga)+logCard(liga);
}
function logCard(liga){
  if(!souAdmin(liga))return '';
  const log=(liga.log||[]).slice(-25).reverse();
  const nome=pid=>{const p=P(liga,pid);return p?p.name:'(removido)'};
  const linha=e=>{
    let o=LOG_TXT[e.a]||e.a;
    if(e.a==='rank')o+=` de ${esc(nome(e.pid))}${e.role==='G'?' (gol)':''}: ${esc(rankLabel(liga,clamp(e.from,0,TOP)))} → ${e.to===null?'sem nível (calibrar do zero)':esc(rankLabel(liga,clamp(e.to,0,TOP)))}`;
    else if(e.a==='result')o+=`: ${e.from==='draw'?'empate':'time '+(e.from+1)} → ${e.to==='draw'?'empate':'time '+(e.to+1)}`;
    else if(e.a==='role')o+=` de ${esc(nome(e.pid))}: ${PAPEL[e.from]||'Jogador'} → ${PAPEL[e.to]||'Jogador'}`;
    else if(e.a==='link'||e.a==='unlink')o+=`: @${esc(e.user||'?')} ↔ ${esc(nome(e.pid))}`;
    else if(e.a==='delPlayer'||e.a==='newPlayer')o+=`: ${esc(e.name||nome(e.pid))}`;
    else if(e.a==='rename')o+=`: ${esc(e.from)} → ${esc(e.to)}`;
    else if(e.a==='esc')o+=`: ${esc(e.txt||'')}`;
    else if(e.a==='goal')o+=`: ${e.from?esc(nome(e.from))+(e.fromOwn?' (contra)':''):'sem autor'} → ${e.to?esc(nome(e.to))+(e.toOwn?' (contra)':''):'sem autor'}`;
    else if((e.a==='delMatch'||e.a==='backMatch')&&e.names)o+=`: ${esc(e.names[0])} ${e.score?e.score.join('-'):''} ${esc(e.names[1])}`;
    return `<div class="tiny" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted num">${new Date(e.ts).toLocaleDateString('pt-BR')} · @${esc(e.by||'?')}</span><br>${o}</div>`;
  };
  const sz=SIZE[liga.id];
  if(!sz||Date.now()-sz.at>60000)setTimeout(()=>loadSize(liga.id),0);
  const szTxt=sz&&sz.d?`No servidor: ${sz.d.matches} partida${sz.d.matches===1?'':'s'} · ${sz.d.players} jogadores · ${sz.d.log} correções · ${(sz.d.bytes/1024).toFixed(0)} KB`:'';
  return `${szTxt?`<div class="card"><div class="k" style="margin-bottom:6px">Tamanho da liga</div><div class="tiny muted">${szTxt}. Cada gravação manda só o que mudou; cada aparelho recebe só o delta.</div></div>`:''}
  <div class="card"><div class="k" style="margin-bottom:6px">Registro de correções</div>
    <div class="tiny muted" style="margin-bottom:6px">Quem mexeu no quê. Só o admin vê; nunca é apagado.</div>
    ${log.length?log.map(linha).join(''):'<div class="tiny muted">Nada corrigido ainda.</div>'}
    ${(liga.log||[]).length>25?`<div class="tiny muted" style="margin-top:6px">…e mais ${liga.log.length-25} no backup.</div>`:''}</div>`;
}

/* Enter envia o formulário da tela de conta / do código. */
document.addEventListener('keydown',e=>{
  const sh=$('#sheet'),aberta=!!(sh&&sh.classList.contains('on'));
  if(e.key==='Escape'&&aberta){e.preventDefault();closeSheet();return}
  if(e.key!=='Enter')return;
  if($('#au')&&$('#ap')){e.preventDefault();A[authMode==='criar'?'doSignup':'doLogin']();return}
  if($('#jc')&&document.activeElement===$('#jc')){e.preventDefault();A.doJoin();return}
  /* Enter num campo de texto da folha (nova liga, novo jogador…) aciona o botão principal dela */
  const ae=document.activeElement;
  if(aberta&&ae&&ae.tagName==='INPUT'&&sh.contains(ae)){
    const b=sh.querySelector('.btn.pri[data-a]');
    if(b){e.preventDefault();b.click()}
  }
});

/* Saindo da aba: grava agora, sem esperar o debounce (sendBeacon não serve —
   não dá para mandar o cabeçalho de autenticação nele). Voltando: busca o que
   mudou enquanto estava fora. */
document.addEventListener('visibilitychange',()=>{
  if(!ME)return;
  if(document.visibilityState==='hidden'){clearTimeout(syncT);flush()}
  else if(S.active)refetch(S.active);
});
/* Fechar a aba / o app no celular: última chance de gravar o que está sujo. */
const onWin=(ev,fn)=>{try{window.addEventListener(ev,fn)}catch(e){}};   // os testes rodam sem window de verdade
onWin('pagehide',()=>{if(ME&&dirty.size){clearTimeout(syncT);flush()}});
/* A rede voltou: grava agora, sem esperar o backoff. */
onWin('online',()=>{if(ME&&dirty.size){tentativas=0;clearTimeout(syncT);flush()}});
/* Soltou o campo de texto: se chegou atualização enquanto digitava, busca agora. */
document.addEventListener('focusout',()=>setTimeout(refetchPendentes,80));

boot();
</script>
