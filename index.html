/* De quem são os números na tela: o perfil escolhido, o seu, ou quem mais
   apareceu — nessa ordem. Mesma resolução na tela e no histórico do duelo.  */
function statsWhoId(liga,J){
  if(S.ui.statsWho&&P(liga,S.ui.statsWho))return S.ui.statsWho;
  const eu=euId(liga);if(eu)return eu;
  const src=J||statsLiga(liga,statsPeriodo(liga)).J;
  const top=Object.keys(src).sort((a,b)=>src[b].nR-src[a].nR)[0];
  return top||(liga.players[0]&&liga.players[0].id)||null;
}
function viewStats(liga){
  const eu=euId(liga),longa=liga.cfg.matchMode==='unica';   // +/- em destaque só na partida única (D-45)
  const per=statsPeriodo(liga);
  const tab=S.ui.statsTab==='racha'?'racha':'jogador';
  const soRacha=typeof per==='string'&&per.indexOf('racha:')===0;
  const {J,DU,PA}=statsLiga(liga,per,!!S.ui.statsSemGk);
  const who=statsWhoId(liga,J);
  const anoSel=per==='sempre'||per==='mes'||soRacha?null:(per==='ano'?ANO_ATUAL():per);
  const rot=per==='sempre'?'desde sempre':per==='mes'?'no último mês':soRacha?'no último racha':'em '+anoSel;
  /* filtro de período: os anos que existem no histórico + desde sempre */
  const anosLiga=[...new Set(liga.matches.filter(m=>!m.voided).map(m=>ANO(m.ts)))].sort((a,b)=>b-a);
  if(!anosLiga.includes(ANO_ATUAL()))anosLiga.unshift(ANO_ATUAL());
  const seg=`<div class="seg" style="margin-bottom:10px">
      <button class="${tab==='jogador'?'on':''}" data-a="statsTab" data-v="jogador">Jogador</button>
      <button class="${tab==='racha'?'on':''}" data-a="statsTab" data-v="racha">Racha</button>
    </div>
    <div class="chips perfil" style="gap:6px">
      <button class="tp ${soRacha?'sel':''}" data-a="statsPer" data-v="racha">Último</button>
      <button class="tp ${per==='mes'?'sel':''}" data-a="statsPer" data-v="mes">30 dias</button>
      ${anosLiga.map(y=>`<button class="tp ${anoSel===y?'sel':''}" data-a="statsPer" data-v="${y}">${y}</button>`).join('')}
      <button class="tp ${per==='sempre'?'sel':''}" data-a="statsPer" data-v="sempre">Sempre</button>
    </div>
    <div class="chips perfil" style="gap:6px;margin-top:6px">
      <button class="tp ${S.ui.statsSemGk?'sel':''}" data-a="statsSemGk" title="o tempo no gol sai das contas de time; menos vazado continua">🧤 sem goleiros</button>
    </div>`;
  if(!liga.matches.length)return `<div class="card">${seg}</div><div class="empty"><div class="big">Nada para contar ainda</div>
    Os números aparecem depois da primeira partida registrada.</div>`;
  const p=who?P(liga,who):null;
  const me=who&&J[who]?J[who]:{nR:0,jogos:0,v:0,e:0,d:0,gols:0,gk:0,seq:0,best:0,ultimos:[],sofridos:0};
  const av=pid=>`<span class="av">${esc(iniciais(nameOf(liga,pid)))}</span>`;

  /* --- a liga no período --- */
  const ms=liga.matches.filter(m=>!m.voided&&noPeriodo(m,per));
  const rachas={};ms.forEach(m=>rachas[m.sessionId||m.id]=1);
  const nRachasPer=Object.keys(rachas).length;   // nome proprio: nRachas() e a funcao global
  const golsTot=ms.reduce((a,m)=>a+(m.score||[0,0])[0]+(m.score||[0,0])[1],0);
  const empates=ms.filter(m=>m.result==='draw').length;

  /* --- duelos e parcerias da pessoa --- */
  const duelos=Object.keys(DU[who]||{}).map(id=>Object.assign({pid:id},DU[who][id])).sort((a,b)=>b.n-a.n||b.d-a.d);
  const parcerias=Object.keys(PA[who]||{}).map(id=>Object.assign({pid:id},PA[who][id])).sort((a,b)=>b.n-a.n);
  const comMin=arr=>arr.filter(x=>x.n>=Math.min(MIN_JOGOS,Math.max(3,Math.round(me.jogos/10))));
  const carrasco=[...comMin(duelos)].sort((a,b)=>(b.d-b.v)-(a.d-a.v)||b.d-a.d)[0];
  const fregues=[...comMin(duelos)].sort((a,b)=>(b.v-b.d)-(a.v-a.d)||b.v-a.v)[0];
  const dupla=[...comMin(parcerias)].sort((a,b)=>aprDe(b.v,b.e,b.n)-aprDe(a.v,a.e,a.n)||b.n-a.n)[0];
  const parceiro=parcerias[0];

  /* --- top 5 --- */

/* ---------- histórico ---------- */
function mrow(liga,m,compact,eu){
  const w=m.result,d=(m.disputes||[]).length;
  /* Até o 5v5 o time é a lista de quem entrou em quadra, não o apelido da cor
     (mesmo motivo do card da noite, D-60): semanas depois ninguém lembra qual
     time era o "Time A". O nome da cor continua na linha de baixo, no
     "venceu ...", e o placar vira um número por lado.                       */
  const ini=(m.startLineups||m.lineups||[[],[]]);
  const porNome=liga.cfg.format<=5&&(ini[0]||[]).length&&(ini[1]||[]).length;
  const nm=s=>`<span class="${w===s?'win':''}">${porNome?esc(nomesCurtos(liga,ini[s]).join(', ')):esc(m.names[s])}</span>`;
  const gol=s=>`<span class="s num sp">${porNome?m.score[s]:m.score[0]+' - '+m.score[1]}</span>`;
  const tre=(m.stints||[]).filter(x=>x.counted).length;
  const lado=eu?ladoNaPartida(liga,m,eu):null;
  const meu=lado===null?'':(w==='draw'?'E':(w===lado?'V':'D'));
  const cor=meu==='V'?'var(--ok)':meu==='D'?'var(--bad)':'var(--mute)';
  return `<div class="mrow${porNome?' nomes':''}${lado===null?'':' eu'}" ${m.voided?'style="opacity:.5"':''}>
    <div class="l1">${nm(0)}${lado===0?' <span class="mine" style="color:'+cor+'">VOCÊ</span>':''}
      ${gol(0)}</div>
    <div class="l1" style="margin-top:2px">${nm(1)}${lado===1?' <span class="mine" style="color:'+cor+'">VOCÊ</span>':''}
      ${m.voided?'<span class="flag" style="color:var(--bad);border:1px solid rgba(255,93,93,.4)">ANULADA</span>'
        :d?`<span class="flag" style="color:var(--gold);border:1px solid rgba(245,197,66,.45)">⚑ ${d}</span>`:''}
      ${porNome?gol(1):''}</div>
    <div class="l2">${new Date(m.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
      · ${w==='draw'?'empate':'venceu '+esc(m.names[w])}${m.mode==='unica'?' · partida única':''}${tre>1?' · '+tre+' trechos':''}${m.voided?' · sem efeito nos níveis':''}
      ${!compact&&(m.moves||[]).length?' · '+m.moves.length+' mudança(s) de nível':''}</div>
    ${compact?'':`<div class="row" style="gap:6px;margin-top:7px">
      <button class="btn sm ghost" data-a="contest" data-id="${m.id}">⚑ Contestar</button>
      ${souAdmin(liga)?`<button class="btn sm ghost" data-a="review" data-id="${m.id}">Revisar</button>`:''}</div>`}
  </div>`;
}
/* ---------- ficha completa de uma partida encerrada ----------
   A partida guarda muito mais do que o placar: quem estava em quadra em cada
   trecho, quem entrou e saiu, quem pegou no gol, o log de eventos com hora.
   `fichaPartida` remonta isso por jogador — é o que a revisão mostra.       */
function corTime(m,side){
  const i=(m.teamIdx?m.teamIdx[side]:side)||0;
  return ['var(--lime)','var(--coral)','var(--cyan)','var(--white)'][i%4];
}
function fichaPartida(liga,m){
  const sts=matchStints(liga,m),J={},ult=sts.length-1;
  const rel=t=>(m.startedAt&&Array.isArray(m.events))?gameTime(m,t):Math.max(0,(t||0)-(m.startedAt||m.ts));
  sts.forEach((st,i)=>{
    const part=stintPart(st);
    for(const pid in part){
      const x=part[pid];
      const j=J[pid]||(J[pid]={pid,side:x.side,min:0,minGk:0,gols:0,contra:0,trechos:0,iDe:i,iAte:i,gk:false});
      j.side=x.side;j.min+=st.dur||0;j.trechos++;j.iAte=i;
      if(x.role==='G'){j.gk=true;j.minGk+=st.dur||0}
    }
  });
  (m.goals||[]).forEach(g=>{const j=J[g.pid];if(!j)return;if(g.own)j.contra++;else j.gols++});
  const out=[];
  for(const pid in J){
    const j=J[pid],a=sts[j.iDe],b=sts[j.iAte];
    j.de=(j.iDe>0&&a&&a.from!==undefined)?rel(a.from):0;                 // entrou depois do apito inicial
    j.ate=(j.iAte<ult&&b&&b.to!==undefined)?rel(b.to):null;              // saiu antes do fim
    j.volta=j.trechos!==(j.iAte-j.iDe+1);                                // saiu e voltou no meio
    j.delta=(m.deltas||{})[pid];
    out.push(j);
  }
  return out.sort((x,y)=>x.side-y.side||y.min-x.min||nameOf(liga,x.pid).localeCompare(nameOf(liga,y.pid)));
}
/* Uma linha por jogador: tempo em quadra, papel, gols e o que aconteceu com
   ele na partida (entrou tarde, saiu antes, voltou depois).                 */
function fichaLinha(liga,m,j){
  const t=[];
  if(j.min)t.push(fmtMin(j.min));
  if(j.gk&&j.minGk&&j.minGk<j.min)t.push('no gol '+fmtMin(j.minGk));
  if(j.gols)t.push(pl(j.gols,'gol'));
  if(j.contra)t.push(j.contra+' contra');
  if(j.de)t.push('entrou '+mmss(j.de));
  if(j.ate!==null&&j.ate!==undefined)t.push('saiu '+mmss(j.ate));
  if(j.volta)t.push('voltou depois');
  /* sem número solto na ponta da linha: o +/− tem lugar próprio nos rankings,
     aqui ele só aparecia sem rótulo e ninguém sabia o que era               */
  return `<div class="rk3"><span class="pos">${j.gk?'🧤':'·'}</span>
    <div class="nm">${esc(nameOf(liga,j.pid))}${t.length?`<small>${t.join(' · ')}</small>`:''}</div></div>`;
}
/* Linha do tempo: o log bruto da partida em português. Gol é botão para o
   admin trocar o autor sem sair do contexto em que o gol aconteceu.         */
function revTempo(liga,m,podeEditar){
  const evs=[...(m.events||[])].sort((a,b)=>a.t-b.t);
  /* depois de uma correção de escalação, o autor de um gol pode ter deixado de
     jogar naquele lado: o gol continua valendo, mas a revisão avisa.        */
  const jogou=[emQuadraNo(liga,m,0),emQuadraNo(liga,m,1)];
  const foraDaEscala=g=>!!(g.pid&&!jogou[g.own?1-g.side:g.side].has(g.pid));
  const minDe=t=>m.startedAt?mmss(gameTime(m,t)):'';
  const row=(ic,txt,meta,min,side)=>`<div class="evr mut">
    <span class="num tiny muted t">${min}</span>
    <span class="pdot" style="background:${side===null?'var(--mute2)':corTime(m,side)}"></span>
    <div class="d"><div class="nm">${ic} ${txt}</div>${meta?`<div class="meta">${meta}</div>`:''}</div></div>`;
  const sc=[0,0];let gi=-1;
  const linhas=evs.map(ev=>{
    const min=minDe(ev.t);
    if(ev.type==='goal'){
      gi++;sc[ev.side]++;
      const g=(m.goals||[])[gi]||ev,i=gi,tag=podeEditar?'button':'div';
      const quem=g.pid?esc(nameOf(liga,g.pid))+(g.own?' <span class="tiny muted">(contra)</span>':'')
        :'<span class="muted">sem autor</span>';
      return `<${tag} class="evr" ${podeEditar?`data-a="goalScorerM" data-id="${m.id}" data-i="${i}"`:''}>
        <span class="num tiny muted t">${min}</span>
        <span class="pdot" style="background:${corTime(m,ev.side)}"></span>
        <div class="d"><div class="nm">⚽ ${quem}</div>
          <div class="meta">gol do ${esc(m.names[ev.side])}${foraDaEscala(g)?' · <b class="dn">⚠ o autor não estava em quadra</b>':''}${podeEditar?' · toque para corrigir o autor':''}</div></div>
        <span class="plc num">${sc[0]}-${sc[1]}</span></${tag}>`;
    }
    if(ev.type==='sub'){
      const sai=esc(nameOf(liga,ev.out));
      return row('⇄',ev.in?`Sai ${sai} · entra ${esc(nameOf(liga,ev.in))}`:`Sai ${sai}`,
        (ev.in?'troca':'saiu sem substituto')+' no '+esc(m.names[ev.side]),min,ev.side);
    }
    if(ev.type==='gk')return row('🧤',ev.id?esc(nameOf(liga,ev.id))+' foi para o gol':'sem goleiro fixo',
      'goleiro do '+esc(m.names[ev.side]),min,ev.side);
    if(ev.type==='pause')return row('⏸','Pausa','',min,null);
    if(ev.type==='resume')return row('▶','Voltou','',min,null);
    return '';
  }).join('');
  if(!linhas)return `<div class="tiny muted" style="padding:8px 2px">Esta partida foi lançada sem o log de eventos — ficaram só o placar e os gols.</div>`;
  const fim=`<div class="evr mut"><span class="num tiny muted t">${m.endedAt&&m.startedAt?mmss(gameTime(m,m.endedAt)):''}</span>
    <span class="pdot" style="background:var(--mute2)"></span>
    <div class="d"><div class="nm">🏁 Fim — ${m.score[0]}-${m.score[1]}</div>
      <div class="meta">${m.result==='draw'?'empate':'venceu '+esc(m.names[m.result])}</div></div></div>`;
  return `<div class="card" style="padding:0;overflow:hidden">${linhas}${fim}</div>`;
}
/* Trechos: cada formação que esteve em quadra, o que ela fez e se contou para
   o nível. É aqui que se enxerga por que uma partida virou dois jogos.      */
function revTrechos(liga,m){
  return matchStints(liga,m).map(st=>{
    const nomes=sd=>((st.lineups||[])[sd]||[]).map(id=>esc(nameOf(liga,id).split(' ')[0])+(((st.gks||[])[sd]===id)?' 🧤':'')).join(', ')||'—';
    const jan=(m.startedAt&&st.from!==undefined&&st.to!==undefined)?mmss(gameTime(m,st.from))+'–'+mmss(gameTime(m,st.to)):'';
    const sc=st.score||[0,0];
    const res=st.result==='draw'?'empate':'venceu '+esc(m.names[st.result]);
    const tam=[((st.lineups||[])[0]||[]).length,((st.lineups||[])[1]||[]).length];
    return `<div class="trecho${st.counted?'':' off'}">
      <div class="row" style="gap:8px"><b class="num" style="font-family:var(--disp);font-size:17px">${sc[0]}-${sc[1]}</b>
        <div class="tiny muted" style="min-width:0">${jan?jan+' · ':''}${tam[0]}v${tam[1]} · ${res}</div>
        <span class="flag sp" style="border:1px solid var(--line);color:${st.counted?'var(--ok)':'var(--mute)'}">${st.counted?'conta '+Math.round((st.w||0)*100)+'%':'descartado'}</span></div>
      <div class="tiny" style="margin-top:6px;color:${corTime(m,0)}">${nomes(0)}</div>
      <div class="tiny" style="color:${corTime(m,1)}">${nomes(1)}</div>
      ${st.counted?'':`<div class="tiny muted" style="margin-top:4px">curto demais para valer nível — os gols dele continuam no +/−</div>`}</div>`;
  }).join('');
}
/* O que a partida fez com o nível de cada um. Quem revisa é o admin, que já
   enxerga o Elo cru na escada, então o número pode aparecer aqui.           */
function revNivel(liga,m){
  if(m.voided)return `<div class="tiny muted" style="padding:6px 2px">Partida anulada: não mexeu no nível de ninguém.</div>`;
  const ds=Object.keys(m.deltas||{}).map(pid=>({pid,d:m.deltas[pid]||0})).sort((a,b)=>b.d-a.d);
  if(!ds.length)return `<div class="tiny muted" style="padding:6px 2px">Nada registrado — esta partida não moveu nível.</div>`;
  const mv={};(m.moves||[]).forEach(x=>{mv[x.pid]=x});
  return ds.map(x=>{
    const sob=mv[x.pid],pre=(m.pre||{})[x.pid];
    const nota=sob?`agora é ${esc(rankLabel(liga,sob.rank))}${sob.role==='G'?' no gol':''}`
      :(pre!==undefined?Math.round(pre)+' → '+Math.round(pre+x.d):'');
    return `<div class="rk3"><span class="pos">${sob?(sob.dir>0?'🔺':'🔻'):'·'}</span>
      <div class="nm">${esc(nameOf(liga,x.pid))}${nota?`<small>${nota}</small>`:''}</div>
      <span class="val num ${x.d>0?'up':x.d<0?'dn':''}">${pmTxt(x.d)}</span></div>`;
  }).join('');
}
/* A revisão inteira: ficha, quem jogou, linha do tempo, trechos e nível. As
   seções longas abrem sob demanda para o admin não rolar tela à toa.        */
function revDetalhe(liga,m){
  const sts=matchStints(liga,m),cont=sts.filter(st=>st.counted);
  const durTot=sts.reduce((a,st)=>a+(st.dur||0),0);
  const ficha=fichaPartida(liga,m),ab=S.ui.revAb||{};
  const sec=(k,titulo,nota,html,aberto)=>`<div class="sec"><div class="k2"><span>${titulo}</span>${nota?`<span class="tiny">${nota}</span>`:''}</div>
    ${aberto?html:''}<button class="more" data-a="revSec" data-k="${k}" data-id="${m.id}">${aberto?'▴ esconder':'▾ ver'}</button></div>`;
  const bloco=sd=>{
    const time=ficha.filter(j=>j.side===sd);

/* O histórico é por RACHA, não por partida: uma noite de 12 partidas em uma
   linha só. Tocar no racha abre as partidas dele. Partida lançada solta (sem
   sessão) vira um grupo do próprio dia.                                      */
function rachasDe(liga,ms){
  const g={},ordem=[];
  ms.forEach(m=>{
    const k=m.sessionId||('avulso-'+new Date(m.ts).toDateString());
    if(!g[k]){g[k]={id:k,ts:m.ts,fim:m.ts,ms:[],gols:0,dis:0,avulso:!m.sessionId};ordem.push(g[k])}
    const r=g[k];r.ms.push(m);r.ts=Math.min(r.ts,m.ts);r.fim=Math.max(r.fim,m.ts);
    r.gols+=(m.score||[0,0])[0]+(m.score||[0,0])[1];
    if((m.disputes||[]).length&&!m.voided)r.dis++;
  });
  return ordem.sort((a,b)=>b.fim-a.fim);
}
const DIA=ts=>{const d=new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  return d.charAt(0).toUpperCase()+d.slice(1)};   // só a primeira letra, nada de "De Ago."
function viewHist(liga){
  if(!liga.matches.length)return `<div class="empty"><div class="big">Nada registrado</div>As partidas aparecem aqui.</div>`;
  const dis=liga.matches.filter(m=>(m.disputes||[]).length&&!m.voided).length;
  const eu=euId(liga);
  const minhas=eu?liga.matches.filter(m=>ladoNaPartida(liga,m,eu)!==null):[];
  const so=!!(eu&&S.ui.histMine);
  const base=so?minhas:liga.matches;
  const grupos=rachasDe(liga,base);
  const aberto=grupos.find(r=>r.id===S.ui.histRacha);
  const topo=`${dis?`<div class="card" style="border-color:rgba(245,197,66,.4);margin-bottom:10px">
      <div class="row"><div><b>${dis}</b> partida(s) contestada(s)</div>
      <div class="tiny muted sp">aguardando revisão</div></div></div>`:''}
    ${eu?`<div class="row" style="gap:6px;margin-bottom:10px">
      <button class="btn sm ${so?'ghost':'pri'}" data-a="histMine" data-v="0" style="flex:1">Todas (${liga.matches.length})</button>
      <button class="btn sm ${so?'pri':'ghost'}" data-a="histMine" data-v="1" style="flex:1">Só as minhas (${minhas.length})</button>
    </div>`:''}`;
  /* --- dentro de um racha --- */
  if(aberto){
    const ms=aberto.ms.slice().sort((a,b)=>b.ts-a.ts);
    const art=(()=>{const c={};aberto.ms.forEach(m=>(m.goals||[]).forEach(g=>{if(g.pid&&!g.own)c[g.pid]=(c[g.pid]||0)+1}));
      const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
      return top?esc(nameOf(liga,top))+' '+c[top]+' gol'+(c[top]===1?'':'s'):null})();
    return topo+`
    <button class="btn sm ghost" data-a="histRacha" data-id="" style="margin-bottom:10px">‹ Todos os rachas</button>
    <div class="card" style="margin-bottom:10px">
      <div class="row"><div class="k">${aberto.avulso?'Partidas avulsas':'Racha'}</div>
        <div class="sp tiny muted">${DIA(aberto.ts)}</div></div>
      <h2 style="font-size:20px;margin:4px 0 6px">${ms.length} partida${ms.length===1?'':'s'}</h2>
      <div class="tiny muted">${aberto.gols} gol${aberto.gols===1?'':'s'}${art?' · artilheiro do racha: <b>'+art+'</b>':''}${aberto.dis?' · <span style="color:var(--gold)">⛑ '+aberto.dis+' contestada(s)</span>':''}</div>
    </div>
    <div class="card" style="padding:0">${ms.map(m=>mrow(liga,m,false,eu)).join('')}</div>`;
  }
  /* --- lista de rachas --- */
  return topo+`<div class="card" style="padding:0">
    ${grupos.length?grupos.slice(0,60).map(r=>{
      const v=r.ms.filter(m=>!m.voided).length;
      const meus=eu?r.ms.filter(m=>ladoNaPartida(liga,m,eu)!==null).length:0;
      return `<button class="rachaRow ${meus?'eu':''}" data-a="histRacha" data-id="${esc(r.id)}">
        <div style="min-width:0;flex:1">
          <div class="nm">${r.avulso?'Partidas avulsas':DIA(r.ts)}</div>
          <div class="meta"><span class="num">${v} partida${v===1?'':'s'}</span>
            <span class="num">${r.gols} gol${r.gols===1?'':'s'}</span>
            ${meus?`<span class="mine" style="color:var(--lime)">VOCÊ ${meus}</span>`:''}
            ${r.dis?`<span style="color:var(--gold)">⛑ ${r.dis}</span>`:''}</div>
        </div>
        <div style="color:var(--mute);font-size:18px">›</div>
      </button>`}).join('')
      :'<div class="empty">Nenhuma partida sua ainda.</div>'}</div>`;
}

/* ---------- membros e papéis ----------
   Quem está na liga, com que conta e com que permissão. Jogador sem conta é
   só um nome no cadastro — alguém lança por ele. Tocar abre a ficha, onde o
   admin muda o papel.                                                        */
const PAPEL={admin:'Admin',editor:'Editor',lancador:'Lançador',jogador:'Jogador'};
const PAPEL_ORD={admin:0,editor:1,lancador:2,jogador:3};
function membrosCardBase(liga){
  const eu=euId(liga),meu=meuPapel(liga),adm=souAdmin(liga);
  const comConta=liga.players.filter(p=>p.owner),semConta=liga.players.filter(p=>!p.owner);
  const ord=[...comConta].sort((a,b)=>(PAPEL_ORD[a.role]??2)-(PAPEL_ORD[b.role]??2)||a.name.localeCompare(b.name));
  return `<div class="card">
    <div class="row" style="margin-bottom:6px"><div class="k">Membros</div>
      <div class="sp tiny muted num">${comConta.length} com conta · ${semConta.length} só no cadastro</div></div>
    <div class="tiny muted" style="margin-bottom:10px">Você é <b>${PAPEL[meu]||'Jogador'}</b>${eu?'':' — ainda sem perfil vinculado'}.
      ${adm?'Toque num membro para mudar a permissão.':''}
      ${liga.players.some(p=>p.owner)?'':'<br>Enquanto ninguém vincular um perfil, todo mundo é admin.'}</div>
    ${ord.length?`<div class="card" style="padding:0;margin:0 0 ${semConta.length?'8px':'0'}">${ord.map(p=>`<div class="rank" data-a="pSheet" data-id="${p.id}">
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}${p.id===eu?' <span class="tiny muted">(você)</span>':''}</div>
        <div class="meta"><span class="tiny muted">@${esc(p.owner)}</span></div></div>
      <span class="pat" style="--pc:${p.role==='admin'?'var(--gold)':p.role==='editor'?'var(--cyan)':'var(--mute)'}">${PAPEL[p.role]||'Jogador'}</span>
      <div style="color:var(--mute);font-size:18px">›</div></div>`).join('')}</div>`
      :'<div class="tiny muted" style="margin-bottom:10px">Ninguém vinculou uma conta ainda. Aqui embaixo, cada um abre o próprio nome e toca em “Este perfil sou eu”.</div>'}
  </div>`;
};

/* ---------- barra inferior ---------- */
function barFor(liga){
  const lv=liga.live;
  if(S.ui.tab!=='racha')return '';
  if(!lv)return '<button class="btn wide pri" data-a="startRacha">▶ Iniciar racha</button>';
  if(lv.stage==='presenca')return `
    <button class="btn ghost" data-a="cancelRacha">Cancelar</button>
    <button class="btn pri" data-a="toTimes" ${lv.presentIds.length<4?'disabled':''}>Montar times (${lv.presentIds.length})</button>`;
  if(lv.stage==='times')return `
    <button class="btn ghost" data-a="backPres">Voltar</button>
    <button class="btn pri" data-a="startJogo">▶ Começar racha</button>`;
  if(!lv.cur)return `
    <button class="btn ghost" data-a="endRacha">Encerrar racha</button>
    <button class="btn pri" data-a="startMatch">▶ Começar partida</button>`;
  const c=lv.cur,n=[lv.teams[c.a].name,lv.teams[c.b].name];
  const txt=c.score[0]===c.score[1]?`Empate ${c.score[0]}-${c.score[1]}`
    :`${c.score[0]>c.score[1]?n[0]:n[1]} ${Math.max(...c.score)}-${Math.min(...c.score)}`;
  /* Nada de "Encerrar racha" ao lado do "Fim": um toque errado com o proximo
     time entrando nao pode acabar com a noite.                              */
  return `<button class="btn ghost" data-a="undo" style="flex:0 0 62px;padding:13px 0" title="desfazer">↶</button>
    <button class="btn pri" data-a="endMatch">✓ Fim · ${esc(txt)}</button>`;

/* ---------- relógio ---------- */
let clockTimer=null;
function tickClock(){
  clearInterval(clockTimer);
  const el=$('#clk');if(!el)return;
  const liga=L(),c=liga&&liga.live&&liga.live.cur;if(!c)return;
  const upd=()=>{
    const s=Math.floor(gameTime(c,Date.now())/1000);
    el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    const alvoGols=liga.cfg.targetGoals>0&&(c.score[0]>=liga.cfg.targetGoals||c.score[1]>=liga.cfg.targetGoals);
    el.classList.toggle('hit',!c.paused&&(s>=liga.cfg.targetMin*60||alvoGols));
  };
  upd();
  if(!c.paused)clockTimer=setInterval(upd,1000);
}
/* A tela não pode apagar com o cronômetro rodando — o celular fica no chão
   da quadra e ninguém quer digitar senha para marcar um gol. Só durante a
   partida: fora dela, solta e deixa o aparelho economizar bateria.          */
let wake=null;
async function manterAcesa(sim){
  try{
    if(!navigator.wakeLock)return;
    if(sim&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
    else if(!sim&&wake){await wake.release();wake=null}
  }catch(e){}
}
function cuidaWake(){
  const liga=L(),c=liga&&liga.live&&liga.live.cur;
  manterAcesa(!!(c&&!c.paused)&&document.visibilityState==='visible');
}

  slotSet(el){const lv=L().live;lv.sel=el.dataset.id;closeSheet();A.toTeam({dataset:{i:el.dataset.i}})},

  lateSheet(){

  },
  /* Sai do racha no meio: presença, time, fila, rodízio de goleiro — e, se
     estava em quadra, sai da partida sem ninguém no lugar (o trecho seguinte
     conta com um a menos, como aconteceu de verdade).                       */
  leaveRacha(el){

  lateTeam(el){

    lv.teams.forEach(t=>{const k=t.ids.indexOf(id);if(k>=0)t.ids.splice(k,1)});

  lateGk(el){
    const l=L(),lv=l.live,id=el.dataset.id;
    lv.teams.forEach(t=>{const k=t.ids.indexOf(id);if(k>=0)t.ids.splice(k,1)});
    lv.gkToday=lv.gkToday||[];if(!lv.gkToday.includes(id))lv.gkToday.push(id);
    lv.gkPool=lv.gkPool||[];if(!lv.gkPool.includes(id))lv.gkPool.push(id);
    closeSheet();save();render();toast('Entrou no rodízio de goleiros');
  },

  /* ----- partida ----- */
  /* Times fechados: o racha começa, mas a partida não. A tela seguinte é a de
     "Próxima partida" — quem joga, escalação, chance — e só o apito é o botão
     "Começar partida". Assim dá para conferir/trocar quem entra antes do relógio. */
  startJogo(){
    const l=L(),lv=l.live;
    if(lv.teams.length<2)return toast('Monte os times primeiro');
    if(!Array.isArray(lv.queue))lv.queue=[];
    lv.stage='jogo';lv.cur=null;
    lv.per=lv.per||perTeamSize(l,(lv.gkPool||[]).length>0);
    lv.teams.forEach(t=>{t.orig=t.ids.slice()});      // composição original: é contra ela que o ⇄ é marcado
    lv.nextPair=suggestPair(l,lv);resetFill(lv);
    save();render();
  },
  startMatch(){
    const l=L(),lv=l.live;
    if(lv.cur)return;
    if(lv.teams.length<2)return toast('Monte os times primeiro');
    if(!Array.isArray(lv.queue))lv.queue=[];
    const all=lv.teams.map((_,i)=>i);
    let pair=(lv.nextPair||[]).filter(i=>all.includes(i));
    if(pair.length!==2||pair[0]===pair[1])pair=suggestPair(l,lv);
    const [a,b]=pair;
    /* quem espera continua na ordem em que esperava; time novo (ou que ainda
       não passou pela fila) entra no fim. Reconstruir na ordem dos times
       aqui era o que fazia o D nunca jogar com 4 times.                    */
    const fila=(lv.queue||[]).filter(i=>all.includes(i)&&i!==a&&i!==b);
    lv.queue=fila.concat(all.filter(i=>i!==a&&i!==b&&!fila.includes(i)));
    lv.nextPair=null;
    lv.lastEnd=null;               // partida nova no relógio: a anterior não tem mais volta
    lv.stage='jogo';
    lv.per=lv.per||perTeamSize(l,(lv.gkPool||[]).length>0);
    // ninguém joga com mais gente que o adversário: o time menor é completado
    // com quem está de fora e, se ainda faltar, o maior entra com menos
    const f=fillDe(l,lv,[a,b]);
    const esc0=[lv.teams[a].ids.slice(0,lv.per).concat(f[0]),lv.teams[b].ids.slice(0,lv.per).concat(f[1])];
    const per=Math.min(lv.per,esc0[0].length,esc0[1].length);
    const gks=commitGks(l,lv,[a,b]);
    lv.cur={a,b,startedAt:Date.now(),score:[0,0],events:[],paused:false,
      lineups:[esc0[0].slice(0,per),esc0[1].slice(0,per)],gks,
      fill:[f[0].slice(),f[1].slice()]};
    resetFill(lv);
    [0,1].forEach(sd=>{
      const g=gks[sd];
      if(g&&!lv.cur.lineups[sd].includes(g))lv.cur.lineups[sd].push(g);
      if(!gks[sd]){                                   // goleiro do dia escalado no time assume o gol
        const dono=lv.cur.lineups[sd].find(id=>ehGkHoje(lv,id));
        if(dono)gks[sd]=dono;
      }
    });
    /* escalação e goleiros de largada: é a partir daqui que os trechos são reconstruídos */
    lv.cur.startLineups=lv.cur.lineups.map(x=>[...x]);
    lv.cur.startGks=[...gks];
    save();render();
  },
  goal(el){
    const l=L(),c=l.live&&l.live.cur;if(!c)return;
    const s=+el.dataset.s;
    c.score[s]++;c.events.push({t:Date.now(),type:'goal',side:s,pid:null});
    buzz(18);save();render();
    if(l.cfg.askScorer)showScorer(s);
  },
  ungoal(el){
    const lv=L().live,c=lv&&lv.cur;if(!c)return;
    const s=+el.dataset.s;
    if(!c.score[s])return;
    c.score[s]--;
    for(let i=c.events.length-1;i>=0;i--)if(c.events[i].type==='goal'&&c.events[i].side===s){c.events.splice(i,1);break}
    save();render();
  },
  scorer(el){
    const l=L(),c=l.live&&l.live.cur;if(!c)return;
    const pid=el.dataset.id,own=!!(pid&&el.dataset.own==='1');
    for(let i=c.events.length-1;i>=0;i--)if(c.events[i].type==='goal'){c.events[i].pid=pid||null;c.events[i].own=own;break}
    clearTimeout(showScorer._t);
    save();render();                       // o card Gols precisa mostrar o autor na hora
    if(pid)toast((own?'Gol contra de ':'Gol de ')+nameOf(l,pid));
  },
  /* alterna a barra / a folha entre os nomes do time que marcou e os do outro (gol contra) */
  scorerSide(el){
    if(el.dataset.for==='goalScorerM'){const [id,i]=el.dataset.t.split('|');return A.goalScorerM({dataset:{id,i,own:el.dataset.own}})}
    const lv=L().live,c=lv&&lv.cur;if(!c)return;
    if(el.dataset.for==='goalScorer')return A.goalScorer({dataset:{t:el.dataset.t,own:el.dataset.own}});
    for(let i=c.events.length-1;i>=0;i--)if(c.events[i].type==='goal'){showScorer(c.events[i].side,el.dataset.own==='1');break}
  },
  gkSheet(el){
    const l=L(),lv=l.live,c=lv&&lv.cur;if(!c)return;
    const s=+el.dataset.s;
    const pool=(lv.gkPool||[]).filter(id=>id!==c.gks[s]);
    openSheet(`<h2>Goleiro — ${esc(lv.teams[s===0?c.a:c.b].name)}</h2>
      ${pool.length?`<div class="k" style="margin-bottom:8px">No rodízio</div>
        <div class="chips" style="margin-bottom:14px">${pool.map(id=>`<button class="tp" data-a="setGk" data-s="${s}" data-id="${id}">🧤 ${esc(nameOf(l,id))}${id===c.gks[s===0?1:0]?' <small>do outro lado</small>':''}</button>`).join('')}</div>`:''}
      <div class="k" style="margin-bottom:8px">Improvisar alguém do time</div>
      <div class="chips" style="margin-bottom:14px">
        ${c.lineups[s].map(id=>`<button class="tp" data-a="setGk" data-s="${s}" data-id="${id}">${esc(nameOf(l,id))}</button>`).join('')}
      </div>
      <button class="btn wide ghost" data-a="setGk" data-s="${s}" data-id="">Sem goleiro definido</button>
      <div class="tiny muted" style="margin-top:10px;line-height:1.5">Quem está no rodízio troca de lado a cada partida e não ganha nem perde nível. Quem improvisa no gol continua contando normalmente pelo time.</div>`);
  },
  setGk(el){
    const l=L(),lv=l.live,c=lv&&lv.cur;if(!c)return;
    const s=+el.dataset.s,id=el.dataset.id||null;
    const other=s===0?1:0;
    if(id&&c.gks[other]===id)c.gks[other]=c.gks[s]||null;   // veio do gol do outro time: os dois trocam de lugar
    c.gks[s]=id;
    const mv=movesGk(c.lineups,c.gks);aplicaMv(c.lineups,mv);   // cada goleiro joga (e conta) do lado novo
    /* trocar quem está no gol muda o nível dos dois lados: fecha o trecho */
    c.events.push({t:Date.now(),type:'gk',side:s,id,gks:[...c.gks],mv});
    closeSheet();save();render();
  },
  undo(){
    const l=L(),lv=l.live;if(!lv)return;
    const c=lv.cur;
    if(!c||!c.events.length){
      if(!lv.matchIds.length)return toast('Nada para desfazer');
      return A.delMatch({dataset:{id:lv.matchIds[lv.matchIds.length-1]}});
    }
    const ev=c.events.pop();
    if(ev.type==='goal')c.score[ev.side]--;
    if(ev.type==='sub'){
      if(!ev.in){if(!c.lineups[ev.side].includes(ev.out))c.lineups[ev.side].push(ev.out)}
      else{const k=c.lineups[ev.side].indexOf(ev.in);if(k>=0)c.lineups[ev.side][k]=ev.out}
      const t=l.live.teams[ev.side===0?c.a:c.b],j=t.ids.indexOf(ev.in),j0=t.ids.indexOf(ev.out);
      if(j>=0&&j0>=0){t.ids[j]=ev.out;t.ids[j0]=ev.in}              // só a troca titular ⇄ reserva mexeu no time
    }
    if(ev.type==='pause')c.paused=false;
    if(ev.type==='resume')c.paused=true;
    if(ev.type==='gk')aplicaMv(c.lineups,ev.mv,true); // quem trocou de lado volta para a escalação de antes
    if(ev.type==='sub'||ev.type==='gk'){              // volta os goleiros para o estado anterior
      let ant=null;
      for(let i=c.events.length-1;i>=0;i--){const e=c.events[i];
        if(Array.isArray(e.gks)){ant=e.gks;break}}
      c.gks=ant?[...ant]:[...(c.startGks||c.gks)];
      if(ev.type==='gk'&&!ev.mv)aplicaMv(c.lineups,movesGk(c.lineups,c.gks));  // evento da versão antiga
    }
    save();render();toast('Desfeito');
  },
  outPick(el){                      // toquei em quem está em quadra
    const l=L(),lv=l.live;if(!lv.cur)return;
    const s=+el.dataset.s,out=el.dataset.id,opts=benchList(l,lv);
    openSheet(`<h2>Sai ${esc(nameOf(l,out))} — quem entra?</h2>
      <div class="chips">${opts.length
        ?opts.map(o=>`<button class="tp big" data-a="doSub" data-s="${s}" data-out="${out}" data-id="${o.id}">
          ${esc(nameOf(l,o.id))}${o.from?' <small>'+esc(o.from)+'</small>':''}</button>`).join('')
        :'<span class="tiny muted">Ninguém no banco. Use “chegou agora” ou marque mais gente na presença.</span>'}</div>
      <div style="height:12px"></div><button class="btn wide ghost" data-a="closeSheet">Cancelar</button>`);
  },
  inPick(el){                       // toquei em quem está fora
    const l=L(),lv=l.live,c=lv.cur;if(!c)return;
    const inn=el.dataset.id;
    openSheet(`<h2>${esc(nameOf(l,inn))} entra no lugar de quem?</h2>
      ${[0,1].map(s=>`<div class="teamtag ${TEAMBG[s===0?c.a:c.b]}">${esc(lv.teams[s===0?c.a:c.b].name)}</div>
        <div class="chips" style="margin-bottom:12px">${c.lineups[s].map(x=>`<button class="tp big" data-a="doSub" data-s="${s}" data-out="${x}" data-id="${inn}">${esc(nameOf(l,x))}</button>`).join('')}</div>`).join('')}
      <button class="btn wide ghost" data-a="closeSheet">Cancelar</button>`);
  },
  doSub(el){
    const l=L(),lv=l.live,c=lv.cur;if(!c)return;
    const s=+el.dataset.s,out=el.dataset.out,inn=el.dataset.id,pool=lv.gkPool||[];
    const k=c.lineups[s].indexOf(out);
    if(k>=0)c.lineups[s][k]=inn;else c.lineups[s].push(inn);
    /* Substituição vale só para ESTA partida. Quem entra emprestado (da fila
       ou de outro time) volta para onde estava na próxima; quem saiu continua
       no time dele. Mexer nos times aqui deixava um time com um a menos e
       mandava o substituído para a fila sem ninguém pedir. A única troca que
       fica é titular ⇄ reserva dentro do mesmo time.                        */
    if(!pool.includes(out)&&!pool.includes(inn)){
      const ti=s===0?c.a:c.b,t=lv.teams[ti];
      const jOut=t.ids.indexOf(out),jIn=t.ids.indexOf(inn);
      if(jIn>=0&&jOut>=0){const tmp=t.ids[jOut];t.ids[jOut]=t.ids[jIn];t.ids[jIn]=tmp}   // titular ⇄ reserva
    }
    if(c.gks[s]===out)c.gks[s]=pool.includes(inn)?inn:null;
    c.events.push({t:Date.now(),type:'sub',side:s,out,in:inn,gks:[...c.gks]});
    closeSheet();save();render();toast('Entrou '+nameOf(l,inn));
  },
  finish(el){
    const l=L(),lv=l.live,c=lv.cur;if(!c)return;
    const result=el.dataset.r==='draw'?'draw':+el.dataset.r;
    const endedAt=Date.now();
    if(c.paused){c.events.push({t:endedAt,type:'resume'});c.paused=false}
    const modo=lv.mode||l.cfg.matchMode||'curtas';
    /* cada formação em campo vira um trecho: é isso que o nível enxerga */
    const stints=splitStints(c,endedAt,l.cfg,modo);
    /* se o vencedor foi corrigido na mão, quem manda é a correção: ela vale
       para o trecho que fechou a partida.                                    */
    if(stints.length){
      const last=stints[stints.length-1];
      const alvo=last.counted?last:stints.filter(s=>s.counted).sort((a,b)=>b.dur-a.dur)[0];
      /* trecho final descartado: o resultado da partida vai para o maior que conta;
         final contando: só se o resultado lançado diverge do placar (correção) */
      if(alvo&&(!last.counted||result!==stintResult(c.score)))alvo.result=result;
    }
    const m={id:uid(),ts:endedAt,startedAt:c.startedAt,endedAt,sessionId:lv.id||null,mode:modo,
      names:[lv.teams[c.a].name,lv.teams[c.b].name],
      teamIdx:[c.a,c.b],lineups:c.lineups.map(x=>[...x]),
      startLineups:(c.startLineups||c.lineups).map(x=>[...x]),
      gks:[...c.gks],stints,score:[...c.score],result,
      /* gol sem autor fica registrado com pid nulo: é assim que os destaques
         sabem se a artilharia do período é confiável ("gols sem autor demais") */
      goals:c.events.filter(e=>e.type==='goal').map(e=>({pid:e.pid||null,side:e.side,own:!!e.own,t:e.t,min:gameTime(c,e.t)})),
      /* o log bruto (gols, substituições, pausas, com hora) fica inteiro: os
         trechos são derivados dele, e estatística futura pode querer o resto */
      events:c.events.map(e=>Object.assign({},e)),
      disputes:[],voided:false};
    applyMatch(l,m);
    l.matches.push(m);lv.matchIds.push(m.id);
    /* instantâneo para "Voltar a partida": o Fim sem querer tem volta — guarda a
       partida e o estado da rodada ANTES do giro (times, fila, vencedor, goleiros) */
    lv.lastEnd={mid:m.id,endedAt,cur:JSON.parse(JSON.stringify(c)),
      teams:lv.teams.map(t=>[...t.ids]),queue:[...lv.queue],
      fila:Array.isArray(lv.fila)?[...lv.fila]:null,
      lastWinner:lv.lastWinner===undefined?null:lv.lastWinner,
      lastSide:lv.lastSide===undefined?null:lv.lastSide,
      lastStay:Array.isArray(lv.lastStay)?[...lv.lastStay]:null,
      lastGks:lv.lastGks?Object.assign({},lv.lastGks):null,
      nextPair:Array.isArray(lv.nextPair)?[...lv.nextPair]:null};
    lv.lastGks={};lv.lastGks[c.a]=c.gks[0]||null;lv.lastGks[c.b]=c.gks[1]||null;   // para o goleiro do vencedor ficar
    const saiu=[];
    /* lastStay: quem FICA em quadra — é com esse time que o goleiro fica */
    if(lv.teams.length>2){
      if(!l.cfg.winnerStays||(result==='draw'&&lv.teams.length>3)){   // 4 times e empate: os dois saem
        lv.lastWinner=null;lv.lastSide=null;lv.lastStay=[];lv.queue.push(c.a,c.b);saiu.push(c.a,c.b);
      }else if(result==='draw'){
        /* 3 times e empate: um fica — o que entrou por último (o outro já estava, e sai) */
        const fica=(lv.lastWinner===c.a)?c.b:(lv.lastWinner===c.b)?c.a:c.b,sai=fica===c.a?c.b:c.a;
        lv.lastWinner=fica;lv.lastSide=fica===c.a?0:1;lv.lastStay=[fica];lv.queue.push(sai);saiu.push(sai);
      }else{
        const winner=result===0?c.a:c.b,perdedor=winner===c.a?c.b:c.a;
        lv.lastWinner=winner;lv.lastSide=result===0?0:1;lv.lastStay=[winner];lv.queue.push(perdedor);saiu.push(perdedor);
      }
    }else{
      lv.lastWinner=result==='draw'?null:(result===0?c.a:c.b);lv.lastSide=result==='draw'?null:result;
      lv.lastStay=result==='draw'?[c.a,c.b]:[lv.lastWinner];
      /* dois times: quem perdeu não sai de quadra, mas o time dele roda com a fila */
      if(result!=='draw'&&l.cfg.winnerStays)saiu.push(result===0?c.b:c.a);
    }
    /* "de próximo": quem estava esperando entra no lugar de quem saiu */
    const giros=saiu.map(i=>({i,r:rodaFila(l,lv,i)})).filter(x=>x.r&&x.r.entram.length);
    lv.cur=null;lv.nextPair=suggestPair(l,lv);resetFill(lv);
    closeSheet();save();render();
    /* sem modal e sem falar de nível aqui: o que mudou aparece no fim do racha */
    const placar=result==='draw'?`Empate ${m.score[0]}-${m.score[1]}`
      :`${m.names[result]} ${Math.max(...m.score)}-${Math.min(...m.score)}`;
    toast(giros.length
      ?`${placar} · entra ${giros[0].r.entram.map(id=>nameOf(l,id).split(' ')[0]).join(', ')}`
      :`${placar} · registrado`);
  },

  /* ----- contestação e revisão ----- */

    m.disputes=m.disputes||[];

    closeSheet();save();render();

  /* ----- corrigir escalação e trocas -----
     Tudo aqui mexe no RASCUNHO (ESC.m, uma cópia da partida). O Salvar é que
     escreve na partida, registra no log e recalcula a liga do zero.        */
  editEsc(el){

    if(!souAdmin(l))return toast('Só o admin da liga corrige a escalação');

  escPick(el){

        :'<span class="tiny muted">Todo mundo do cadastro já está nesta partida.</span>'}</div>
      <div style="height:14px"></div><button class="btn wide ghost" data-a="editEsc" data-id="${m.id}">Voltar</button>`);

  escGk(el){
    const l=L(),r=rascunhoEsc(l.matches.find(x=>x.id===el.dataset.id));if(!r||!souAdmin(l))return;
    const m=r.m,s=+el.dataset.s,pid=el.dataset.pid,gks=gksIni(m);
    const novo=gks[s]===pid?null:pid;
    gks[s]=novo;m.startGks=gks;
    ajustaGksEventos(m,s,m.startedAt,novo);
    mudaEsc(l,r,novo?nameOf(l,pid)+' começou no gol':m.names[s]+' começou sem goleiro fixo');
  },
  escDel(el){
    const l=L(),r=rascunhoEsc(l.matches.find(x=>x.id===el.dataset.id));if(!r||!souAdmin(l))return;
    const m=r.m,s=+el.dataset.s,pid=el.dataset.pid;
    const ini=(m.startLineups||m.lineups||[[],[]]).map(x=>(x||[]).slice());
    ini[s]=ini[s].filter(id=>id!==pid);
    m.startLineups=ini;
    const gks=gksIni(m);
    if(gks[s]===pid){gks[s]=null;m.startGks=gks;ajustaGksEventos(m,s,m.startedAt,null)}
    const trocas=(m.events||[]).filter(e=>(e.type==='sub'&&(e.out===pid||e.in===pid))||(e.type==='gk'&&e.id===pid)).length;
    m.events=(m.events||[]).filter(e=>!((e.type==='sub'&&(e.out===pid||e.in===pid))||(e.type==='gk'&&e.id===pid)));
    m.events.forEach(e=>{if(Array.isArray(e.gks))e.gks=e.gks.map(g=>g===pid?null:g)});
    /* quem não jogou não fez gol: o gol continua no placar, mas sem autor */
    const gols=(m.goals||[]).filter(g=>g.pid===pid).length;
    (m.goals||[]).forEach(g=>{if(g.pid===pid){g.pid=null;g.own=false}});
    m.events.forEach(e=>{if(e.type==='goal'&&e.pid===pid){e.pid=null;e.own=false}});
    mudaEsc(l,r,nameOf(l,pid)+' não jogou'
      +(trocas?' · '+pl(trocas,'troca')+' apagada'+(trocas===1?'':'s'):'')
      +(gols?' · '+pl(gols,'gol')+' sem autor':''));
  },
  escSwap(el){
    const l=L(),r=rascunhoEsc(l.matches.find(x=>x.id===el.dataset.id));if(!r||!souAdmin(l))return;
    const m=r.m,pid=el.dataset.pid,por=el.dataset.por;
    if(!por||por===pid)return A.editEsc({dataset:{id:m.id}});
    const tr=id=>id===pid?por:id;
    m.startLineups=(m.startLineups||m.lineups||[[],[]]).map(x=>(x||[]).map(tr));
    m.lineups=(m.lineups||[[],[]]).map(x=>(x||[]).map(tr));
    m.gks=(m.gks||[null,null]).map(tr);
    m.startGks=gksIni(m).map(tr);
    (m.events||[]).forEach(e=>{
      if(e.out===pid)e.out=por;
      if(e.in===pid)e.in=por;
      if(e.id===pid)e.id=por;
      if(e.pid===pid)e.pid=por;
      if(Array.isArray(e.gks))e.gks=e.gks.map(tr);
      if(Array.isArray(e.mv))e.mv.forEach(x=>{if(x.id===pid)x.id=por});
    });
    (m.goals||[]).forEach(g=>{if(g.pid===pid)g.pid=por});
    mudaEsc(l,r,'Quem jogou era '+nameOf(l,por)+', não '+nameOf(l,pid));
  },
  escAdd(el){

    const m=r.m,s=+el.dataset.s,noJogo=genteDaPartida(m);

      <div class="chips">${fora.length?fora.map(p=>`<button class="tp big" data-a="escAddDo" data-id="${m.id}" data-s="${s}" data-pid="${p.id}">${esc(p.name)}</button>`).join('')
        :'<span class="tiny muted">Todo mundo do cadastro já está nesta partida.</span>'}</div>
      <div style="height:14px"></div><button class="btn wide ghost" data-a="editEsc" data-id="${m.id}">Voltar</button>`);

  escAddDo(el){

    const m=r.m,s=+el.dataset.s,pid=el.dataset.pid;

  },
  evPick(el){
    const l=L(),r=rascunhoEsc(l.matches.find(x=>x.id===el.dataset.id));if(!r||!souAdmin(l))return;
    const m=r.m,i=+el.dataset.i,ev=(m.events||[])[i];if(!ev)return;
    const emQuadra=escalaEm(l,m,ev.t,ev.side),fora=foraDeQuadra(l,m,ev.t);
    const chip=(id,k,sel)=>`<button class="tp big ${sel?'sel':''}" data-a="evSet" data-id="${m.id}" data-i="${i}" data-k="${k}" data-v="${id}">${esc(nameOf(l,id))}</button>`;
    openSheet(`<h2>${ev.type==='sub'?'Troca':'Troca de goleiro'} aos ${mmss(gameTime(m,ev.t))}</h2>
      <div class="tiny muted" style="margin-bottom:12px">${esc(m.names[ev.side])}</div>
      ${ev.type==='sub'?`
        <div class="k" style="margin-bottom:6px">Quem saiu</div>
        <div class="chips" style="margin-bottom:14px">${emQuadra.map(id=>chip(id,'out',ev.out===id)).join('')}</div>
        <div class="k" style="margin-bottom:6px">Quem entrou</div>
        <div class="chips" style="margin-bottom:16px">${fora.map(id=>chip(id,'in',ev.in===id)).join('')}

  evSet(el){

  evDel(el){

    const m=r.m,i=+el.dataset.i,ev=(m.events||[])[i];if(!ev)return;
    let antes=null;
    if(ev.type==='gk'){                       // sem este evento, quem volta a valer é o goleiro de antes
      const sts=matchStints(l,m);let st=sts[0];
      sts.forEach(x=>{if(x.from!==undefined&&x.from<ev.t)st=x});
      antes=((st||{}).gks||[])[ev.side]||null;
    }
    m.events=(m.events||[]).filter((e,k)=>k!==i);
    if(ev.type==='gk')ajustaGksEventos(m,ev.side,ev.t,antes);

    else if(k==='out')nt.out=v;

    if(nt.tipo==='gk'&&nt.gk===null)return toast('Escolha quem foi para o gol');
    const t=tDoMinuto(m,nt.min);

      m.events.push({t,type:'sub',side:nt.side,out:nt.out,in:nt.in||null});

    }else{
      m.events.push({t,type:'gk',side:nt.side,id:nt.gk||null});

      txt='Aos '+mmss(nt.min)+': '+(nt.gk?nameOf(l,nt.gk)+' foi para o gol':'ficou sem goleiro fixo');
    }
    m.events.sort((a,b)=>a.t-b.t);
    r.nt=null;
    mudaEsc(l,r,txt);
  },
  /* Salvar: o rascunho vira a partida, cada mudança entra no registro de
     correções e a liga é recalculada do zero.                              */
  escSalvar(el){
    const l=L(),r=ESC;if(!r||!souAdmin(l))return;
    const m=l.matches.find(x=>x.id===r.mid);if(!m)return;
    if(!r.mud.length){ESC=null;return A.review({dataset:{id:m.id}})}
    ['startLineups','startGks','lineups','gks','events','goals','stints'].forEach(k=>{m[k]=r.m[k]});
    recalcPartida(l,m);
    r.mud.forEach(txt=>logAdd(l,'esc',{mid:m.id,txt}));
    const n=r.mud.length;ESC=null;
    rebuildAll(l);save();render();
    A.review({dataset:{id:m.id}});
    toast(pl(n,'correção','correções')+' salva'+(n===1?'':'s')+' · níveis recalculados');
  },
  escDescartar(el){
    const id=(ESC&&ESC.mid)||el.dataset.id;
    if(ESC&&ESC.mud.length&&!confirm('Descartar '+pl(ESC.mud.length,'mudança','mudanças')+' que você ainda não salvou?'))return;
    ESC=null;A.review({dataset:{id}});
  },
  /* autor de um gol numa partida já encerrada (revisão): a lista é quem esteve
     em quadra pelo time que marcou; "contra" troca para o outro time         */
  goalScorerM(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin da liga revisa partidas');
    const i=+el.dataset.i,g=(m.goals||[])[i];if(!g)return;
    const contra=el.dataset.own!==undefined?el.dataset.own==='1':!!g.own,lado=contra?1-g.side:g.side;
    const em=new Set();matchStints(l,m).forEach(st=>(st.lineups[lado]||[]).forEach(id=>em.add(id)));
    openSheet(`<h2>Quem fez esse gol?</h2>
      <div class="row" style="margin-bottom:10px"><div class="tiny muted">gol do ${esc(m.names[g.side])}${g.min!==undefined?' · '+mmss(g.min):''}</div>
        ${scorerTabs('goalScorerM',m.id+'|'+i,contra)}</div>
      <div class="chips">${[...em].map(id=>`<button class="tp big ${g.pid===id&&!!g.own===contra?'sel':''}" data-a="setGoalScorerM" data-id="${m.id}" data-i="${i}" data-pid="${id}" data-own="${contra?1:0}">${esc(nameOf(l,id))}</button>`).join('')}
        <button class="tp big" data-a="setGoalScorerM" data-id="${m.id}" data-i="${i}" data-pid="">sem autor</button></div>
      <div style="height:12px"></div><button class="btn wide ghost" data-a="review" data-id="${m.id}">Voltar à revisão</button>`);
  },
  setGoalScorerM(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin da liga revisa partidas');
    const i=+el.dataset.i,g=(m.goals||[])[i];if(!g)return;
    const pid=el.dataset.pid||null,own=!!(pid&&el.dataset.own==='1');
    if(g.pid===pid&&!!g.own===own)return A.review({dataset:{id:m.id}});
    logAdd(l,'goal',{mid:m.id,i,from:g.pid,fromOwn:!!g.own,to:pid,toOwn:own});
    g.pid=pid;g.own=own;
    /* o log bruto da partida acompanha, para a estatística futura não divergir */
    if(Array.isArray(m.events)&&g.t){const ev=m.events.find(e=>e.type==='goal'&&e.t===g.t);if(ev){ev.pid=pid;ev.own=own}}
    rebuildAll(l);save();render();A.review({dataset:{id:m.id}});toast('Autor corrigido');
  },
  fixResult(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souEditor(l))return toast('Só admin ou editor corrige resultado');
    const novo=el.dataset.r==='draw'?'draw':+el.dataset.r;
    logAdd(l,'result',{mid:m.id,from:m.result,to:novo,voided:m.voided});
    m.result=novo;
    /* a correcao vale para o trecho que fechou a partida — os trechos anteriores
       ja tinham vencedor proprio, cada um com o seu placar                     */
    if(Array.isArray(m.stints)&&m.stints.length){
      const cont=m.stints.filter(x=>x.counted);
      (cont.length?cont[cont.length-1]:m.stints[m.stints.length-1]).result=m.result;
    }
    m.disputes=[];m.voided=false;rebuildAll(l);
    closeSheet();save();render();toast('Corrigido, níveis recalculados');
  },
  voidMatch(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin anula partida');
    m.voided=!m.voided;if(!m.voided)m.disputes=[];
    logAdd(l,m.voided?'void':'unvoid',{mid:m.id});
    rebuildAll(l);closeSheet();save();render();toast(m.voided?'Partida anulada':'Partida reativada');
  },
  clearDisputes(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin encerra contestação');
    logAdd(l,'keep',{mid:m.id,voided:m.voided});
    m.disputes=[];if(m.voided){m.voided=false;rebuildAll(l)}
    closeSheet();save();render();toast('Resultado mantido');
  },
  delMatch(el){
    const l=L(),i=l.matches.findIndex(m=>m.id===el.dataset.id);if(i<0)return;
    const m=l.matches[i];
    /* desfazer a última partida do racha em andamento é de quem está lançando;
       apagar qualquer outra é revisão, e revisão é do admin */
    const ultimaDoRacha=!!(l.live&&l.live.matchIds.length&&l.live.matchIds[l.live.matchIds.length-1]===m.id);
    if(!ultimaDoRacha&&!souAdmin(l))return toast('Só o admin apaga partida do histórico');
    if(i!==l.matches.length-1&&!confirm('Apagar esta partida? Os níveis são recalculados do zero.'))return;
    logAdd(l,'delMatch',{mid:m.id,ts0:m.ts,score:m.score,result:m.result,names:m.names,ultimaDoRacha});
    l.matches.splice(i,1);rebuildAll(l);
    if(l.live)l.live.matchIds=l.live.matchIds.filter(x=>x!==m.id);
    if(l.live&&l.live.lastEnd&&l.live.lastEnd.mid===m.id)l.live.lastEnd=null;
    closeSheet();save();render();toast('Partida apagada');
  },

  /* ----- fim de racha ----- */
  endRacha(){
    const l=L(),lv=l.live;
    if(lv.cur&&!confirm('Há uma partida em andamento. Encerrar o racha mesmo assim?'))return;
    const ms=lv.matchIds.map(id=>l.matches.find(m=>m.id===id)).filter(Boolean);
    if(!ms.length){l.live=null;save();render();return}
    const gols={},net={};
    ms.forEach(m=>{(m.goals||[]).forEach(g=>{if(g.pid&&!g.own)gols[g.pid]=(gols[g.pid]||0)+1});
      (m.moves||[]).forEach(x=>{const k=x.pid+'|'+(x.role||'L');net[k]=(net[k]||0)+x.dir})});
    const top=Object.entries(gols).sort((a,b)=>b[1]-a[1])[0];
    const ups=Object.entries(net).filter(x=>x[1]!==0);
    /* a presença da sessão é quem ESTEVE no racha (inclui quem foi embora antes
       do fim); os times ficam guardados como foram montados, para consulta */
    l.sessions.push({id:lv.id||uid(),ts:Date.now(),matchIds:[...lv.matchIds],
      presentIds:[...new Set([...lv.presentIds,...(lv.leftIds||[])])],
      teams:lv.teams.map(t=>({name:t.name,ids:[...(t.orig&&t.orig.length?t.orig:t.ids)]})),
      gkPool:[...(lv.gkPool||[])]});
    l.live=null;save();render();
    openSheet(`<h2>Racha encerrado</h2>
      <div class="stat" style="margin-bottom:14px">
        <div><b>${ms.length}</b><span>partidas</span></div>
        <div><b>${top?esc(nameOf(l,top[0]).split(' ')[0]):'—'}</b><span>artilheiro ${top?top[1]:''}</span></div>
        <div><b>${ups.length}</b><span>mudanças de nível</span></div>
      </div>
      ${vePat(l)?ups.map(x=>{const [pid,role]=x[0].split('|'),p=P(l,pid);if(!p||!temPatente(l,p,role))return '';
        const tr=rt(p,role);return `<div class="promo" style="--pc:${patColor(tr.rank)}">
        <div class="t">${x[1]>0?'🔺':'🔻'} ${esc(p.name)}${role==='G'?' 🧤':''}</div>
        <div class="tiny muted">agora é ${esc(rankLabel(l,tr.rank))}${role==='G'?' no gol':''}</div></div>`}).join(''):''}
      <button class="btn wide pri" data-a="closeSheet">Fechar</button>`);
  },

  /* ----- jogador ----- */
  /* ----- ficha do jogador: rascunho, salvar, cancelar -----
     Nada muda no jogador enquanto a folha está aberta: nome, nível, gol,
     conta e permissão vão para PD (rascunho) e só entram no Salvar — com as
     mesmas checagens de papel e o mesmo registro no log das ações diretas. */
  pSheet(el){
    const l=L(),p=P(l,el.dataset.id);if(!p)return;
    if(!PD||PD.id!==p.id)PD={id:p.id,view:(S.ui.rankRole==='G'?'G':'L'),name:p.name,gk:!!p.gk,role:p.role||'jogador',owner:p.owner||null,rank:{L:null,G:null}};
    if(el.dataset.r==='G'||el.dataset.r==='L')PD.view=el.dataset.r;
    const role=PD.view,ver=vePat(l),tot=p.L.games+p.G.games,vit=p.L.w+p.G.w,emp=p.L.d+p.G.d,adm=souAdmin(l),edt=souEditor(l);
    const rankDe=r=>PD.rank[r]!==null&&PD.rank[r]!=='none'?PD.rank[r]:rt(p,r).rank;
    const zerado=r=>PD.rank[r]==='none';
    const mudou=PD.name!==p.name||PD.gk!==!!p.gk||PD.role!==(p.role||'jogador')||PD.owner!==(p.owner||null)||PD.rank.L!==null||PD.rank.G!==null;
    const corAv=ver&&temPatente(l,p,'L')?patColor(rankDe('L')):ver&&temPatente(l,p,'G')?patColor(rankDe('G')):'var(--mute)';
    const cardNivel=(r,rotulo)=>{const t=rt(p,r),tem=(temPatente(l,p,r)||PD.rank[r]!==null)&&!zerado(r);
      return `<button class="${role===r?'on':''}" data-a="pSheet" data-id="${p.id}" data-r="${r}">
        <span class="k">${rotulo}${PD.rank[r]!==null?' <span style="color:var(--lime)">· editado</span>':''}</span>
        ${tem?patBadge(l,rankDe(r),'big'):'<span class="none">sem nível</span>'}
        ${temPatente(l,p,r)?`<div class="best">${calibrando(l,p,t)?`calibrando · ${calTxt(l,t)}`
          :`melhor: ${esc(rankLabel(l,Math.max(t.peak||0,t.rank)))}`} · ${t.w}V ${t.d}E ${t.l}D</div>`:''}
      </button>`};
    const podeConta=PD.owner?(PD.owner===S.me.name||adm):true;
    /* uma varredura só do histórico para a folha inteira */
    const stTudo=statsLiga(l,'sempre'),j=stTudo.J[p.id]||{min:0,minGk:0,sofridos:0,pm:0};
    const jt=inseparaveis(l,stTudo).filter(x=>x.a===p.id||x.b===p.id);
    openSheet(`
      <div class="ps-hd">
        <div class="avatar" style="--pc:${corAv}">${esc(iniciais(PD.name||p.name))}</div>
        <div style="min-width:0;flex:1">
          ${edt?`<input value="${esc(PD.name)}" oninput="PD.name=this.value" placeholder="Nome" aria-label="nome do jogador"
              style="font-family:var(--disp);font-size:20px;padding:6px 10px;width:100%">`
            :`<h2><span>${esc(p.name)}</span></h2>`}
          <div class="sub">${p.owner?'@'+esc(p.owner):'sem conta'} · ${PAPEL[p.role]||'Jogador'} · ${p.sessions||0} racha${p.sessions===1?'':'s'}</div>
        </div>
      </div>
      ${ver?`<div class="lv2">${cardNivel('L','Linha')}${cardNivel('G','🧤 Gol')}</div>`:''}
      ${(()=>{return `<div class="stat four">
        ${l.cfg.matchMode==='unica'?`<div><b class="num ${j.pm>0?'up':j.pm<0?'dn':''}">${pmTxt(j.pm)}</b><span>+/−</span></div>`:''}
        <div><b class="num">${tot}</b><span>partidas</span></div>
        <div><b class="num">${aprDe(vit,emp,tot)}%</b><span>aproveitamento</span></div>
        <div><b class="num">${p.goals}</b><span>gols${p.gc?' <span class="muted">· '+p.gc+' contra</span>':''}</span></div>
        <div><b class="num">${MINS(j.min)}</b><span>min</span></div>
      </div>
      ${(()=>{return jt.length?`<div class="tiny" style="margin-top:8px;padding:8px 10px;border:1px dashed var(--line2);border-radius:10px;color:var(--mute)">🔗 Joga ${Math.round(jt[0].pct*100)}% das partidas com <b>${esc(nameOf(l,jt[0].a===p.id?jt[0].b:jt[0].a))}</b> — os dois têm o mesmo nível por construção. Separe-os por alguns rachas para o app medir cada um.</div>`:''})()}
      <div class="tiny muted" style="margin-top:6px">⚽ ${por10(p.goals,j.min)} gols a cada 10 min${j.minGk?` · 🧤 ${por10(j.sofridos,j.minGk)} sofridos a cada 10 min em ${fmtMin(j.minGk)} no gol`:''}</div>`})()}
      ${ver&&adm?`<div class="ps-panel">
        <div class="k">Corrigir nível ${role==='G'?'no gol':'na linha'}</div>
        <div class="ladder4">
          ${l.cfg.patNames.map((n,k)=>`<button class="${patOf(rankDe(role))===k?'on':''}" style="--pc:${PATC[k]}" data-a="pdRank" data-s="${k*3+1}"><i></i>${esc(n)}</button>`).join('')}
        </div>
        <div class="step">
          <button class="btn ghost" data-a="pdBump" data-d="-1" aria-label="uma divisão abaixo">−</button>
          <div class="cur">${zerado(role)?'<span class="muted">sem nível</span>':esc(rankLabel(l,rankDe(role)))}</div>
          <button class="btn ghost" data-a="pdBump" data-d="1" aria-label="uma divisão acima">+</button>
        </div>
        ${!rt(p,role).games&&(rt(p,role).def||PD.rank[role]!==null)?`<button class="btn sm wide ghost" data-a="pdRank" data-s="none" style="margin-top:8px" ${zerado(role)?'disabled':''}>${zerado(role)?'Vai calibrar do zero':'Tirar o nível — calibrar do zero'}</button>
        <div class="tiny muted" style="margin-top:6px">Só dá para zerar quem ainda não jogou ${role==='G'?'no gol':'na linha'}. Ele volta a "sem nível" até completar a calibração.</div>`:''}
      </div>`:''}
      <div style="height:6px"></div>
      <div class="trow">
        <div class="lbl">Costuma ir ao gol<small>entra no rodízio de goleiro por padrão</small></div>
        <button class="sw ${PD.gk?'on':''}" data-a="pdGk" role="switch" aria-checked="${PD.gk?'true':'false'}" aria-label="costuma ir ao gol" ${edt?'':'disabled'}></button>
      </div>
      <div class="trow">
        <div class="lbl">Conta<small>${PD.owner?'vinculada a <b>@'+esc(PD.owner)+'</b>':'ninguém assumiu este perfil'}</small></div>
        ${PD.owner?(podeConta?`<button class="btn sm ghost" data-a="pdOwner">desvincular</button>`:'')
          :`<button class="btn sm ghost" data-a="pdOwner">Sou eu</button>`}
      </div>
      <div class="trow" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="lbl">Permissão${adm?'':'<small>só o admin muda</small>'}</div>
        ${adm?`<div class="seg">${[['admin','Admin'],['editor','Editor'],['lancador','Lançador'],['jogador','Jogador']]
            .map(x=>`<button class="${PD.role===x[0]?'on':''}" data-a="pdRole" data-r="${x[0]}">${x[1]}</button>`).join('')}</div>`
          :`<div class="tiny">${PAPEL[p.role]||'Jogador'}</div>`}
      </div>
      <div class="ps-foot">
        <button class="btn ghost" data-a="pdCancel">Cancelar</button>
        <button class="btn pri" data-a="pdSave" ${mudou?'':'disabled'}>Salvar</button>
      </div>
      ${edt?`<button class="btn wide danger ghost" data-a="delPlayer" data-id="${p.id}" style="margin-top:10px">Remover jogador</button>`:''}`);
  },
  pdRank(el){if(!PD)return;PD.rank[PD.view]=el.dataset.s==='none'?'none':+el.dataset.s;A.pSheet({dataset:{id:PD.id}})},
  pdBump(el){if(!PD)return;const p=P(L(),PD.id),r=PD.view,cur=PD.rank[r]!==null&&PD.rank[r]!=='none'?PD.rank[r]:rt(p,r).rank;
    PD.rank[r]=clamp(cur+(+el.dataset.d),0,TOP);A.pSheet({dataset:{id:PD.id}})},
  pdGk(){if(!PD)return;PD.gk=!PD.gk;A.pSheet({dataset:{id:PD.id}})},
  pdRole(el){if(!PD)return;PD.role=el.dataset.r;A.pSheet({dataset:{id:PD.id}})},
  pdOwner(){if(!PD)return;if(!PD.owner&&!S.me.name)return toast('Entre na sua conta primeiro');PD.owner=PD.owner?null:S.me.name;A.pSheet({dataset:{id:PD.id}})},
  pdCancel(){PD=null;closeSheet()},
  pdSave(){
    const l=L(),d=PD;if(!d)return;const p=P(l,d.id);if(!p){PD=null;closeSheet();return}
    const adm=souAdmin(l),edt=souEditor(l);
    /* nome */
    const nome=String(d.name||'').trim();
    if(nome!==p.name){
      if(!edt)return toast('Só admin ou editor renomeia');
      if(!nome)return toast('Digite o nome');
      if(l.players.some(x=>x.id!==p.id&&x.name.toLowerCase()===nome.toLowerCase()))return toast('Já existe alguém com esse nome');
    }
    /* permissão */
    if(d.role!==(p.role||'jogador')){
      if(!adm)return toast('Só o admin muda permissão');
      const outrosAdmins=l.players.some(x=>x.id!==p.id&&x.owner&&x.role==='admin');
      if(p.role==='admin'&&d.role!=='admin'&&(d.owner||p.owner)&&!outrosAdmins)return toast('A liga precisa de pelo menos um admin');
    }
    /* conta */
    if(d.owner!==(p.owner||null)){
      if(p.owner&&!(p.owner===S.me.name||adm))return toast('Só o dono do perfil ou o admin desvincula');
      if(d.owner&&l.players.some(x=>x.id!==p.id&&x.owner===d.owner))return toast('Você já tem um perfil nesta liga — desvincule o outro antes');
    }
    /* nível */
    if((d.rank.L!==null||d.rank.G!==null)&&!adm)return toast('Só o admin corrige nível');
    if(d.gk!==!!p.gk&&!edt)return toast('Só admin ou editor edita o jogador');

    if(nome!==p.name){logAdd(l,'rename',{pid:p.id,from:p.name,to:nome});p.name=nome}
    if(d.gk!==!!p.gk)p.gk=d.gk;
    if(d.role!==(p.role||'jogador')){logAdd(l,'role',{pid:p.id,from:p.role,to:d.role});p.role=d.role}
    let msg='Salvo';
    if(d.owner!==(p.owner||null)){
      if(d.owner){
        const temAdmin=l.players.some(x=>x.owner&&x.role==='admin');
        if(!temAdmin){p.role='admin';msg='Perfil vinculado — você é o admin da liga'}
        logAdd(l,'link',{pid:p.id,user:d.owner,self:d.owner===S.me.name});
      }else logAdd(l,'unlink',{pid:p.id,user:p.owner});
      p.owner=d.owner;
    }
    ['L','G'].forEach(r=>{
      if(d.rank[r]===null)return;
      const tr=rt(p,r);
      if(d.rank[r]==='none'){                            // zera: volta ao padrão e sem nível até calibrar
        if(tr.games)return toast('Só dá para zerar quem ainda não jogou');
        logAdd(l,'rank',{pid:p.id,role:r,from:tr.rank,to:null,fromElo:Math.round(tr.elo),toElo:l.cfg.startElo});
        tr.base=l.cfg.startElo;tr.elo=l.cfg.startElo;tr.rank=stepOf(tr.elo);tr.peak=tr.rank;tr.protect=0;tr.def=false;
        return;
      }
      const sN=d.rank[r],target=stepMid(sN);
      if(sN===tr.rank&&tr.def)return;
      logAdd(l,'rank',{pid:p.id,role:r,from:tr.rank,to:sN,fromElo:Math.round(tr.elo),toElo:target});
      tr.base+=target-tr.elo;tr.elo=target;tr.rank=sN;tr.protect=l.cfg.protectMatches;tr.def=true;
    });
    PD=null;closeSheet();save();render();toast(msg);
  },
  /* nível, gol, conta e permissão mudam pela ficha (PD → pdSave), num
     rascunho com as mesmas checagens de papel — não há ações diretas.      */
  delPlayer(el){
    const l=L();
    if(!souEditor(l))return toast('Só admin ou editor remove jogador');
    if(!confirm('Remover jogador? O histórico das partidas continua.'))return;
    const id=el.dataset.id,px=P(l,id);
    logAdd(l,'delPlayer',{pid:id,name:px?px.name:null,owner:px?px.owner:null});
    l.players=l.players.filter(p=>p.id!==id);
    if(l.live){l.live.presentIds=l.live.presentIds.filter(x=>x!==id);
      l.live.gkToday=(l.live.gkToday||[]).filter(x=>x!==id);
      l.live.gkPool=(l.live.gkPool||[]).filter(x=>x!==id);
      l.live.teams.forEach(t=>t.ids=t.ids.filter(x=>x!==id))}
    closeSheet();save();render();
  },

  /* ----- ajustes ----- */
  toggleCfg(el){const l=L();l.cfg[el.dataset.k]=!l.cfg[el.dataset.k];save();render()},
  setVis(el){const l=L();l.cfg.rankVisibility=el.dataset.v==='admin'?'admin':'todos';save();render()},
  rankRole(el){S.ui.rankRole=el.dataset.v==='G'?'G':'L';save();render()},
  statsPer(el){const v=el.dataset.v;S.ui.statsPer=v==='sempre'||v==='mes'||v==='racha'?v:(/^\d{4}$/.test(v)&&+v!==ANO_ATUAL()?v:'ano');save();render()},
  statsTab(el){S.ui.statsTab=el.dataset.v==='racha'?'racha':'jogador';save();render()},
  statsSemGk(){S.ui.statsSemGk=!S.ui.statsSemGk;save();render()},
  /* Times do racha (aba Números): toque no time mostra quem eram os jogadores */
  rachaTime(el){
    const l=L(),sid=el.dataset.sid,nome=el.dataset.n;
    const sess=(l.sessions||[]).find(x=>x.id===sid);
    const t=sess&&Array.isArray(sess.teams)?sess.teams.find(x=>x.name===nome):null;
    let ids=t?t.ids.slice():null,daMontagem=!!t;
    if(!ids){    // racha gravado antes de a sessão guardar os times: vale a primeira partida
      const ms=(l.matches||[]).filter(m=>!m.voided&&(m.sessionId||m.id)===sid).sort((a,b)=>a.ts-b.ts);
      for(const m of ms){const s=(m.names||[]).indexOf(nome);
        if(s>=0){ids=((m.startLineups||m.lineups)[s]||[]).slice();break}}
    }
    if(!ids||!ids.length)return toast('Não achei a escalação desse time');
    const gks=daMontagem&&sess&&Array.isArray(sess.gkPool)?sess.gkPool:[];

let drag=null,suppressClick=false;

function beginDrag(e){
  const el=drag.el,r=el.getBoundingClientRect(),g=el.cloneNode(true);
  g.className=el.className+' dragghost';
  g.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+
    'px;pointer-events:none;z-index:300;opacity:.96;transform:scale(1.07);box-shadow:0 12px 28px rgba(0,0,0,.55)';
  document.body.appendChild(g);

  if(drag){
    if(drag.timer)clearTimeout(drag.timer);

function onDrop(fromId,target){
  const l=L(),lv=l&&l.live;if(!lv||!fromId||!target)return;
  if(!podeLancar(l))return;            // o arraste não passa pelo dispatcher de [data-a]
  const alvo=target.dataset.dropPlayer,zona=target.dataset.dropZone;

    A.doSub({dataset:{s:String(sai),out:alvo,id:fromId}});

  }

  if(alvo){
    lv.sel=fromId;A.sel({dataset:{id:alvo}});return;          // troca de lugar
  }
  lv.sel=fromId;
  if(zona==='pool')return A.toPool({dataset:{}});
  if(zona==='bench')return A.toTeam({dataset:{i:'-1'}});

/* ---------- sincronizador ---------- */
/* ---------- fatos vs. derivados ----------
   No servidor a liga vive em partes (jogadores, partidas, rachas, live, log)
   e só os FATOS vão para lá. Nível, Elo, forma, gols e contagens são
   recalculados aqui (rebuildAll) a partir das partidas.                     */
const playerFacts=p=>({id:p.id,name:p.name,gk:!!p.gk,owner:p.owner||null,role:p.role||'jogador',created:p.created||null,
  L:{base:p.L?p.L.base:undefined,def:!!(p.L&&p.L.def)},G:{base:p.G?p.G.base:undefined,def:!!(p.G&&p.G.def)}});
const matchFacts=m=>{const o=Object.assign({},m);delete o.deltas;delete o.moves;delete o.pre;delete o.over;return o};
const factsDoc=l=>({name:l.name,cfg:l.cfg,players:(l.players||[]).map(playerFacts),
  matches:(l.matches||[]).map(matchFacts),sessions:l.sessions||[],live:l.live||null,log:l.log||[]});
const snapNovo=()=>({players:{},matches:{},sessions:{},live:'null',log:0,name:null,cfg:null});
/* O que difere do último estado conhecido do servidor — e o snapshot que
   passa a valer se o servidor aceitar. Comparação por entidade, em JSON. */
function diffParts(l){
  const s=SNAP[l.id]||(SNAP[l.id]=snapNovo()),parts={},snap={players:{},matches:{},sessions:{}};
  const ent=(key,arr,facts)=>{
    const out=[],seen={};
    arr.forEach(x=>{const j=JSON.stringify(facts(x));seen[x.id]=1;if(s[key][x.id]!==j){out.push({id:x.id,data:JSON.parse(j)});snap[key][x.id]=j}});
    Object.keys(s[key]).forEach(id=>{if(!seen[id]){out.push({id,deleted:true});snap[key][id]=null}});
    if(out.length)parts[key]=out;
  };
  ent('players',l.players||[],playerFacts);ent('matches',l.matches||[],matchFacts);ent('sessions',l.sessions||[],x=>x);
  const live=JSON.stringify(l.live||null);if(live!==s.live){parts.live=l.live?{data:JSON.parse(live)}:{clear:true};snap.live=live}
  const cfg=JSON.stringify(l.cfg);if(cfg!==s.cfg){parts.cfg=JSON.parse(cfg);snap.cfg=cfg}
  if(l.name!==s.name){parts.name=l.name;snap.name=l.name}
  const log=l.log||[];
  if(log.length>s.log){parts.log=log.slice(s.log);snap.log=log.length}
  else if(log.length<s.log)snap.log=log.length;
  return {parts,snap};
}
function commitSnap(id,snap){
  const s=SNAP[id]||(SNAP[id]=snapNovo());
  ['players','matches','sessions'].forEach(k=>Object.keys(snap[k]).forEach(x=>{if(snap[k][x]===null)delete s[k][x];else s[k][x]=snap[k][x]}));
  if(snap.live!==undefined)s.live=snap.live;
  if(snap.cfg!==undefined)s.cfg=snap.cfg;
  if(snap.name!==undefined)s.name=snap.name;
  if(snap.log!==undefined)s.log=snap.log;
}

  el.style.opacity='1';
  el.textContent=estado==='erro'?'sem conexão':'salvando';
  el.style.background=estado==='erro'?'var(--bad,#FF5F5F)':'var(--panel,#111917)';
  el.style.color=estado==='erro'?'#1a0a0a':'var(--mute,#84998E)';
}

async function flush(){
  if(!sb||!ME||syncing)return;
  syncing=true;
  try{
    let guarda=0;
    while(dirty.size&&guarda++<20){                // liga re-suja por conflito volta na mesma passada
      const id=[...dirty][0];
      dirty.delete(id);
      const l=S.ligas.find(x=>x.id===id);
      if(!l||VER[id]===undefined)continue;         // liga ainda não existe no servidor (create em voo)
      const {parts,snap}=diffParts(l);
      if(!Object.keys(parts).length)continue;      // save() sem mudança real (trocar de aba, abrir liga)
      syncDot('salvando');
      const {data,error}=await sb.rpc('save_parts',{p_id:id,p_version:VER[id]||1,p_parts:parts});
      if(error){netErr=true;tentativas++;syncDot('erro');dirty.add(id);break}   // sem rede: espera o backoff
      netErr=false;tentativas=0;
      if(data&&data.ok===false){                   // alguém gravou antes: aplica o delta e reenvia o que sobrou
        applyDelta(id,data.delta);
        toast('Atualizado por outra pessoa');
        render();dirty.add(id);
      }else if(data){
        VER[id]=data.version;commitSnap(id,snap);if(data.code)CODE[id]=data.code;
      }
    }
  }finally{
    syncing=false;
    if(dirty.size){agenda();syncDot(netErr?'erro':'salvando')}
    else syncDot(netErr?'erro':'limpo');
  }
}

/* Aplica um delta do servidor (carga inicial = tudo; depois, só o que mudou
   desde a versão que este aparelho conhece). Entidade que veio no delta
   sobrescreve a local; o resto fica como está — inclusive edição pendente. */
function applyDelta(id,d){
  if(!d)return;
  let l=S.ligas.find(x=>x.id===id);
  if(!l){l={id,createdAt:Date.now(),cfg:defCfg(),players:[],matches:[],sessions:[],live:null,log:[],name:d.name||'Liga'};S.ligas.push(l)}
  const s=SNAP[id]||(SNAP[id]=snapNovo());
  if(d.name)l.name=d.name;
  if(d.cfg&&Object.keys(d.cfg).length)l.cfg=d.cfg;
  let recalc=false;
  const ent=(key,rows)=>{(rows||[]).forEach(r=>{
    const i=l[key].findIndex(x=>x.id===r.id);
    if(r.deleted){if(i>=0)l[key].splice(i,1);delete s[key][r.id]}
    else{if(i>=0)l[key][i]=r.data;else l[key].push(r.data)}
    recalc=true})};
  ent('players',d.players);ent('matches',d.matches);ent('sessions',d.sessions);
  if(d.live)l.live=d.live.data||null;
  /* Log é append (as outras entidades substituem por id): num conflito, as
     entradas que NÓS gravamos podem voltar no delta — sem dedup elas dobravam
     na tela. E o que ainda não subiu tem que continuar depois do cursor,
     senão o snapshot o marcava como sincronizado e ele nunca chegava lá.   */
  let logSync=null;
  if(d.log&&d.log.length){
    const log=l.log||[],antigas=log.slice(0,(SNAP[id]||{log:0}).log||0),pend=log.slice(antigas.length);
    const j=x=>JSON.stringify(x),temAntiga=new Set(antigas.map(j));
    const novas=d.log.filter(x=>!temAntiga.has(j(x)));
    const noServidor=new Set(novas.map(j));
    l.log=antigas.concat(novas,pend.filter(x=>!noServidor.has(j(x))));
    logSync=antigas.length+novas.length;
  }
  if(d.code)CODE[id]=d.code;
  VER[id]=d.version;
  S=normalize(S);
  l=S.ligas.find(x=>x.id===id);if(!l)return;
  if(recalc){l.matches.sort((a,b)=>a.ts-b.ts);rebuildAll(l)}
  /* snapshot só do que veio no delta, já normalizado — o que não veio pode
     ter edição local esperando para subir */
  const snapDe=(key,rows,facts)=>(rows||[]).forEach(r=>{if(r.deleted)return;const x=l[key].find(y=>y.id===r.id);if(x)s[key][r.id]=JSON.stringify(facts(x))});
  snapDe('players',d.players,playerFacts);snapDe('matches',d.matches,matchFacts);snapDe('sessions',d.sessions,x=>x);
  if(d.live)s.live=JSON.stringify(l.live||null);
  if(d.cfg&&Object.keys(d.cfg).length)s.cfg=JSON.stringify(l.cfg);
  if(d.name)s.name=l.name;
  if(logSync!==null)s.log=logSync;
  if(s.log===0&&logSync===null)s.log=(l.log||[]).length;
}

/* ---------- tempo real ----------
   O payload de uma liga grande estoura o limite de mensagem do Realtime, então
   o aviso serve só como "mudou": quem busca a linha de novo é o cliente.      */
function watch(){
  if(!sb)return;
  if(chan){sb.removeChannel(chan);chan=null}
  chan=sb.channel('raxa-leagues')
    .on('postgres_changes',{event:'*',schema:'public',table:'leagues'},p=>{
      const id=(p.new&&p.new.id)||(p.old&&p.old.id);
      if(!id)return;
      if(p.eventType==='DELETE'){
        if(!S.ligas.some(l=>l.id===id))return;
        S.ligas=S.ligas.filter(l=>l.id!==id);
        if(S.active===id){S.active=null;toast('Esta liga foi apagada')}
        S=normalize(S);saveUI();render();return;
      }
      refetch(id);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'league_members'},async p=>{
      const row=p.new&&p.new.user_id?p.new:p.old;
      if(!row||row.user_id!==ME.id)return;
      if(p.eventType==='INSERT'){                    // o admin aprovou
        const {data}=await sb.rpc('league_delta',{p_id:row.league_id,p_since:0});
        if(!data)return;
        applyDelta(data.id,data);
        PEND=PEND.filter(x=>x.league_id!==data.id);
        S=normalize(S);render();toast('Você entrou em '+data.name);
      }else if(p.eventType==='DELETE'){              // o admin tirou você
        if(!S.ligas.some(l=>l.id===row.league_id))return;
        S.ligas=S.ligas.filter(l=>l.id!==row.league_id);
        if(S.active===row.league_id){S.active=null;toast('Você foi removido da liga')}
        S=normalize(S);saveUI();render();
      }
    })
    .subscribe();
}

/* Não redesenha por cima de digitação, arrasto ou folha aberta. */
function ocupado(){
  const ae=document.activeElement||{};
  if(['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0)return true;
  if(typeof drag!=='undefined'&&drag&&drag.active)return true;
  const sh=$('#sheet');
  return !!(sh&&sh.classList.contains('on'));
}

/* Aviso que chegou enquanto a pessoa digitava ou tinha uma folha aberta não se
   perde: fica pendente e é buscado assim que a folha fecha / o campo solta. */
const pendente=new Set();
function refetchPendentes(){
  if(!pendente.size||ocupado())return;
  const ids=[...pendente];pendente.clear();
  ids.forEach(id=>refetch(id));
}
async function refetch(id,tent){
  if(!sb||!ME)return;
  tent=(tent||0)+1;
  if(syncing||dirty.size){                                              // edição local tem prioridade
    if(tent>60){pendente.add(id);return}
    setTimeout(()=>refetch(id,tent),700);return;
  }
  if(ocupado()){pendente.add(id);return}                                // não redesenha por cima de digitação
  const {data,error}=await sb.rpc('league_delta',{p_id:id,p_since:VER[id]||0});
  if(error||!data)return;
  if((VER[id]||0)>=data.version)return;             // eco da nossa própria gravação
  applyDelta(id,data);
  render();
}

/* ==========================================================================
   AÇÕES DE CONTA E DE LIGA — o que precisa do backend (criar/entrar/sair de
   liga, contas, importar). Cada ação existe UMA vez; nada é sobreposto.
   ========================================================================== */
/* A liga aparece na tela na hora, com um id provisório, e só depois troca
   pelo id que o servidor deu. Ninguém fica olhando para o vazio esperando a
   rede — e a criação continua sendo uma função síncrona para quem chama.   */
function mkLiga(name,base){
  const l=Object.assign({createdAt:Date.now(),cfg:defCfg(),players:[],matches:[],sessions:[],live:null},
                        base||{},{id:uid(),name:name});
  S.ligas.push(l);S=normalize(S);
  S.active=l.id;S.ui.tab='racha';saveUI();render();
  return l.id;
}

function reid(de,para){
  const l=S.ligas.find(x=>x.id===de);if(!l)return;
  l.id=para;
  if(S.active===de)S.active=para;
  if(dirty.has(de)){dirty.delete(de);dirty.add(para)}   // mexeu antes da rede responder
  [VER,SNAP,CODE].forEach(m=>{delete m[de]});
}

async function createLeague(name,base){
  const tmp=mkLiga(name,base);
  if(!sb||!ME)return tmp;                    // sem backend configurado (ex.: smoke test)
  const doc=factsDoc(S.ligas.find(x=>x.id===tmp));
  const {data,error}=await sb.rpc('create_league',{p_name:name,p_data:doc});
  if(error){                                 // desfaz: nada de liga fantasma que nunca grava
    S.ligas=S.ligas.filter(x=>x.id!==tmp);
    if(S.active===tmp)S.active=null;
    dirty.delete(tmp);S=normalize(S);saveUI();render();
    toast('Não deu para criar: '+traduz(error));
    return null;
  }
  reid(tmp,data.id);
  VER[data.id]=data.version;CODE[data.id]=data.code;
  /* o snapshot é o documento que foi: qualquer edição feita enquanto a rede
     respondia aparece como diferença e sobe na próxima gravação */
  const s=SNAP[data.id]=snapNovo();
  doc.players.forEach(p=>s.players[p.id]=JSON.stringify(p));
  doc.matches.forEach(m=>s.matches[m.id]=JSON.stringify(m));
  doc.sessions.forEach(x=>s.sessions[x.id]=JSON.stringify(x));
  s.live=JSON.stringify(doc.live);s.cfg=JSON.stringify(doc.cfg);s.name=doc.name;s.log=doc.log.length;
  markDirty(data.id);
  saveUI();render();
  return data.id;
}
