/* Dentro do nível, a divisão muda o brilho: 1 um pouco mais fechada, 2 a cor
   do metal, 3 um pouco mais clara. Sutil de propósito — o número continua
   sendo a leitura principal, a cor só acompanha.                            */
function mixHex(hex,alvo,t){
  const h=hex.replace('#',''),c=i=>parseInt(h.substr(i,2),16);
  const m=v=>Math.round(v+(alvo-v)*t).toString(16).padStart(2,'0');
  return '#'+m(c(0))+m(c(2))+m(c(4));
}
/* Divisão: a 1 é fosca (cor mais fechada), a 2 é o metal, a 3 é POLIDA — a
   mesma cor, com brilho (reflexo + halo via CSS .d3) em vez de mais clara:
   clarear lavava a cor e parecia transparente, não superior.               */
const patColor=s=>{const base=PATC[patOf(s)],d=s%3;return d===0?mixHex(base,0,.28):base};
const divCls=s=>'d'+(s%3+1);
const patName=(liga,s)=>liga.cfg.patNames[patOf(s)];
const rankLabel=(liga,s)=>patName(liga,s)+' '+divOf(s);
const patBadge=(liga,s,cls)=>`<span class="pat ${cls||''} ${divCls(s)}" style="--pc:${patColor(s)}">${esc(patName(liga,s))} <b>${divOf(s)}</b></span>`;
const patBadgeShort=(liga,s)=>`<span class="pat ${divCls(s)}" style="--pc:${patColor(s)}">${PATSHORT[patOf(s)]} <b>${divOf(s)}</b></span>`;

/* ---------- estado ---------- */
function defCfg(){return{
  startElo:1500, calGames:CAL_GAMES, calRachas:CAL_RACHAS,
  /* nomes que falam do papel no time, não de tempo de casa: quem joga há 20
     anos e é fraco não é "iniciante" nem "promessa" — é raiz. Editáveis por liga. */
  patNames:['Ferro','Bronze','Prata','Ouro','Diamante'],
  rankMargin:RANK_MARGIN, protectMatches:PROTECT,
  format:5, matchMode:'curtas',   /* só o padrão para o próximo racha */ targetGoals:2, targetMin:7, winnerStays:true, askScorer:true, teamCount:2,
  stintMin:3,                     /* trecho cortado por substituição só conta a partir daqui (min) */
  avoidRepeat:true,               /* evitar repetir quem já jogou junto em outros rachas */
  rankVisibility:'todos',         /* 'todos' | 'admin' */
  disputeThreshold:2, disputeMode:'flag'
};}
/* escolhas da folha "Nova liga" (formato e modo entram no cfg da liga) */
let NOVA={format:5,modo:'curtas',nome:''};
function cfgNova(){
  const c=defCfg();c.format=NOVA.format;c.matchMode=NOVA.modo;
  if(NOVA.modo==='unica'){c.targetGoals=0;c.targetMin=50;c.winnerStays=false}
  return c;
}
function defState(){return{v:2,me:{id:uid(),name:''},ligas:[],active:null,ui:{tab:'racha',rankRole:'L'}};}

/* ---------- duas trilhas de nível: linha e goleiro ----------
   Dá para ser excelente em uma e ruim na outra, então cada jogador carrega
   dois níveis independentes. A trilha que anda é a do papel que a pessoa
   fez naquele trecho de partida — quem improvisou no gol mexe a do gol.      */
/* `def` = o nível desta valência foi definido (no cadastro ou pelo admin).
   Quem nunca jogou na linha, ou nunca pegou no gol, simplesmente NÃO TEM
   nível naquela valência — e entra valendo o nível de entrada padrão. */
function newTrack(e,def){return{elo:e,base:e,rank:stepOf(e),peak:stepOf(e),protect:0,def:!!def,
  games:0,w:0,l:0,d:0,sessions:0,lastSession:null,form:[]};}
const rt=(p,role)=>role==='G'?p.G:p.L;
/* Só tem nível quem recebeu um à mão (cadastro ou admin) ou quem já saiu da
   calibração naquela valência — pelo MESMO critério (e números) que
   `calibrando` usa: partidas no racha curto, rachas na partida única (D-65).
   Antes eram dois critérios em OU com constantes globais, e dava para ter a
   patente na escada e ainda estar "calibrando · 12/15" na mesma linha.
   Enquanto calibra sem nível manual, o rating existe por baixo (monta time,
   entra na conta) mas não vira rótulo.                                      */
const temPatente=(liga,p,role)=>{const t=rt(p,role);
  return !!(t&&(t.def||!calibrando(liga,p,t)))};
function fixTrack(t,e){
  t=Object.assign(newTrack(e),t||{});
  t.def=!!t.def;
  if(typeof t.elo!=='number')t.elo=e;
  if(typeof t.base!=='number')t.base=t.elo;
  if(typeof t.rank!=='number')t.rank=stepOf(t.elo);
  t.rank=clamp(t.rank,0,TOP);          // escada pode ter encolhido desde a gravação
  if(typeof t.peak!=='number')t.peak=t.rank;
  t.peak=clamp(t.peak,0,TOP);
  if(!Array.isArray(t.form))t.form=[];
  ['protect','games','w','l','d','sessions'].forEach(k=>{if(typeof t[k]!=='number')t[k]=0});
  return t;
}
function migPlayer(liga,p){
  const e=typeof p.elo==='number'?p.elo:liga.cfg.startElo;
  const q=Object.assign({id:uid(),name:'?',gk:false,goals:0,sessions:0,lastSession:null,
    owner:null,role:'jogador',created:Date.now()},p);
  if(!q.L||!q.G){        /* versão antiga: nível único. Quem era goleiro leva o histórico para a trilha do gol. */
    const velha=fixTrack({elo:e,base:p.base,rank:p.rank,peak:p.peakRank,protect:p.protect,
      games:p.games,w:p.w,l:p.l,d:p.d,sessions:p.sessions,lastSession:p.lastSession,form:p.form},e);
    q.L=q.gk?newTrack(e):velha;
    q.G=q.gk?velha:newTrack(e);
  }
  q.L=fixTrack(q.L,e);q.G=fixTrack(q.G,e);
  /* Versão antiga dava o palpite do cadastro às duas valências: quem nunca
     jogou naquela posição volta a não ter nível, no nível padrão.        */
  const padrao=liga.cfg&&liga.cfg.startElo||1500;
  ['L','G'].forEach(k=>{
    const tr=q[k];
    if(tr.def===undefined||tr.def===null)tr.def=(k===(q.gk?'G':'L'));
    if(!tr.def&&!tr.games){tr.base=padrao;tr.elo=padrao;tr.rank=stepOf(padrao);tr.peak=tr.rank}
  });
  ['elo','base','rank','peakRank','protect','games','w','l','d','form','gkGames'].forEach(k=>delete q[k]);
  return q;
}
/* Preenche o que faltar em dados gravados por versoes anteriores do app.
   Sem isso, uma liga antiga derruba a tela inteira.                        */
function normalize(st){
  if(!st||!Array.isArray(st.ligas))return defState();
  st.v=2;
  st.me=st.me&&st.me.id?st.me:{id:uid(),name:''};
  st.ui=st.ui&&st.ui.tab?st.ui:{tab:'racha',rankRole:'L',theme:'claro'};
  if(['escuro','claro','auto'].indexOf(st.ui.theme)<0)st.ui.theme='claro';
  if(typeof st.ui.histRacha!=='string')st.ui.histRacha=null;
  if(st.ui.rankRole!=='G')st.ui.rankRole='L';
  st.ligas.forEach(l=>{
    const d=defCfg();
    l.cfg=Object.assign({},d,l.cfg||{});
    if(!Array.isArray(l.cfg.patNames))l.cfg.patNames=d.patNames.slice();
    /* liga que ainda usa os nomes antigos de fábrica ganha os novos; nome editado à mão fica */
    if(['Iniciante|Promessa|Titular|Destaque|Craque','Raiz|Boleiro|Titular|Destaque|Craque','Bronze|Prata|Ouro|Platina|Diamante','Ferro|Bronze|Prata|Ouro','Madeira|Ferro|Bronze|Prata|Ouro'].indexOf(l.cfg.patNames.join('|'))>=0)l.cfg.patNames=d.patNames.slice();
    /* escada de 4 níveis editada à mão ganha o topo; 'Madeira' de fábrica na frente de nomes editados sai; outro tamanho volta ao padrão */
    if(l.cfg.patNames.length===5&&l.cfg.patNames[0]==='Madeira')l.cfg.patNames=l.cfg.patNames.slice(1);
    if(l.cfg.patNames.length===4)l.cfg.patNames=l.cfg.patNames.concat([d.patNames[4]]);
    if(l.cfg.patNames.length!==5)l.cfg.patNames=d.patNames.slice();
    /* a variação de nível é a mesma em toda liga: liga antiga com "estabilidade"
       ou calibração própria volta ao padrão (o recálculo do zero reaplica tudo) */
    l.cfg.rankMargin=RANK_MARGIN;l.cfg.protectMatches=PROTECT;
    if(l.cfg.stintMin===4)l.cfg.stintMin=3;             // padrão antigo → padrão novo (valor editado à mão fica)
    l.cfg.calGames=CAL_GAMES;l.cfg.calRachas=CAL_RACHAS;
    delete l.cfg.stability;
    delete l.cfg.tiers;delete l.cfg.tierNames;delete l.cfg.gkOutOfElo;delete l.cfg.gkOutOfRank;
    l.players=(l.players||[]).map(p=>migPlayer(l,p));
    l.matches=(l.matches||[]).map(m=>Object.assign({goals:[],moves:[],gks:[],disputes:[],voided:false,
      mode:l.cfg.matchMode||'curtas'},m));
    l.sessions=l.sessions||[];
    if(!Array.isArray(l.log))l.log=[];   // registro de correções: quem, quando, o quê
    if(l.live){
      const lv=l.live;
      lv.stage=lv.stage||'presenca';lv.presentIds=lv.presentIds||[];lv.teams=lv.teams||[];
      lv.queue=lv.queue||[];lv.matchIds=lv.matchIds||[];lv.gkPool=lv.gkPool||[];lv.gkFlip=lv.gkFlip||0;
      /* quem veio de goleiro é escolha do dia, não do cadastro */
      if(!Array.isArray(lv.gkToday))lv.gkToday=lv.presentIds.filter(id=>(l.players.find(x=>x.id===id)||{}).gk);
      lv.per=lv.per||Math.max(2,l.cfg.format-(lv.gkPool.length?1:0));
      if(!Array.isArray(lv.nextPair))lv.nextPair=null;
      if(!Array.isArray(lv.fila))lv.fila=[];
      if(!Array.isArray(lv.fill)||lv.fill.length!==2)lv.fill=[[],[]];
      lv.fillMan=!!lv.fillMan;lv.fillOff=!!lv.fillOff;
      if(lv.lastWinner===undefined)lv.lastWinner=null;
      lv.id=lv.id||uid();
      lv.mode=KMODE[lv.mode]?lv.mode:(l.cfg.matchMode||'curtas');
      if(lv.cur){
        const c=lv.cur;
        if(!Array.isArray(c.gks))c.gks=[null,null];
        if(!Array.isArray(c.startLineups))c.startLineups=c.lineups.map(x=>[...x]);
        if(!Array.isArray(c.startGks))c.startGks=[...c.gks];
        if(!Array.isArray(c.events))c.events=[];
        c.paused=!!c.paused;
        /* partida gravada pela versão que trocava o gol sem mover a escalação:
           cada goleiro volta a jogar do lado em que defende */
        aplicaMv(c.lineups,movesGk(c.lineups,c.gks));
      }
    }
  });
  if(!st.ligas.some(l=>l.id===st.active))st.active=null;
  return st;
}
let S=defState();
/* O estado começa vazio e é preenchido por boot() a partir do Postgres.
   save() não grava mais o app inteiro num JSON local: ele marca a liga ativa
   como suja e o sincronizador (fim do arquivo) empurra para o servidor.
   Só a preferência de aparelho (tema, aba, última liga aberta) fica local. */
const save=()=>{saveUI();markDirty(S.active)};
const L=()=>S.ligas.find(l=>l.id===S.active);
const P=(liga,id)=>liga.players.find(p=>p.id===id);
const nameOf=(liga,id)=>{const p=P(liga,id);return p?p.name:'—'};

/* ---------- trechos de partida: a unidade real do rating ----------
   Substituição muda o nível dos dois times. Então cada formação em campo é
   uma partida própria: o placar volta a zero na troca e vale o set novo de
   jogadores — o mesmo espírito do +/- da NBA. Se o seu time foi mal enquanto
   você estava no banco, isso não te afeta.
   - Trecho cortado por uma troca só conta se durou pelo menos cfg.stintMin
     minutos (padrão 3). Menos que isso, descarta.
   - O trecho que termina no apito conta sempre.
   - O peso é a fatia da partida que o trecho ocupou, então uma partida
     inteira continua valendo uma partida — 2 trechos não valem em dobro.    */
function pausedUntil(c,t){
  let paused=0,ini=null;
  for(const ev of c.events||[]){
    if(ev.t>t)break;
    if(ev.type==='pause'){if(ini===null)ini=ev.t}
    else if(ev.type==='resume'&&ini!==null){paused+=ev.t-ini;ini=null}
  }
  if(ini!==null)paused+=t-ini;
  return paused;
}
const gameTime=(c,t)=>Math.max(0,t-c.startedAt-pausedUntil(c,t));
function stintResult(sc){return sc[0]>sc[1]?0:sc[1]>sc[0]?1:'draw'}

/* Goleiro que muda de gol no meio da partida muda TAMBÉM de escalação — senão
   ele segue contando (e aparecendo) como jogador de linha do time antigo e
   nem entra na lista de autor do gol do time novo. `movesGk` calcula as
   mudanças de lado; `aplicaMv` aplica (ou desfaz, no undo); o evento 'gk'
   guarda `mv` para a reconstrução dos trechos refazer o mesmo caminho.      */
function movesGk(lineups,gks){
  const mv=[];
  [0,1].forEach(sd=>{const g=gks[sd];if(!g)return;const o=sd===0?1:0;
    if(lineups[o].includes(g))mv.push({id:g,de:o,para:sd});
    else if(!lineups[sd].includes(g))mv.push({id:g,de:-1,para:sd});
  });
  return mv;
}
function aplicaMv(lineups,mv,rev){
  (mv||[]).forEach(m=>{
    const de=rev?m.para:m.de,para=rev?m.de:m.para;
    if(de>=0){const k=lineups[de].indexOf(m.id);if(k>=0)lineups[de].splice(k,1)}
    if(para>=0&&!lineups[para].includes(m.id))lineups[para].push(m.id);
  });
}

function splitStints(c,endedAt,cfg,mode){
  cfg=cfg||defCfg();mode=KMODE[mode]?mode:(KMODE[cfg.matchMode]?cfg.matchMode:'curtas');
  const total=gameTime(c,endedAt);
  const evs=[...(c.events||[])].sort((a,b)=>a.t-b.t);
  if(total<45000){                       // lançamento retroativo: sem cronômetro confiável
    const sc=[0,0];evs.forEach(e=>{if(e.type==='goal')sc[e.side]++});
    const fim=sc[0]+sc[1]?sc:(c.score||[0,0]);
    return [{from:c.startedAt,to:endedAt,dur:total,w:1,counted:true,
      lineups:[c.lineups[0].slice(),c.lineups[1].slice()],gks:(c.gks||[null,null]).slice(),
      score:fim.slice(),result:stintResult(fim),ended:'apito'}];
  }
  const lin=[(c.startLineups||c.lineups)[0].slice(),(c.startLineups||c.lineups)[1].slice()];
  let gks=(c.startGks||c.gks||[null,null]).slice();
  const out=[];let from=c.startedAt,score=[0,0];
  /* Trecho curto vira ruido. O minimo e relativo: num racha de 7 min, 4 min
     seria quase a partida inteira e nenhuma troca contaria nunca.           */
  const minDur=Math.min((cfg.stintMin||3)*60000,total/3);
  const fecha=(to,ended)=>{
    const dur=Math.max(0,gameTime(c,to)-gameTime(c,from));
    out.push({from,to,dur,w:+clamp(dur/total,0,1).toFixed(4),
      counted:ended==='apito'||dur>=minDur,
      lineups:[lin[0].slice(),lin[1].slice()],gks:gks.slice(),
      score:score.slice(),result:stintResult(score),ended});
    from=to;score=[0,0];
  };
  for(const ev of evs){
    if(ev.type==='goal'){score[ev.side]++;continue}
    if(ev.type!=='sub'&&ev.type!=='gk')continue;
    fecha(ev.t,'troca');
    if(ev.type==='sub'){
      const k=lin[ev.side].indexOf(ev.out);
      if(!ev.in){if(k>=0)lin[ev.side].splice(k,1)}                 // foi embora: sai sem ninguém no lugar
      else if(k>=0)lin[ev.side][k]=ev.in;else lin[ev.side].push(ev.in);
    }
    if(Array.isArray(ev.gks))gks=ev.gks.slice();
    else if(ev.type==='gk'){const o=ev.side===0?1:0;if(ev.id&&gks[o]===ev.id)gks[o]=null;gks[ev.side]=ev.id||null}
    else if(ev.type==='sub'&&gks[ev.side]===ev.out)gks[ev.side]=null;
    if(ev.type==='gk')aplicaMv(lin,ev.mv||movesGk(lin,gks));   // goleiro que trocou de gol joga o resto do lado
                                                               // novo (evento antigo sem mv: quem defende, defende lá)
  }
  fecha(endedAt,'apito');
  /* Com mais de um trecho: trecho curto (menos de 20% da partida) SEM gol não
     conta para ninguém — nem o final. Os que contam dividem a partida em
     partes iguais (o K de cada um é K/n). Uma partida vale uma partida.     */
  if(out.length>1){
    if(mode==='unica'){
      /* Partida longa, trocas rolando: o peso é a fatia de tempo (quem jogou
         10 de 50 min não pesa como quem jogou 40). Trecho conta a partir do
         mínimo absoluto (stintMin), com ou sem gol; o final conta sempre.  */
      out.forEach(st=>{st.counted=st.ended==='apito'||st.dur>=minDur});
      if(!out.some(st=>st.counted))out.reduce((a,b)=>b.dur>a.dur?b:a).counted=true;
      const soma=out.reduce((a,st)=>a+(st.counted?st.dur:0),0)||1;
      out.forEach(st=>{st.w=st.counted?+(st.dur/soma).toFixed(4):0});
    }else{
      out.forEach(st=>{if(st.w<STINT_MIN_W&&st.score[0]+st.score[1]===0)st.counted=false});
      if(!out.some(st=>st.counted))out.reduce((a,b)=>b.dur>a.dur?b:a).counted=true;
      const n=out.filter(st=>st.counted).length;
      out.forEach(st=>{st.w=st.counted?+(1/n).toFixed(4):0});
    }
  }
  return out;
}
const STINT_MIN_W=.2;
/* Partida longa: só quem esteve em quadra por pelo menos esta fração do tempo
   que conta recebe a vitória/derrota da partida (e conta a partida jogada).
   Quem jogou 3 minutos de 50 mexe no rating pelo trecho dele, mas não "jogou
   a partida". No racha curto qualquer trecho válido basta.                 */
const UNICA_MIN_SHARE=.25;
const contaPartida=(liga,m,dur,total)=>modoDe(liga,m)!=='unica'||(total>0&&dur/total>=UNICA_MIN_SHARE);
/* +/- (como na NBA): gols do seu lado menos gols do outro enquanto você
   estava em quadra, somando todos os trechos — gol é gol, mesmo em trecho
   curto. É a estatística que sobrevive à partida longa, onde V/E/D é uma só. */
function plusMinus(liga,m,acc){
  matchStints(liga,m).forEach(st=>{const part=stintPart(st),sc=st.score||[0,0];
    for(const pid in part){const sd=part[pid].side;acc(pid,sc[sd]-sc[1-sd],part[pid].role)}});
}
const pmTxt=v=>(v>0?'+':v<0?'−':'')+Math.abs(v||0);
/* Quem estava em campo no trecho e em que papel — goleiro move o nível de
   goleiro, todo o resto move a de linha.                                     */
function stintPart(st){
  if(st.part)return st.part;
  const part={};
  [0,1].forEach(side=>(st.lineups[side]||[]).forEach(pid=>{
    part[pid]={side,w:1,role:(st.gks||[])[side]===pid?'G':'L'};
  }));
  return part;
}
/* Partida gravada por uma versão antiga do app vira um trecho só. */
function matchStints(liga,m){
  if(Array.isArray(m.stints)&&m.stints.length)return m.stints;
  const part={},gks=m.gks||[];
  for(const pid in (m.part||{})){const x=m.part[pid];
    part[pid]={side:x.side,w:x.w,role:gks.indexOf(pid)>=0?'G':'L'}}
  return [{dur:0,w:1,counted:true,part,lineups:m.lineups||[[],[]],gks,
    score:m.score||[0,0],result:m.result,ended:'apito'}];
}

/* ---------- corrigir escalação e trocas de uma partida encerrada ----------
   O que a partida gravou (escalação de largada + log de eventos) é o que gera
   os trechos. Corrigir qualquer um dos dois é reescrever os trechos com a
   MESMA conta do apito final (`splitStints`) e mandar recalcular a liga.    */
const gksIni=m=>((m.startGks||((m.stints||[])[0]||{}).gks||m.gks||[null,null])).slice();
const podeCorrigirEsc=m=>!!(m&&m.startedAt&&m.endedAt&&(m.endedAt-m.startedAt)>0);
/* Quem esteve em quadra naquele instante, daquele lado — é a lista de quem
   pode sair numa troca ou ir para o gol.                                    */
function escalaEm(liga,m,t,side){
  const sts=matchStints(liga,m);
  let st=sts[0];
  sts.forEach(x=>{if(x.from!==undefined&&x.from<t)st=x});
  return (((st||{}).lineups||[[],[]])[side]||[]).slice();
}
/* Todo mundo que a partida cita: escalação, trocas, goleiros. Ninguém de fora
   pode ser posto na partida duas vezes.                                     */
function genteDaPartida(m){
  const s=new Set();
  (m.startLineups||m.lineups||[[],[]]).forEach(l=>(l||[]).forEach(id=>s.add(id)));
  (m.lineups||[[],[]]).forEach(l=>(l||[]).forEach(id=>s.add(id)));
  (m.events||[]).forEach(e=>{[e.out,e.in,e.id].forEach(id=>{if(id)s.add(id)})});
  gksIni(m).forEach(id=>{if(id)s.add(id)});
  return s;
}
/* Quem pode ENTRAR numa troca naquele instante: quem não está em quadra de
   nenhum dos dois lados — primeiro quem já é da partida, depois o cadastro. */
function foraDeQuadra(liga,m,t){
  const ocup=new Set([...escalaEm(liga,m,t,0),...escalaEm(liga,m,t,1)]);
  const gente=genteDaPartida(m);
  const resto=(liga.players||[]).filter(p=>!gente.has(p.id)).map(p=>p.id)
    .sort((a,b)=>nameOf(liga,a).localeCompare(nameOf(liga,b)));
  return [...gente].filter(id=>!ocup.has(id)).concat(resto);
}
/* Instantâneo de goleiro nos eventos: a partida gravou `gks` em cada evento.
   Mudar um goleiro na revisão precisa corrigir esses instantâneos até o
   próximo evento de goleiro daquele lado — senão a partida "volta" para o
   goleiro antigo na primeira troca. Se o novo goleiro sai numa substituição,
   o lado fica sem goleiro fixo dali para a frente.                          */
function ajustaGksEventos(m,side,desde,novo){
  const evs=(m.events||[]).slice().sort((a,b)=>a.t-b.t);
  for(const ev of evs){
    if(ev.t<desde)continue;
    if(ev.type==='gk'&&ev.side===side)break;
    if(ev.type==='sub'&&ev.side===side&&novo&&ev.out===novo){
      if(Array.isArray(ev.gks))ev.gks[side]=null;
      break;
    }
    if(Array.isArray(ev.gks))ev.gks[side]=novo;
  }
}
/* Um instante de jogo (ms de relógio de partida) vira hora de parede: o tempo
   parado no meio tem que entrar de volta na conta.                          */
function tDoMinuto(m,ms){
  const fim=gameTime(m,m.endedAt),alvo=clamp(ms,0,fim);
  let t=m.startedAt+alvo;
  for(let k=0;k<4;k++)t=m.startedAt+alvo+pausedUntil(m,t);
  return clamp(t,m.startedAt+1,m.endedAt-1);
}
function recalcPartida(liga,m){
  const ini=(m.startLineups||m.lineups||[[],[]]).map(x=>(x||[]).slice());
  const c={startedAt:m.startedAt,score:(m.score||[0,0]).slice(),
    events:(m.events||[]).slice().sort((a,b)=>a.t-b.t),
    lineups:(m.lineups||ini).map(x=>(x||[]).slice()),
    startLineups:ini,gks:(m.gks||[null,null]).slice(),startGks:gksIni(m)};
  const sts=splitStints(c,m.endedAt,liga.cfg,modoDe(liga,m));
  /* partida curta demais para ter cronômetro (um trecho só, tudo junto): a
     escalação corrigida é a que vale                                        */
  if(sts.length===1&&(sts[0].dur||0)<45000){
    sts[0].lineups=[ini[0].slice(),ini[1].slice()];sts[0].gks=c.startGks.slice();
    delete sts[0].part;
  }
  /* o resultado lançado à mão continua valendo: vale para o trecho que fechou
     a partida, ou para o maior que conta se o final foi descartado (finish)  */
  if(sts.length){
    const ult=sts[sts.length-1];
    const alvo=ult.counted?ult:sts.filter(x=>x.counted).sort((a,b)=>b.dur-a.dur)[0];
    if(alvo&&(!ult.counted||m.result!==stintResult(m.score)))alvo.result=m.result;
  }
  m.stints=sts;
  m.startLineups=ini;
  m.startGks=c.startGks.slice();      // a partir daqui fica gravado: a reconstrução depende dele
  const fim=sts[sts.length-1];
  if(fim){m.lineups=[(fim.lineups[0]||[]).slice(),(fim.lineups[1]||[]).slice()];m.gks=(fim.gks||[null,null]).slice()}
}
/* Rascunho da correção: as mudanças acontecem numa CÓPIA da partida e só
   valem no Salvar. É por isso que dá para mexer à vontade sem recalcular a
   liga a cada toque — e para desistir sem deixar rastro. Vive fora de `S`:
   rascunho não vai para o disco.                                            */
let ESC=null;
function rascunhoEsc(m){
  if(!m||!podeCorrigirEsc(m))return null;
  if(!ESC||ESC.mid!==m.id)ESC={mid:m.id,m:JSON.parse(JSON.stringify(m)),mud:[],nt:null};
  return ESC;
}
/* Uma mudança no rascunho: anota o que foi feito, refaz os trechos da cópia
   (é a prévia do "como fica") e volta para a tela.                          */
function mudaEsc(liga,r,txt){
  r.mud.push(txt);
  recalcPartida(liga,r.m);
  openSheet(viewEditEsc(liga,r.m,r));
}
/* ---------- rating invisível ---------- */
function computeElo(liga,part,result,mode,weight){
  const cfg=liga.cfg,W=weight===undefined?1:weight,sum=[0,0],wsum=[0,0];
  for(const pid in part){const p=P(liga,pid);if(!p)continue;
    const {side,w}=part[pid];sum[side]+=rt(p,part[pid].role).elo*w;wsum[side]+=w;}
  const avg=[wsum[0]?sum[0]/wsum[0]:cfg.startElo,wsum[1]?sum[1]/wsum[1]:cfg.startElo];
  const Ea=1/(1+Math.pow(10,(avg[1]-avg[0])/400)),E=[Ea,1-Ea];
  const Sc=Array.isArray(result)?result:result==='draw'?[.5,.5]:result===0?[1,0]:[0,1];
  const deltas={},pre={};
  for(const pid in part){const p=P(liga,pid);if(!p)continue;
    const tr=rt(p,part[pid].role);
    pre[pid]=tr.elo;
    const km=KMODE[mode]||KMODE[cfg.matchMode]||KMODE.curtas;
    const K=(calibrando(liga,p,tr)?km.cal:kFor(km,tr))*streakK(tr);
    deltas[pid]=Math.round(K*(Sc[part[pid].side]-E[part[pid].side])*part[pid].w*W);
  }
  return {avg,exp:E,deltas,pre};
}
/* Histerese: promove só quando passa do corte + margem, rebaixa só quando cai
   abaixo do corte − margem, e quem acabou de subir fica protegido por algumas
   partidas. É isso que impede o efeito ioiô entre dois níveis.            */
/* Calibração: um critério só, escolhido pelo modo da liga — PARTIDAS no
   racha curto (15; a ~7 por pessoa por noite, ~2 noites), RACHAS na partida
   única (3), onde a noite tem uma partida só. Vale por trilha: quem nunca
   pegou no gol calibra do zero o nível de goleiro na primeira vez lá.       */
function calibrando(liga,p,tr){
  tr=tr||(p&&p.L)||p;
  return liga.cfg.matchMode==='unica'?(tr.sessions||0)<liga.cfg.calRachas:(tr.games||0)<liga.cfg.calGames;
}
/* texto do que falta calibrar, no idioma da liga */
const calMeta=liga=>liga.cfg.matchMode==='unica'?{n:liga.cfg.calRachas,u:'rachas',de:tr=>tr.sessions||0}:{n:liga.cfg.calGames,u:'partidas',de:tr=>tr.games||0};
const calTxt=(liga,tr)=>{const c=calMeta(liga);return c.de(tr)+'/'+c.n+' '+c.u};
function updateRank(liga,p,tr){
  tr=tr||p.L;
  const cfg=liga.cfg,before=tr.rank;
  const m=calibrando(liga,p,tr)?0:cfg.rankMargin;   // calibrando: anda livre
  const shielded=tr.protect>0;                       // vale a partida inteira em que ainda ha protecao
  if(tr.protect>0)tr.protect--;
  while(tr.rank<TOP&&tr.elo>=stepMin(tr.rank+1)+m)tr.rank++;
  if(tr.rank>before)tr.protect=cfg.protectMatches;
  else if(!shielded){while(tr.rank>0&&tr.elo<=stepMin(tr.rank)-m)tr.rank--;}
  tr.peak=Math.max(tr.peak||0,tr.rank);
  return tr.rank-before;
}
/* Partida única: o placar do confronto vale por MARGEM. 0-0 é meio a meio;
   cada gol de diferença puxa para o lado de quem fez, saturando (1-0 → 0,73,
   2-0 → 0,88, 3-0 → 0,95). Gol importa muito, mas 5-0 não vale cinco vezes
   1-0 — e empatar com time pior em campo custa pontos, como no Elo.        */
const margemS=(gf,gc)=>{const t=Math.tanh((gf-gc)/2);return [+(0.5+0.5*t).toFixed(4),+(0.5-0.5*t).toFixed(4)]};
/* Unidades que movem o nível. No racha curto, cada trecho que conta (D-37).
   Na partida única (D-45), trechos com o MESMO confronto (mesmas escalações
   e goleiros dos dois lados) se juntam num só: placar somado, tempo somado,
   resultado pela margem. Quem sai e volta contra o mesmo time não vira dois
   jogos.                                                                    */
function unidadesNivel(liga,m){
  const sts=matchStints(liga,m).filter(st=>st.counted);
  if(modoDe(liga,m)!=='unica')return sts.map(st=>({part:stintPart(st),S:st.result==='draw'?[.5,.5]:st.result===0?[1,0]:[0,1],w:st.w,dur:st.dur||0,score:st.score}));
  const G={},ordem=[];
  for(const st of sts){
    const key=JSON.stringify([[...st.lineups[0]].sort(),[...st.lineups[1]].sort(),st.gks||[null,null]]);
    let g=G[key];if(!g){g=G[key]={part:stintPart(st),w:0,dur:0,score:[0,0]};ordem.push(g)}
    g.w+=st.w;g.dur+=st.dur||0;g.score[0]+=(st.score||[0,0])[0];g.score[1]+=(st.score||[0,0])[1];
  }
  ordem.forEach(g=>{g.w=+g.w.toFixed(4);g.S=margemS(g.score[0],g.score[1])});
  return ordem;
}
function applyMatch(liga,m){
  const seen={};m.deltas={};m.over={};m.pre=m.pre||{};
  for(const st of unidadesNivel(liga,m)){
    const part=st.part;
    const r=computeElo(liga,part,st.S,m.mode,st.w);
    for(const pid in part){
      const p=P(liga,pid);if(!p)continue;
      const role=part[pid].role||'L',tr=rt(p,role),k=pid+role;
      if(m.pre[pid]===undefined)m.pre[pid]=tr.elo;
      if(!seen[k])seen[k]={pid,role,from:tr.rank,rank:tr.rank,side:part[pid].side,dur:0};
      seen[k].side=part[pid].side;seen[k].dur+=st.dur||0;
      const d=r.deltas[pid]||0;
      tr.elo+=d;m.deltas[pid]=(m.deltas[pid]||0)+d;
      /* Acima do esperado: (resultado - chance que ele tinha) x peso do trecho.
         Vale 1 = uma vitoria inteira a mais do que o confronto indicava.      */
      const Sv=st.S[part[pid].side];
      m.over[pid]=(m.over[pid]||0)+(Sv-r.exp[part[pid].side])*(part[pid].w||1)*st.w;
      updateRank(liga,p,tr);
      seen[k].rank=tr.rank;
    }
  }
  /* Vitória/derrota é da PARTIDA: quem esteve num trecho que conta recebe o
     resultado final dela uma vez, pelo lado em que terminou.                */
  const totalDur=matchStints(liga,m).reduce((a,st)=>a+(st.counted?(st.dur||0):0),0);
  for(const k in seen){
    const x=seen[k],p=P(liga,x.pid);if(!p)continue;
    if(!contaPartida(liga,m,x.dur,totalDur))continue;
    const tr=rt(p,x.role);
    tr.games++;
    const res=m.result==='draw'?'E':(m.result===x.side?'V':'D');
    if(res==='V')tr.w++;else if(res==='D')tr.l++;else tr.d++;
    tr.form.unshift(res);tr.form=tr.form.slice(0,10);
    if(m.sessionId&&tr.lastSession!==m.sessionId){tr.sessions=(tr.sessions||0)+1;tr.lastSession=m.sessionId}
    if(m.sessionId&&p.lastSession!==m.sessionId){p.sessions=(p.sessions||0)+1;p.lastSession=m.sessionId}
  }
  plusMinus(liga,m,(pid,d)=>{const p=P(liga,pid);if(p)p.pm=(p.pm||0)+d});
  /* mudança de nível só existe para quem TEM nível: quem ainda calibra sem
     nível manual anda por baixo, mas não aparece em subiu/caiu            */
  m.moves=Object.keys(seen).map(k=>seen[k]).filter(x=>x.rank!==x.from&&temPatente(liga,P(liga,x.pid),x.role))
    .map(x=>({pid:x.pid,role:x.role,dir:x.rank>x.from?1:-1,rank:x.rank}));
  for(const g of m.goals||[]){const p=P(liga,g.pid);if(!p)continue;if(g.own)p.gc=(p.gc||0)+1;else p.goals++}
}
/* Recalcula tudo do zero a partir do nível de entrada de cada jogador — é o
   que permite corrigir ou anular uma partida antiga sem deixar resíduo.     */
function rebuildAll(liga){
  liga.players.forEach(p=>{
    p.pm=0;
    ['L','G'].forEach(k=>{
      const tr=p[k]=fixTrack(p[k],liga.cfg.startElo);
      tr.elo=tr.base;tr.rank=stepOf(tr.base);tr.peak=tr.rank;tr.protect=0;
      tr.games=0;tr.w=0;tr.l=0;tr.d=0;tr.form=[];tr.sessions=0;tr.lastSession=null;
    });
    p.goals=0;p.gc=0;p.sessions=0;p.lastSession=null;
  });
  [...liga.matches].sort((a,b)=>a.ts-b.ts).forEach(m=>{
    if(m.voided){m.deltas={};m.moves=[];return}
    m.pre={};applyMatch(liga,m);
  });
}

/* ---------- montagem de times ---------- */
/* Quem é goleiro é escolha do dia: vem de lv.gkToday, não do cadastro.
   O cadastro (p.gk) só sugere quem costuma ir para o gol.                   */
const gkSetOf=(liga,ids,gkToday)=>Array.isArray(gkToday)?gkToday.slice()
  :(ids||liga.players.map(p=>p.id)).filter(id=>{const p=P(liga,id);return !!(p&&p.gk)});
/* O nível que conta é o do papel: goleiro do dia vale pelo nível de goleiro. */
const lvlOf=(p,isGk)=>rt(p,isGk?'G':'L').elo;
const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
/* Em quantos rachas diferentes cada dupla já jogou junta. Serve para desmanchar
   panelinha: entre dois arranjos igualmente equilibrados, ganha o que separa
   quem sempre joga junto.                                                    */
function pairCounts(liga){
  const seen={},out={};
  (liga.matches||[]).forEach(m=>{
    if(m.voided)return;
    const sid=m.sessionId||m.id,sets=[];
    if(Array.isArray(m.stints)&&m.stints.length)m.stints.forEach(st=>(st.lineups||[]).forEach(ids=>sets.push(ids)));
    else (m.lineups||[]).forEach(ids=>sets.push(ids));
    sets.forEach(ids=>{
      for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
        const k=pairKey(ids[i],ids[j]),s=seen[k]||(seen[k]={});
        if(!s[sid]){s[sid]=1;out[k]=(out[k]||0)+1}
      }
    });
  });
  return out;
}
const REPEAT_TOL=8;    // quanto de equilíbrio (em pontos internos) se aceita abrir mão para separar uma dupla repetida

/* Uma fatia que atravessa todos os níveis: divide a lista (ordenada por nível)
   em k faixas e sorteia uma pessoa de cada. Serve para escolher QUEM FICA DE
   FORA sem jogar os piores todos para a fila — quem espera tem que ser um
   recorte do racha, não o fundo dele.                                       */
function fatiaEquilibrada(ordenados,k){
  const out=[],m=ordenados.length;
  for(let i=0;i<k&&i<m;i++){
    const ini=Math.floor(i*m/k),fim=Math.max(ini+1,Math.floor((i+1)*m/k));
    const faixa=ordenados.slice(ini,fim).filter(p=>out.indexOf(p)<0);
    if(faixa.length)out.push(faixa[Math.floor(Math.random()*faixa.length)]);
  }
  return out;
}
const RUIDO_MONTAGEM=50;   // pontos internos de ruído, só na hora de montar

function buildTeams(liga,ids,n,caps,gkToday,strict){
  const ps=ids.map(id=>P(liga,id)).filter(Boolean);
  const gkIds=gkSetOf(liga,ids,gkToday);
  const isGk=p=>gkIds.indexOf(p.id)>=0;
  /* Com gente parelha existem vários arranjos igualmente equilibrados, e sem
     ruído "Equilibrar" devolveria sempre o mesmo. O ruído vive SÓ aqui dentro:
     chance de vitória, barra de equilíbrio e veredito usam o nível real.     */
  const ruido={};ps.forEach(p=>ruido[p.id]=(Math.random()-.5)*RUIDO_MONTAGEM);
  const lvl=p=>lvlOf(p,isGk(p))+(ruido[p.id]||0);   // só no sorteio/draft
  const real=p=>lvlOf(p,isGk(p));                   // daqui para a frente, nível de verdade
  const gks=ps.filter(isGk).sort((a,b)=>lvl(b)-lvl(a));
  const line=ps.filter(p=>!isGk(p)).sort((a,b)=>lvl(b)-lvl(a));
  const teams=Array.from({length:n},()=>[]);
  caps=caps&&caps.length===n?caps.slice():Array.from({length:n},(_,i)=>Math.floor(ps.length/n)+(i<ps.length%n?1:0));
  gks.forEach((g,i)=>{                       // um goleiro por time, no time que ainda tem vaga
    let t=i%n,volta=0;
    while(teams[t].length>=caps[t]&&volta<n){t=(t+1)%n;volta++}
    if(strict&&teams[t].length>=caps[t])return;   // sem vaga: fica de fora
    teams[t].push(g);
  });
  /* Quando há mais gente que vaga, quem fica de fora é uma fatia que atravessa
     todos os níveis — a fila tem que ser tão equilibrada quanto os times.    */
  let elenco=line;
  if(strict){
    const vagas=caps.reduce((a,c,i)=>a+Math.max(0,c-teams[i].length),0);
    if(line.length>vagas){
      const fora=fatiaEquilibrada(line,line.length-vagas);
      elenco=line.filter(p=>fora.indexOf(p)<0);
    }
  }
  for(const p of elenco){                    // draft guloso: o melhor livre cai no time mais fraco com vaga
    let best=-1,bestSum=Infinity;
    for(let t=0;t<n;t++){
      if(teams[t].length>=caps[t])continue;
      const sum=teams[t].reduce((a,x)=>a+lvl(x),0);
      if(sum<bestSum){bestSum=sum;best=t}
    }
    if(best<0){
      if(strict)continue;                    // curto: sem vaga em time nenhum, fica de fora
      best=teams.reduce((a,t,i)=>teams[a].length<=t.length?a:i,0);
    }
    teams[best].push(p);
  }
  const score=t=>{const a=t.map(x=>x.reduce((s,p)=>s+real(p),0)/Math.max(1,x.length));return Math.max(...a)-Math.min(...a)};
  const pc=liga.cfg.avoidRepeat?pairCounts(liga):null;
  const rep=t=>!pc?0:t.reduce((s,x)=>{
    let c=0;for(let i=0;i<x.length;i++)for(let j=i+1;j<x.length;j++)c+=(pc[pairKey(x[i].id,x[j].id)]||0);
    return s+c;},0);
  const troca=(x,ix,y,iy)=>{const t=teams[x][ix];teams[x][ix]=teams[y][iy];teams[y][iy]=t};
  const sorteia=()=>{
    const x=Math.floor(Math.random()*n);let y=Math.floor(Math.random()*n);if(y===x)y=(y+1)%n;
    if(!teams[x].length||!teams[y].length)return null;
    const ix=Math.floor(Math.random()*teams[x].length),iy=Math.floor(Math.random()*teams[y].length);
    if(isGk(teams[x][ix])!==isGk(teams[y][iy]))return null;
    return [x,ix,y,iy];
  };
  let best=score(teams);
  for(let it=0;it<600;it++){                 // 1) equilíbrio: trocas 1:1 (preserva tamanhos e goleiros)
    const s=sorteia();if(!s)continue;
    troca(s[0],s[1],s[2],s[3]);
    const sc=score(teams);
    if(sc<best)best=sc;else troca(s[0],s[1],s[2],s[3]);
  }
  if(pc){                                    // 2) desempate: separa quem já jogou junto, sem estragar o equilíbrio
    let curRep=rep(teams);
    for(let it=0;it<400&&curRep>0;it++){
      const s=sorteia();if(!s)continue;
      troca(s[0],s[1],s[2],s[3]);
      const sc=score(teams),rp=rep(teams);
      if(sc<=best+REPEAT_TOL&&rp<curRep){curRep=rp;if(sc<best)best=sc}
      else troca(s[0],s[1],s[2],s[3]);
    }
  }
  // titulares primeiro: dentro do time, os melhores abrem jogando
  return teams.map((t,i)=>({name:TEAMNAMES[i],ids:t.sort((a,b)=>real(b)-real(a)).map(p=>p.id)}));
}
function shuffleTeams(liga,ids,n,caps,strict){
  const a=[...ids].sort(()=>Math.random()-.5),teams=Array.from({length:n},()=>[]);
  caps=caps&&caps.length===n?caps.slice():Array.from({length:n},(_,i)=>Math.floor(a.length/n)+(i<a.length%n?1:0));
  a.forEach(id=>{let t=0;while(t<n&&teams[t].length>=caps[t])t++;
    if(t>=n){if(strict)return;t=n-1}
    teams[t].push(id)});
  return teams.map((t,i)=>({name:TEAMNAMES[i],ids:t}));
}
/* Quantas pessoas um time precisa ter em quadra. Quando os goleiros revezam,
   eles não pertencem a time nenhum, então o time é de N−1 jogadores de linha. */
function perTeamSize(liga,rotating){return Math.max(2,liga.cfg.format-(rotating?1:0))}
/* Tamanho de cada time.
   - Racha curto: **time é sempre cheio**, do tamanho do formato. Ninguém joga
     4 contra 5, e não existe time de 3 esperando: quem não completa um time
     fica DE FORA e entra por substituição ou completando quem ficou curto.
     Só quando nem dois times cheios dão é que se joga com menos dos dois lados.
   - Partida única: todo mundo dividido — cada time com titulares + reservas.          */
function planCaps(total,n,per,mode){
  if(mode==='unica')return Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0));
  const base=Math.min(per,Math.floor(total/2));   // só cai abaixo do formato se não der dois times
  return Array.from({length:n},()=>base);
}
/* Decide de uma vez: goleiros no rodízio?, quantos times, e o tamanho de cada um. */
function planTeams(liga,presentIds,force,mode,gkToday){
  force=force||{};
  mode=KMODE[mode]?mode:(liga.cfg.matchMode||'curtas');
  const gkAll=gkSetOf(liga,presentIds,gkToday);
  const isGk=id=>gkAll.indexOf(id)>=0;
  const gks=presentIds.filter(isGk);
  const calc=rot=>{
    const per=perTeamSize(liga,rot);
    const ids=rot?presentIds.filter(id=>!isGk(id)):presentIds.slice();
    const total=ids.length;
    let n;
    /* Nem forcando: 3 times so existem se der 3 times CHEIOS. Com 16 de linha no
       7v7 cabem 2 times de 6 e 4 na fila — nao 6/5/5.                        */
    const cabem=Math.max(2,Math.floor(total/per));
    if(force.n)n=Math.min(force.n,cabem);
    else if(mode==='unica')n=2;
    else{
      // só vira time quem dá um time INTEIRO: 10 de linha no 5v5 são 2 times de 4
      // (com os goleiros) e 2 de fora — nunca 3 times de 4, 3 e 3
      n=Math.floor(total/per);
    }
    return{per,ids,total,n:clamp(n,2,4)};
  };
  let rot=force.rotating!==undefined?force.rotating:gks.length>0;
  let r=calc(rot);
  if(force.rotating===undefined&&rot&&gks.length>=r.n){rot=false;r=calc(false)}   // dá um goleiro por time
  rot=rot&&gks.length>0;
  return{rotating:rot,gkPool:rot?gks.slice():[],per:r.per,n:r.n,ids:r.ids,gkIds:gkAll,
    caps:planCaps(r.total,r.n,r.per,mode)};
}
function applyPlan(liga,lv,force,modo){
  const pl=planTeams(liga,lv.presentIds,force,lv.mode,lv.gkToday);
  /* remontar os times invalida a partida que estava em campo */
  if(lv.cur&&(!lv.teams[lv.cur.a]||!lv.teams[lv.cur.b]||pl.n!==lv.teams.length))lv.cur=null;
  lv.gkPool=pl.gkPool;lv.per=pl.per;lv.sel=null;lv.lastWinner=null;lv.lastSide=null;lv.nextPair=null;
  const curto=(lv.mode||liga.cfg.matchMode)!=='unica';   // reserva automatica so no modo longo
  lv.teams=modo==='shuffle'?shuffleTeams(liga,pl.ids,pl.n,pl.caps,curto)
    :buildTeams(liga,pl.ids,pl.n,pl.caps,pl.gkIds,curto);
  resetFill(lv);
  lv.queue=lv.teams.map((_,i)=>i).slice(2);
  liga.cfg.teamCount=pl.n;
  return pl;
}
const teamAvg=(liga,t,gkToday)=>{
  if(!t.ids.length)return 0;
  const gk=gkSetOf(liga,t.ids,gkToday);
  return t.ids.reduce((s,id)=>{const p=P(liga,id);return s+(p?lvlOf(p,gk.indexOf(id)>=0):0)},0)/t.ids.length;
};

/* Sugestão de quem entra — o usuário pode trocar à vontade. Empate com 4
   times: os dois saem; com 3, fica o que entrou por último (D-39). Quem
   venceu (ou ficou no empate) continua do MESMO lado da quadra em que jogou
   (lv.lastSide, D-71): trocar o lado de quem nem saiu confunde todo mundo.  */
function suggestPair(liga,lv){
  const all=lv.teams.map((_,i)=>i);
  if(all.length<2)return [0,0];
  if(all.length===2)return [0,1];
  const fila=(lv.queue||[]).filter(i=>all.indexOf(i)>=0);
  if(liga.cfg.winnerStays&&lv.lastWinner!=null&&fila.length)
    return lv.lastSide===1?[fila[0],lv.lastWinner]:[lv.lastWinner,fila[0]];
  const order=[...all.filter(i=>fila.indexOf(i)<0),...fila];
  return [order[0],order[1]];
}
/* Goleiros da próxima partida. Regra do racha: o goleiro fica com o time que
   FICA em quadra (venceu, ou ficou no empate); só o outro lado troca, e troca para quem está há mais
   tempo esperando no rodízio (gkPool é a fila). O lançador pode trocar na
   mão antes do apito (lv.nextGks) — o critério da quadra manda.
   planGks só olha; commitGks aplica na largada e gira a fila.              */
function planGks(liga,lv,pair){
  const pool=lv.gkPool||[];
  const manual=lv.nextGks&&lv.nextGks.pair&&lv.nextGks.pair[0]===pair[0]&&lv.nextGks.pair[1]===pair[1]?lv.nextGks.gks:null;
  if(manual)return {gks:manual.slice(),fica:[false,false],manual:true};
  if(!pool.length)return {gks:[null,null],fica:[false,false],manual:false};
  const last=lv.lastGks||{};
  const gks=[null,null],fica=[false,false];
  [0,1].forEach(sd=>{
    const t=pair[sd],g=last[t];
    const ficou=Array.isArray(lv.lastStay)?lv.lastStay.includes(t):lv.lastWinner===t;   // venceu, ou ficou no empate
    if(liga.cfg.winnerStays&&ficou&&g&&pool.includes(g)){gks[sd]=g;fica[sd]=true}
  });
  const livres=pool.filter(id=>!gks.includes(id));
  if(pool.length===1&&!gks[0]&&!gks[1]){                  // um goleiro só: alterna o lado
    const sd=(lv.gkFlip||0)%2?1:0;gks[sd]=pool[0];
  }else[0,1].forEach(sd=>{if(!gks[sd]&&livres.length)gks[sd]=livres.shift()});
  return {gks,fica,manual:false};
}
function commitGks(liga,lv,pair){
  const plan=planGks(liga,lv,pair),pool=lv.gkPool||[];
  lv.gkFlip=(lv.gkFlip||0)+1;
  /* quem foi para o gol vai para o fim da fila do rodízio; quem ficou esperando sobe */
  const usados=plan.gks.filter(id=>id&&pool.includes(id));
  lv.gkPool=pool.filter(id=>!usados.includes(id)).concat(usados);
  lv.nextGks=null;
  return plan.gks;
}

/* ---------- estatísticas: duelos, parcerias e números da liga ----------
   Tudo sai dos trechos contados — é neles que se sabe quem estava em quadra,
   de que lado e contra quem. Por isso um "confronto" vale igual em 1v1, 5v5
   ou 1v3: o que importa é ter estado em campo ao mesmo tempo, em lados
   opostos. Nada aqui usa rating: é histórico puro.                          */
const ANO=ms=>new Date(ms).getFullYear();
const ANO_ATUAL=()=>new Date().getFullYear();
/* período das estatísticas: 'sempre', 'ano' (= ano atual) ou um ano específico */
/* 'sempre' | 'ano' (atual) | 2024 | 'mes' (últimos 30 dias) | 'racha:<id>' (o último racha) */
const ultimoRachaId=liga=>{const ms=(liga.matches||[]).filter(m=>!m.voided);if(!ms.length)return null;const m=ms.reduce((a,b)=>b.ts>a.ts?b:a);return m.sessionId||m.id};
const statsPeriodo=liga=>{const v=S.ui.statsPer;
  if(v==='sempre'||v==='mes')return v;
  if(v==='racha')return 'racha:'+(liga?ultimoRachaId(liga):'');
  return /^\d{4}$/.test(String(v))?+v:'ano'};
function noPeriodo(m,p){
  if(!p||p==='sempre')return true;
  if(p==='mes')return m.ts>=Date.now()-30*86400000;
  if(typeof p==='string'&&p.indexOf('racha:')===0)return (m.sessionId||m.id)===p.slice(6);
  return ANO(m.ts)===(p==='ano'?ANO_ATUAL():+p);
}
const MIN_JOGOS=10;          // piso para entrar em ranking de aproveitamento
function pctDe(v,n){return n?Math.round(v/n*100):0}
/* Aproveitamento como o futebol conta: pontos ganhos sobre pontos disputados
   (V=3, E=1 — D-69). 100% é só vitória; empatar tudo dá 33%. A % de vitórias
   pura tratava empate como derrota, e racha empata muito.                   */
function aprDe(v,e,n){return n?Math.round((3*v+(e||0))/(3*n)*100):0}

function statsLiga(liga,periodo,semGk){
  const J={},DU={},PA={};
  /* seq: sequência atual de vitórias (zera em derrota; empate não zera nem soma)
     best: maior sequência do período · ultimos: últimos 5 resultados, do mais
     novo para o mais velho · sofridos: gols levados enquanto estava no gol      */
  const j=pid=>J[pid]||(J[pid]={pid,rachas:{},nR:0,jogos:0,v:0,e:0,d:0,gols:0,gk:0,sofridos:0,ultimo:0,seq:0,best:0,ultimos:[],min:0,minGk:0,pm:0});
  const par=(o,a,b)=>{const m=o[a]||(o[a]={});return m[b]||(m[b]={n:0,v:0,e:0,d:0})};
  [...(liga.matches||[])].sort((a,b)=>a.ts-b.ts).forEach(m=>{   // em ordem: sequência depende dela
    if(m.voided||!noPeriodo(m,periodo))return;
    const sid=m.sessionId||m.id;
    /* por partida: quem esteve em algum trecho que conta recebe o resultado
       final uma vez; tempo, gols sofridos e tempo no gol saem dos trechos */
    const em={};                                   // pid -> {side, gk, com:{}, contra:{}}
    matchStints(liga,m).forEach(st=>{
      if(!st.counted)return;
      const part=stintPart(st),lados=[[],[]];
      for(const pid in part)lados[part[pid].side].push(pid);
      [0,1].forEach(s=>{
        const meu=lados[s],deles=lados[s===0?1:0];
        /* "sem goleiros": o trecho no gol não conta pelo time (jogos, V/E/D,
           tempo, duelos, parcerias) — só alimenta os números de goleiro.
           Justo para o rodízio, que troca de lado sem escolher o time.       */
        const meuL=semGk?meu.filter(q=>part[q].role!=='G'):meu;
        const delesL=semGk?deles.filter(q=>part[q].role!=='G'):deles;
        meu.forEach(pid=>{
          const x=j(pid),ehG=part[pid].role==='G';
          if(ehG){x.sofridos+=((st.score||[0,0])[s===0?1:0])||0;x.minGk+=st.dur||0}
          if(semGk&&ehG)return;
          const e=em[pid]||(em[pid]={side:s,gk:false,com:{},contra:{},dur:0});
          e.side=s;e.dur+=st.dur||0;
          x.min+=st.dur||0;                                        // tempo de jogo (ms), pausas já descontadas
          if(ehG)e.gk=true;
          meuL.forEach(o=>{if(o!==pid)e.com[o]=1});
          delesL.forEach(o=>{e.contra[o]=1});
        });
      });
    });
    const totalDur=matchStints(liga,m).reduce((a,st)=>a+(st.counted?(st.dur||0):0),0);
    for(const pid in em){
      const e=em[pid];if(!contaPartida(liga,m,e.dur,totalDur))continue;
      const x=j(pid),res=m.result==='draw'?'e':(m.result===e.side?'v':'d');
      x.jogos++;x[res]++;x.ultimo=Math.max(x.ultimo,m.ts);
      if(res==='v'){x.seq++;x.best=Math.max(x.best,x.seq)}else if(res==='d')x.seq=0;
      x.ultimos.unshift(res.toUpperCase());if(x.ultimos.length>5)x.ultimos.pop();
      if(e.gk)x.gk++;
      if(!x.rachas[sid]){x.rachas[sid]=1;x.nR++}
      for(const o in e.com){const y=par(PA,pid,o);y.n++;y[res]++}
      for(const o in e.contra){const y=par(DU,pid,o);y.n++;y[res]++}
    }
    plusMinus(liga,m,(pid,d,role)=>{if(semGk&&role==='G')return;j(pid).pm+=d});
    (m.goals||[]).forEach(g=>{if(g.pid&&!g.own)j(g.pid).gols++});
  });
  return{J,DU,PA};
}
/* ---------- duplas inseparáveis ----------
   Elo por time não separa quem joga sempre junto: os dois ganham e perdem os
   mesmos pontos, então convergem para o mesmo nível — não importa quão bom
   cada um é. Quando uma dupla tem quase todo o histórico em comum, o app
   avisa: o remédio é separá-los na montagem por algumas noites.           */
/* 20 partidas ≈ 3 rachas sempre juntos (com as ~7 partidas por pessoa por
   noite do racha real) — proporcional à calibração de 15 (D-53/D-56).      */
const JUNTOS_MIN=20, JUNTOS_PCT=.8;
function inseparaveis(liga,st){
  const {J,PA}=st||statsLiga(liga,'sempre'),out=[],vistos={};
  Object.keys(PA).forEach(a=>Object.keys(PA[a]).forEach(b=>{
    const k=pairKey(a,b);if(vistos[k])return;vistos[k]=1;
    const n=PA[a][b].n,ja=J[a]?J[a].jogos:0,jb=J[b]?J[b].jogos:0;
    if(n<JUNTOS_MIN||!ja||!jb)return;
    const pct=n/Math.min(ja,jb);
    if(pct>=JUNTOS_PCT)out.push({a,b,n,pct,de:Math.min(ja,jb)});
  }));
  return out.sort((x,y)=>y.pct-x.pct||y.n-x.n);
}

/* ---------- destaques de um periodo (o "melhores do mes") ----------
   Ranking de racha nao pode ser aproveitamento puro: com times equilibrados
   todo mundo tende a 50%, e quem pegou time fraco fica pra tras sem culpa.
   O criterio e o SALDO ACIMA DO ESPERADO: soma de (resultado - chance) de cada
   trecho, ja com o nivel dos dois lados na conta. Vale 1 = uma vitoria inteira
   alem do que o confronto indicava. Artilharia e gols sofridos entram como
   destaques proprios, porque contam outra historia.                         */
function destaques(liga,dias){
  const desde=Date.now()-(dias||30)*86400000;
  const G={},add=pid=>G[pid]||(G[pid]={pid,over:0,jogos:0,v:0,e:0,d:0,gols:0,
    jogosG:0,sofridos:0,rachas:{},nR:0});
  let partidas=0,gols=0,comDono=0,nR=0;const rachas={};
  (liga.matches||[]).forEach(m=>{
    if(m.voided||m.ts<desde)return;
    partidas++;
    const sid=m.sessionId||m.id;
    if(!rachas[sid]){rachas[sid]=1;nR++}
    const em={};
    matchStints(liga,m).forEach(st=>{
      if(!st.counted)return;
      const part=stintPart(st);
      for(const pid in part){
        const x=add(pid),lado=part[pid].side,e=em[pid]||(em[pid]={side:lado,gk:false,dur:0});
        e.side=lado;e.dur+=st.dur||0;
        if(part[pid].role==='G'){e.gk=true;x.minGk=(x.minGk||0)+(st.dur||0);x.sofridos+=((st.score||[0,0])[lado===0?1:0])||0}
      }
    });
    const totalDur=matchStints(liga,m).reduce((a,st)=>a+(st.counted?(st.dur||0):0),0);
    for(const pid in em){
      const e=em[pid];if(!contaPartida(liga,m,e.dur,totalDur))continue;
      const x=add(pid);
      x.jogos++;x[m.result==='draw'?'e':(m.result===e.side?'v':'d')]++;
      if(e.gk)x.jogosG++;
      if(!x.rachas[sid]){x.rachas[sid]=1;x.nR++}
    }
    for(const pid in (m.over||{}))add(pid).over+=m.over[pid];
    (m.goals||[]).forEach(g=>{gols++;if(g.pid){comDono++;if(!g.own)add(g.pid).gols++}});
  });
  const gente=Object.keys(G).map(k=>G[k]);
  /* A valência que a pessoa mais jogou no período é a que representa ela aqui:
     quem passou a métade do mês no gol aparece pelo nível de goleiro.       */
  gente.forEach(x=>{x.val=x.jogosG>x.jogos/2?'G':'L'});
  /* Piso: 2 rachas OU 15 partidas no periodo (D-69). Quem veio duas noites
     ja mostrou constancia; quem jogou uma noite inteira (15 partidas ~ a
     calibracao) ja mostrou volume. O OU tambem resolve a partida unica sem
     caso especial: la 2 rachas bastam.                                      */
  const piso={rachas:2,jogos:15};
  const elegiveis=gente.filter(x=>x.nR>=piso.rachas||x.jogos>=piso.jogos);
  const top=elegiveis.slice().sort((a,b)=>b.over-a.over||b.v-a.v||b.jogos-a.jogos).slice(0,3);
  const artilheiro=gols&&comDono/gols>=.5
    ? gente.slice().sort((a,b)=>b.gols-a.gols)[0] : null;
  /* menos vazado: sofridos por tempo no gol, e só com pelo menos 1 h — menos que isso é sorte */
  const goleiro=gente.filter(x=>(x.minGk||0)>=60*60000)
    .sort((a,b)=>a.sofridos/a.minGk-b.sofridos/b.minGk||b.minGk-a.minGk)[0]||null;
  const presenca=gente.slice().sort((a,b)=>b.nR-a.nR||b.jogos-a.jogos)[0];
  /* Os melhores da escada, só entre quem apareceu no período. A ordem é a mesma
     do ranking — degrau, depois aproveitamento, depois nome — para a posição
     não denunciar o rating de ninguém dentro da mesma divisão.                */
  const melhores=gente.filter(x=>{const p=P(liga,x.pid);return p&&temPatente(liga,p,x.val)})
    .sort((a,b)=>{const pa=P(liga,a.pid),pb=P(liga,b.pid);
      return rt(pb,b.val).rank-rt(pa,a.val).rank
        ||aprDe(b.v,b.e,b.jogos)-aprDe(a.v,a.e,a.jogos)
        ||nameOf(liga,a.pid).localeCompare(nameOf(liga,b.pid))}).slice(0,3);
  return{gente,melhores,top,artilheiro:artilheiro&&artilheiro.gols?artilheiro:null,goleiro,presenca,
    partidas,gols,comDono,nR,piso,desde};
}
/* Todos os encontros entre duas pessoas: lado a lado ou uma contra a outra. */
function encontros(liga,a,b,periodo,mesmoLado){
  const out=[];
  (liga.matches||[]).forEach(m=>{
    if(m.voided||!noPeriodo(m,periodo))return;
    matchStints(liga,m).forEach((st,i)=>{
      if(!st.counted)return;
      const part=stintPart(st),x=part[a],y=part[b];
      if(!x||!y)return;
      if(mesmoLado?x.side!==y.side:x.side===y.side)return;
      const tam=[(st.lineups&&st.lineups[0]||[]).length,(st.lineups&&st.lineups[1]||[]).length];
      out.push({ts:m.ts,m,st,i,side:x.side,
        res:st.result==='draw'?'E':(st.result===x.side?'V':'D'),
        fmt:(x.side===0?tam[0]:tam[1])+'v'+(x.side===0?tam[1]:tam[0]),
        placar:x.side===0?[st.score[0],st.score[1]]:[st.score[1],st.score[0]],
        trechos:matchStints(liga,m).filter(z=>z.counted).length});
    });
  });
  return out.sort((p,q)=>q.ts-p.ts);
}
/* Ano a ano, só para uma pessoa — é o "na vida" quebrado por temporada. */
function statsAnos(liga,pid){
  const porAno={};
  (liga.matches||[]).forEach(m=>{
    if(m.voided)return;
    const y=ANO(m.ts),sid=m.sessionId||m.id;
    let side=null,min=0,tot=0;
    matchStints(liga,m).forEach(st=>{
      if(!st.counted)return;tot+=st.dur||0;
      const me=stintPart(st)[pid];if(!me)return;
      side=me.side;min+=st.dur||0;
    });
    if(side!==null&&contaPartida(liga,m,min,tot)){
      const a=porAno[y]||(porAno[y]={ano:y,rachas:{},nR:0,jogos:0,v:0,e:0,d:0,gols:0,min:0,pm:0});
      a.jogos++;a.min+=min;a[m.result==='draw'?'e':(m.result===side?'v':'d')]++;
      if(!a.rachas[sid]){a.rachas[sid]=1;a.nR++}
    }
    plusMinus(liga,m,(q,d)=>{if(q===pid&&porAno[y])porAno[y].pm+=d});
    (m.goals||[]).forEach(g=>{if(g.pid===pid&&!g.own&&porAno[ANO(m.ts)])porAno[ANO(m.ts)].gols++});
  });
  return Object.keys(porAno).map(k=>porAno[k]).sort((x,y)=>y.ano-x.ano);
}
/* Quem é "eu" nesta liga: o perfil que a conta deste aparelho assumiu. */
function euId(liga){
  const p=(liga.players||[]).find(x=>x.owner&&x.owner===S.me.name);
  return p?p.id:null;
}
/* Em que lado o jogador estava na partida (e se jogou). */
function ladoNaPartida(liga,m,pid){
  if(!pid)return null;
  let lado=null;
  matchStints(liga,m).forEach(st=>{
    if(lado!==null)return;
    const x=stintPart(st)[pid];
    if(x)lado=x.side;
  });
  return lado;
}

/* ---------- quem enxerga nível ----------
   O admin da liga pode deixar os níveis visíveis para todo mundo (padrão)
   ou só para ele. A checagem aqui decide o que a tela mostra; nas ações de
   conta o servidor faz a checagem dele (is_league_admin, D-62).             */
function meuPapel(liga){
  const meu=liga.players.find(p=>p.owner&&p.owner===S.me.name);
  if(meu)return meu.role||'jogador';
  /* conta sem perfil vinculado só olha; o admin vincula e dá o papel. Enquanto
     ninguém vinculou nada (liga recém-criada), todo mundo é admin. */
  return liga.players.some(p=>p.owner)?'jogador':'admin';
}
const souAdmin=liga=>meuPapel(liga)==='admin';
/* Registro de correções: fato sobre quem mexeu no quê. Nunca é apagado, não
   entra em cálculo nenhum — serve para auditar e para reaplicar ajustes se o
   sistema de nivelamento mudar (o `base` do jogador absorve o ajuste; o log
   guarda o que o admin quis dizer com ele).                                  */
function logAdd(liga,a,extra){
  if(!Array.isArray(liga.log))liga.log=[];
  liga.log.push(Object.assign({ts:Date.now(),by:S.me.name||null,a},extra||{}));
  /* sem corte de tamanho: o diffParts usa o comprimento como cursor (cortar
     congelava o sync do log), e a carga inicial já traz o log inteiro */
}

const ACOES_ADMIN=new Set(['toggleCfg','setVis','saveLiga']);
const vePat=liga=>liga.cfg.rankVisibility!=='admin'||souAdmin(liga);
const patDot=(liga,step)=>vePat(liga)?`<span class="pdot ${divCls(step)}" style="--pc:${patColor(step)}"></span>`:'';

/* ---------- de quem é a vitória do time ----------
   Time da noite é a composição original, não o nome no placar. Um lado da
   partida só conta como aquele time se MAIS DA METADE dos jogadores originais
   dele esteve em quadra em algum trecho — time inteiro trocado não leva
   vitória. Se duas composições passam da metade (o time trocou no meio e a
   formação nova é a maioria de outro time), leva quem ficou mais tempo em
   quadra; empatado nisso, quem cobriu maior parte do próprio time; e por
   último o time do nome.                                                    */
function emQuadraNo(liga,m,side){
  const s=new Set();
  matchStints(liga,m).forEach(st=>(((st.lineups||[])[side])||[]).forEach(id=>s.add(id)));
  return s;
}
function timeDoLado(liga,m,side,times){
  if(!times||!times.length)return null;
  const sts=matchStints(liga,m),em=emQuadraNo(liga,m,side),nome=(m.names||[])[side];
  /* melhor: mais tempo de quadra dos originais; depois maior parte do time; depois o nome */
  const melhorQue=(a,b)=>!b||a.peso>b.peso+1
    ||(Math.abs(a.peso-b.peso)<=1&&(a.parte>b.parte+1e-9
      ||(Math.abs(a.parte-b.parte)<1e-9&&a.nome&&!b.nome)));
  let melhor=null;
  times.forEach(t=>{
    const ids=(t.ids||[]).filter((id,i,a)=>a.indexOf(id)===i);
    if(!ids.length)return;
    const n=ids.filter(id=>em.has(id)).length;
    if(n*2<=ids.length)return;                   // metade não basta: tem que ser maioria
    let peso=0;                                  // minutos-jogador dos originais deste time neste lado
    sts.forEach(st=>{const lin=((st.lineups||[])[side])||[];
      peso+=(st.dur||0)*lin.filter(id=>ids.indexOf(id)>=0).length});
    const cand={t,peso,parte:n/ids.length,nome:t.name===nome};
    if(melhorQue(cand,melhor))melhor=cand;
  });
  return melhor?melhor.t:null;
}
/* Os times como foram montados no racha. Sessão antiga (que não guardou os
   times): a escalação de largada da primeira partida em que o nome aparece
   serve de composição original.                                             */
/* Quem estava no rodízio de goleiro naquele racha. A lista gravada manda; sem
   ela (racha antigo), vale a evidência: quem pegou no gol por mais de um time
   na mesma noite estava rodando.                                            */
function rodizioDoRacha(liga,ms,sess){
  const pool=new Set(sess&&Array.isArray(sess.gkPool)?sess.gkPool:[]);
  const times={};
  (ms||[]).forEach(m=>matchStints(liga,m).forEach(st=>[0,1].forEach(sd=>{
    const g=(st.gks||[])[sd];if(!g)return;
    (times[g]=times[g]||new Set()).add((m.names||[])[sd]);
  })));
  Object.keys(times).forEach(id=>{if(times[id].size>1)pool.add(id)});
  return pool;
}
function timesDoRacha(liga,ms,sess){
  /* Goleiro de rodízio não é de time nenhum: ele roda entre os times, então
     fica fora da composição — nem no rótulo, nem na conta da maioria.       */
  const pool=rodizioDoRacha(liga,ms,sess);
  const semGk=ids=>(ids||[]).filter(id=>!pool.has(id));
  if(sess&&Array.isArray(sess.teams)&&sess.teams.length)
    return sess.teams.map(t=>({name:t.name,ids:semGk(t.ids)}));
  const T={},ordem=[];
  [...ms].sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(m=>[0,1].forEach(s=>{
    const n=(m.names||[])[s];if(!n||T[n])return;
    T[n]={name:n,ids:semGk((((m.startLineups||m.lineups))||[])[s])};ordem.push(T[n]);
  }));
  return ordem;
}
/* Primeiro nome de cada um, com a inicial do sobrenome só quando dois se
   chamam igual dentro do mesmo time.                                        */
function nomesCurtos(liga,ids){
  const partes=ids.map(id=>String(nameOf(liga,id)).trim().split(/\s+/));
  return partes.map((w,i)=>{
    const igual=partes.some((v,j)=>j!==i&&v[0].toLowerCase()===w[0].toLowerCase());
    return w[0]+(igual&&w[1]?' '+w[1][0].toUpperCase()+'.':'');
  });
}
/* Aproveitamento do time no racha de hoje — sem destaque, só para dar contexto.
   Conta pela composição (`timeDoLado`), não pelo nome: time desfigurado por
   substituição não leva a vitória, e quem virou maioria de outro time leva a
   dele.                                                                     */
function teamRecord(liga,lv,ti){
  /* goleiro de rodízio não é de time nenhum */
  const ms=(lv.matchIds||[]).map(id=>liga.matches.find(x=>x.id===id)).filter(Boolean);
  const pool=rodizioDoRacha(liga,ms,{gkPool:lv.gkPool||[]});
  const orig=(lv.teams||[]).map((t,i)=>({name:t.name,i,
    ids:(t.orig&&t.orig.length?t.orig:t.ids||[]).filter(id=>!pool.has(id))}));
  let w=0,d=0,l=0;
  (lv.matchIds||[]).forEach(id=>{
    const m=liga.matches.find(x=>x.id===id);
    if(!m||m.voided)return;
    [0,1].forEach(s=>{
      const dono=timeDoLado(liga,m,s,orig);
      if(!dono||dono.i!==ti)return;
      if(m.result==='draw')d++;else if(m.result===s)w++;else l++;
    });
  });
  const n=w+d+l;
  return{w,d,l,n,pct:n?Math.round(w/n*100):null};
}

function selBar(liga,lv){
  if(!lv.sel)return '';

    <button class="btn sm ghost sp" data-a="clearSel">Cancelar</button></div>`;
}
/* ---------- completar o time menor ----------
   Os dois lados entram sempre com o mesmo número. Quando o time da vez tem
   menos gente, ele não joga em inferioridade nem o outro senta ninguém: o app
   completa com quem está de fora (normalmente o time que acabou de sair) e
   QUEM ESCOLHE É O USUÁRIO — a sugestão é só para não travar a fila.        */
function resetFill(lv){lv.fill=[[],[]];lv.fillMan=false;lv.fillOff=false}
/* ---------- a fila: o "de próximo" ----------
   Racha curto é sempre o mesmo desenho: o time que ganhou fica, o que perdeu
   sai, e quem está esperando entra no lugar dele. Quando a fila não dá para
   trocar o time inteiro, alguns do time que perdeu ficam para completar — o
   famoso "fica o goleiro e mais um". A fila é de PESSOAS, não de times: quem
   sai vai para o fim dela, quem está há mais tempo fora entra primeiro.      */
function filaDe(lv){
  const pool=lv.gkPool||[];
  const dentro=id=>lv.teams.some(t=>t.ids.indexOf(id)>=0)||pool.indexOf(id)>=0;
  const ordem=(lv.fila||[]).filter(id=>lv.presentIds.indexOf(id)>=0&&!dentro(id));
  const novos=lv.presentIds.filter(id=>!dentro(id)&&ordem.indexOf(id)<0);
  return ordem.concat(novos);                 // quem chegou agora entra no fim
}
function rodaFila(liga,lv,saiu){
  const fila=filaDe(lv),t=lv.teams[saiu];
  if(!fila.length||!t)return null;
  /* goleiro fixo não roda: ele é do time. No rodízio, os goleiros já giram sozinhos. */
  const fixos=(lv.gkPool||[]).length?[]:t.ids.filter(id=>ehGkHoje(lv,id));
  const rodam=t.ids.filter(id=>fixos.indexOf(id)<0);
  const cnt=jogosHoje(liga,lv);
  const k=Math.min(fila.length,rodam.length);
  if(!k)return null;
  const saem=rodam.slice().sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)).slice(0,k);  // sai quem mais jogou hoje
  const entram=fila.slice(0,k);
  const ficam=rodam.filter(id=>saem.indexOf(id)<0);
  t.ids=fixos.concat(ficam,entram);
  lv.fila=fila.slice(k).concat(saem);
  return {entram,saem,ficam:fixos.concat(ficam)};
}
function jogosHoje(liga,lv){
  const c={};
  (lv.matchIds||[]).forEach(id=>{
    const m=(liga.matches||[]).find(x=>x.id===id);if(!m)return;
    const l=m.lineups||[[],[]];
    [...(l[0]||[]),...(l[1]||[])].forEach(p=>c[p]=(c[p]||0)+1);
  });
  return c;
}
function fillInfo(liga,lv,pair){
  const per=lv.per||perTeamSize(liga,(lv.gkPool||[]).length>0);
  const tam=[0,1].map(sd=>Math.min(per,(lv.teams[pair[sd]]||{ids:[]}).ids.length));
  const alvo=Math.min(per,Math.max(tam[0],tam[1]));
  const fill=(Array.isArray(lv.fill)&&lv.fill.length===2)?lv.fill.map(x=>(x||[]).slice()):[[],[]];
  return {per,alvo,tam,fill,falta:[0,1].map(sd=>Math.max(0,alvo-tam[sd]-fill[sd].length))};
}
function candidatosFill(liga,lv,pair,usados){
  const pool=lv.gkPool||[];
  const dentro=[...(lv.teams[pair[0]]||{ids:[]}).ids,...(lv.teams[pair[1]]||{ids:[]}).ids];
  const cnt=jogosHoje(liga,lv);
  return lv.presentIds.filter(id=>dentro.indexOf(id)<0&&pool.indexOf(id)<0&&usados.indexOf(id)<0)
    .sort((a,b)=>(cnt[a]||0)-(cnt[b]||0)||nameOf(liga,a).localeCompare(nameOf(liga,b)));
}
function fillDe(liga,lv,pair){
  const info=fillInfo(liga,lv,pair);
  if(lv.fillOff)return [[],[]];
  if(lv.fillMan)return info.fill;              // o usuário assumiu a escolha
  const out=info.fill.map(x=>x.slice()),usados=[...out[0],...out[1]];
  [0,1].forEach(sd=>{
    const cands=candidatosFill(liga,lv,pair,usados);
    for(let f=info.falta[sd];f>0&&cands.length;f--){const id=cands.shift();out[sd].push(id);usados.push(id)}
  });
  return out;
}
function benchList(liga,lv){
  const c=lv.cur,emCampo=c?[...c.lineups[0],...c.lineups[1]]:[];
  const jogando=c?[c.a,c.b]:[];
  return lv.presentIds.filter(id=>emCampo.indexOf(id)<0&&(lv.gkPool||[]).indexOf(id)<0)
    .map(id=>{const i=lv.teams.findIndex(t=>t.ids.indexOf(id)>=0);
      return{id,ti:i,from:i>=0?lv.teams[i].name:null};});
}
/* Chance esperada do confronto, pelo Elo dos que vão entrar. É a única % de
   nível que o app mostra: fala do CONFRONTO (o quanto os dois times estão
   parelhos), nunca do rating de uma pessoa. Some junto com os níveis quando
   a liga escolhe deixá-las só para o admin.                                  */
function chanceDe(liga,lv,ia,ib){
  if(!vePat(liga)||!lv.teams[ia]||!lv.teams[ib])return null;
  const per=lv.per||perTeamSize(liga,(lv.gkPool||[]).length>0);
  const lineups=[ia,ib].map(i=>lv.teams[i].ids.slice(0,per));
  const gks=[0,1].map(s=>lineups[s].find(id=>ehGkHoje(lv,id))||null);
  return chanceDeLineups(liga,lv,lineups,gks);
}
function chanceDeLineups(liga,lv,lineups,gks){
  if(!vePat(liga))return null;
  if(!lineups[0].length||!lineups[1].length)return null;
  return computeElo(liga,stintPart({lineups,gks:gks||[null,null]}),'draw',lv.mode).exp;
}
const pct=x=>Math.round(x*100)+'%';

/* Escalação de um lado: slot do goleiro em cima, um slot por vaga de linha.
   `orig` = ids do time de origem (quem não está nele leva o ícone de
   substituto ⇄); goleiro do rodízio leva ↻. `act` monta os data-a de cada
   slot; sem `act` os slots são só leitura.                                  */
function escCol(liga,lv,ids,gk,per,orig,act,extra){
  const pool=lv.gkPool||[];extra=extra||{};
  const linha=ids.filter(id=>id!==gk);
  const dot=id=>{const p=P(liga,id);if(!p)return '';const r=id===gk?'G':'L';return temPatente(liga,p,r)&&vePat(liga)?patDot(liga,rt(p,r).rank):''};
  const subIc=id=>orig&&!orig.includes(id)?'<span class="ic sub" title="entrou depois: substituto / completando">⇄</span>':'';
  const slot=(id,cls,attrs)=>id?`<button class="pl ${cls} ${lv.sel===id?'sel':''}" ${attrs||''}>${dot(id)}<span class="nm">${esc(nameOf(liga,id))}</span>${subIc(id)}</button>`
    :`<button class="pl ${cls} empty" ${attrs||(act&&act.empty?act.empty:'')}><span class="nm">${cls==='gk'?'🧤 sem goleiro':(act&&act.empty?'＋ completar':'vaga')}</span></button>`;
  let h=gk?`<button class="pl gk" ${act?act.gk:''}>🧤<span class="nm">${esc(nameOf(liga,gk))}</span>${pool.includes(gk)?'<span class="ic" title="rodízio">↻</span>':''}${subIc(gk)}</button>`
    :`<button class="pl gk empty" ${act?act.gk:''}><span class="nm">🧤 ${act?'definir goleiro':'sem goleiro'}</span></button>`;
  /* `per` é o tamanho do time. Goleiro do rodízio entra ALÉM dele; goleiro
     fixo (partida única, ou um por time) é um dos `per` — senão sobra uma
     vaga fantasma na escalação.                                             */
  const n=Math.max(per-(gk&&!pool.includes(gk)?1:0),linha.length);
  for(let i=0;i<n;i++){const id=linha[i];h+=slot(id,'',id&&act?act.pl(id):'')}
  return `<div class="col" ${extra.attrs||''}>${extra.head||''}${h}${extra.foot||''}</div>`;
}

/* Um nome dentro de um time, com o ponto do nível e o arraste ligado. */
function tpChip(liga,lv,id,big){
  const p=P(liga,id);if(!p)return '';
  const gk=ehGkHoje(lv,id),role=gk?'G':'L',tem=temPatente(liga,p,role)&&vePat(liga);
  return `<button class="tp ${big?'big':''} ${lv.sel===id?'sel':''} ${tem?'lv '+divCls(rt(p,role).rank):''}" ${tem?`style="--pc:${patColor(rt(p,role).rank)}"`:''} data-a="sel" data-id="${id}" data-drag="1" data-drop-player="${id}">
    ${tem?patDot(liga,rt(p,role).rank):''}${esc(p.name)}${gk?' 🧤':''}</button>`;
}
/* Card de um time: titulares, reservas e as duas formas de mexer (toque e arraste). */
/* Time com gente a menos mostra uma VAGA por lugar vazio, dentro do próprio
   cartão. Na montagem a vaga puxa alguém da fila/reserva para o time; na
   pré-partida ela escolhe quem completa só aquela partida (fillPick).      */
function timeCard(liga,lv,i,per,completando,sd){
  const t=lv.teams[i];if(!t)return '';
  const cIds=Array.isArray(completando)?completando:[],cN=Array.isArray(completando)?completando.length:(completando||0);
  const tit=t.ids.slice(0,per),res=t.ids.slice(per),falta=per-t.ids.length-cN;
  const emprestados=cIds.map(id=>`<button class="tp big emp" data-a="fillDel" data-sd="${sd}" data-id="${id}" title="joga esta partida emprestado">${esc(nameOf(liga,id))} <small>✕</small></button>`).join('');
  const vagas=falta>0&&!lv.fillOff?Array.from({length:falta},()=>sd===undefined
      ?`<button class="tp big vaga" data-a="slotPick" data-i="${i}">＋ vaga</button>`
      :`<button class="tp big vaga" data-a="fillPick" data-sd="${sd}">＋ completar</button>`).join(''):'';
  return `<div class="team">
    <div class="hd ${TEAMBG[i]}">${esc(t.name)}
      <span class="sp" style="font-size:12px;opacity:.8">${cN?`${t.ids.length}+${cN} completando`
        :falta>0?`${t.ids.length}/${per} · falta ${falta}`
        :res.length?`${per} + ${res.length} reserva${res.length>1?'s':''}`:`${per}/${per}`}</span></div>
    <div class="bd" data-a="toTeam" data-i="${i}" data-drop-zone="team:${i}">
      ${tit.map(id=>tpChip(liga,lv,id,true)).join('')+emprestados+vagas
        ||'<span class="tiny muted" style="padding:6px">toque num jogador e depois aqui</span>'}
    </div>
    ${res.length?`<div style="padding:0 9px 9px">
      <div class="k" style="margin-bottom:6px">Reservas</div>
      <div class="chips">${res.map(id=>tpChip(liga,lv,id,false)).join('')}</div>
    </div>`:''}
  </div>`;
}
/* Tela de pré-partida: qual é o próximo jogo, com quem, e a chance de cada lado.
   Trocar o time que entra e mexer na escalação acontece aqui, antes do apito —
   é a última parada antes de "Começar partida".                              */
function viewProxima(liga,lv){
  const pair=(lv.nextPair||suggestPair(liga,lv)).slice();
  const per=lv.per||perTeamSize(liga,(lv.gkPool||[]).length>0);
  const compl=fillDe(liga,lv,pair);            // quem entra emprestado para fechar os dois lados
  const escal=[0,1].map(sd=>lv.teams[pair[sd]].ids.slice(0,per).concat(compl[sd]));
  const gp=planGks(liga,lv,pair);
  const gkDe=sd=>gp.gks[sd]||escal[sd].find(id=>ehGkHoje(lv,id))||null;
  /* o goleiro do rodízio entra em quadra além dos de linha (é assim que startMatch monta):
     a chance aqui tem que ser a mesma que a partida ao vivo vai mostrar */
  const escalCom=[0,1].map(sd=>{const g=gkDe(sd);return g&&!escal[sd].includes(g)?escal[sd].concat([g]):escal[sd]});
  const ex=chanceDeLineups(liga,lv,escalCom,[0,1].map(gkDe));
  const outros=lv.teams.map((_,i)=>i).filter(i=>i!==pair[0]&&i!==pair[1]);
  const pool=lv.gkPool||[];
  const soltos=filaDe(lv);
  const equilibrio=ex?(Math.abs(ex[0]-.5)<.06?'Confronto parelho':'Favorito: '+lv.teams[pair[ex[0]>ex[1]?0:1]].name):'';
  return `
  <div class="card">
    <div class="row"><div class="k">Próxima partida</div>
      <div class="sp tiny muted">${outros.length?'toque no time para trocar':'só dois times'}</div></div>
    <div class="esc2 vs3">
      ${[0,1].map(sd=>{const ti=pair[sd],t=lv.teams[ti],res=t.ids.slice(per);
        const cab=`<button class="slot ${TEAMCLASS[ti]}" data-a="pickSide" data-s="${sd}">
          <div class="nm">${esc(t.name)}</div>
          <div class="sub">${ex?'<b>'+pct(ex[sd])+'</b> de chance':escal[sd].length+' em quadra'}${gp.fica[sd]?' · 🧤 fica':''}</div></button>`;
        return escCol(liga,lv,escalCom[sd],gkDe(sd),per,(t.orig||t.ids).concat(gkDe(sd)?[gkDe(sd)]:[]),
          {gk:`data-a="preGk" data-sd="${sd}"`,
           pl:id=>compl[sd].includes(id)?`data-a="fillDel" data-sd="${sd}" data-id="${id}" title="tirar quem completa"`
                 :`data-a="sel" data-id="${id}" data-drag="1" data-drop-player="${id}"`,
           empty:lv.fillOff?'':`data-a="fillPick" data-sd="${sd}"`},
          {attrs:`data-a="toTeam" data-i="${ti}" data-drop-zone="team:${ti}"`,head:cab,
           foot:res.length?`<div class="res"><div class="k">Reservas</div><div class="chips">${res.map(id=>tpChip(liga,lv,id,false)).join('')}</div></div>`:''})}).join('<div class="vs">VS</div>')}
    </div>
    ${selBar(liga,lv)}
    ${(()=>{const rs=[0,1].map(sd=>({n:lv.teams[pair[sd]].name,r:teamRecord(liga,lv,pair[sd])})).filter(x=>x.r.n);
      const partes=[];

function cardCompletar(liga,lv,pair){
  const info=fillInfo(liga,lv,pair),f=fillDe(liga,lv,pair);
  const falta=[0,1].map(sd=>Math.max(0,info.alvo-info.tam[sd]-f[sd].length));
  if(!f[0].length&&!f[1].length&&!falta[0]&&!falta[1])return '';
  const menor=Math.min(info.tam[0],info.tam[1]);
  return `<div class="card gkcard" style="margin-top:10px">
    <div class="row"><div class="k">Completar para fechar ${info.alvo}v${info.alvo}</div>
      <button class="btn sm ghost sp" data-a="fillOff">${lv.fillOff?'Completar de novo':`Jogar ${menor}v${menor} assim`}</button></div>
    <div class="tiny muted" style="margin-top:8px">${lv.fillOff?`Os dois lados entram com ${menor} — ninguém completa.`

  </div>`;
}

/* a escada de níveis: linha ou goleiro */
function viewEscada(liga){
  if(!vePat(liga)){
    const ps=[...liga.players].sort((a,b)=>(b.sessions||0)-(a.sessions||0)||a.name.localeCompare(b.name));
    return `<div class="card" style="margin-bottom:10px">
      <div class="k" style="margin-bottom:6px">Níveis fechados</div>
      <div class="tiny muted" style="line-height:1.5">O admin desta liga escolheu manter os níveis só para ele. As estatísticas continuam abertas.</div></div>
      <div class="card" style="padding:0">${ps.map(p=>`<div class="rank">
        <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}</div>
        <div class="meta"><span class="num">${p.sessions||0} racha(s)</span>
          <span class="num">${p.L.games+p.G.games} partida(s)</span>
          ${p.goals?`<span class="num">⚽ ${p.goals}</span>`:''}</div></div></div>`).join('')}</div>`;
  }
  const role=S.ui.rankRole==='G'?'G':'L';
  const lista=liga.players.filter(p=>temPatente(liga,p,role));   // sem nível na valência, fora da escada
  /* Ordem dentro do degrau: para o admin — que já vê o Elo cru na linha — manda
     o Elo, que é o desempate honesto (a divisão só muda com histerese, então dois
     do mesmo degrau podem estar longe um do outro). Para os outros continua
     aproveitamento, para a posição não denunciar o rating de ninguém (D-57).
     O degrau é sempre o critério de cima, senão as seções se repetiriam.       */
  const porElo=souAdmin(liga);
  const ps=[...lista].sort((a,b)=>{const x=rt(a,role),y=rt(b,role);
    return y.rank-x.rank
      ||(porElo?y.elo-x.elo:(y.games?(3*y.w+y.d)/y.games:0)-(x.games?(3*x.w+x.d)/x.games:0))
      ||a.name.localeCompare(b.name)});
  let html=`<div class="row" style="gap:6px;margin:12px 0 10px">
    <button class="btn sm ${role==='L'?'pri':'ghost'}" data-a="rankRole" data-v="L" style="flex:1">Linha</button>
    <button class="btn sm ${role==='G'?'pri':'ghost'}" data-a="rankRole" data-v="G" style="flex:1">Goleiro</button>
  </div>`;
  /* Quem calibra segue a mesma regra: Elo para o admin (quem monta os times
     precisa da ordem verdadeira antes de o rótulo existir), quantidade de
     partidas para os outros — que é o que a linha mostra ali. Quem ainda não
     jogou está todo no Elo de entrada, e aí o desempate é o nome.            */
  const semNivel=liga.players.filter(p=>!temPatente(liga,p,role)&&(rt(p,role).games>0||role==='L'))
    .sort((a,b)=>(porElo?rt(b,role).elo-rt(a,role).elo:rt(b,role).games-rt(a,role).games)||a.name.localeCompare(b.name));
  const blocoSem=semNivel.length?`<div class="secthd" style="--pc:var(--mute)"><div class="nm">Sem nível ainda</div><div class="ln"></div><div class="ct">${semNivel.length}</div></div>
    <div class="card" style="padding:0">${semNivel.map(p=>{const tr=rt(p,role);return `<div class="rank" data-a="pSheet" data-id="${p.id}">
      <span class="pat" style="--pc:var(--mute);min-width:34px;justify-content:center"><b>⏳</b></span>
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}${role==='G'?' 🧤':''}${p.owner?' <span style="color:var(--cyan)">•</span>':''}</div>
        <div class="meta"><span class="num">${tr.w}V ${tr.d}E ${tr.l}D</span><span class="prov">calibrando · ${calTxt(liga,tr)}</span>${souAdmin(liga)?`<span class="num" style="opacity:.4;font-size:10px" title="Elo — só o admin vê">${Math.round(tr.elo)}</span>`:''}</div></div>
      </div>`}).join('')}</div>
    <div class="tiny muted" style="margin:6px 2px 10px">Nível aparece depois de ${calMeta(liga).n} ${calMeta(liga).u} — ou se o admin definir um na ficha.</div>`:'';
  if(!ps.length)return html+(semNivel.length?blocoSem:`<div class="empty"><div class="big">Ninguém no gol ainda</div>Quem pegar no gol ganha um nível de goleiro próprio.</div>`);
  let lastPat=-1;
  for(const p of ps){
    const tr=rt(p,role),pt=patOf(tr.rank);
    if(pt!==lastPat){
      if(lastPat>=0)html+='</div>';
      html+=`<div class="secthd" style="--pc:${PATC[pt]}"><div class="nm">${esc(liga.cfg.patNames[pt])}</div>
        <div class="ln"></div><div class="ct">${ps.filter(x=>patOf(rt(x,role).rank)===pt).length}</div></div><div class="card" style="padding:0">`;
      lastPat=pt;
    }
    html+=`<div class="rank" data-a="pSheet" data-id="${p.id}">
      <span class="pat ${divCls(tr.rank)}" style="--pc:${patColor(tr.rank)};min-width:34px;justify-content:center"><b>${divOf(tr.rank)}</b></span>
      <div style="min-width:0;flex:1">
        <div class="nm">${esc(p.name)}${role==='G'?' 🧤':''}${p.owner?' <span style="color:var(--cyan)">•</span>':''}</div>
        <div class="meta">
          <span class="num">${tr.w}V ${tr.d}E ${tr.l}D</span>
          ${role==='L'&&p.goals?`<span class="num">⚽ ${p.goals}</span>`:''}
          ${calibrando(liga,p,tr)?`<span class="prov" title="ainda calibrando: ${calTxt(liga,tr)}">⏳ ${calTxt(liga,tr)}</span>`:''}
          ${souAdmin(liga)?`<span class="num" style="opacity:.4;font-size:10px" title="Elo — só o admin vê">${Math.round(tr.elo)}</span>`:''}
          <span class="form">${tr.form.slice(0,6).map(f=>`<i class="${f==='V'?'v':f==='D'?'d':'e'}"></i>`).join('')}</span>
        </div>
      </div>
      <div style="color:var(--mute);font-size:18px">›</div>
    </div>`;
  }
  return html+'</div>'+blocoSem+'<div style="height:12px"></div><button class="btn wide ghost" data-a="addPlayer">+ Novo jogador</button>';
}
