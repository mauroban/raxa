/* De quem são os números na tela: o perfil escolhido, o seu, ou quem mais
   apareceu — nessa ordem. Mesma resolução na tela e no histórico do duelo.  */
function statsWhoId(liga,J){
  if(S.ui.statsWho&&P(liga,S.ui.statsWho))return S.ui.statsWho;
  const eu=euId(liga);if(eu)return eu;
  const src=J||statsLiga(liga,S.ui.statsPer==='sempre'?'sempre':'ano').J;
  const top=Object.keys(src).sort((a,b)=>src[b].nR-src[a].nR)[0];
  return top||(liga.players[0]&&liga.players[0].id)||null;
}
function viewStats(liga){
  const eu=euId(liga);
  const per=S.ui.statsPer==='sempre'?'sempre':'ano';
  const {J,DU,PA}=statsLiga(liga,per);
  const who=statsWhoId(liga,J);
  const rot=per==='ano'?'em '+ANO_ATUAL():'desde sempre';
  const seg=`<div class="row" style="gap:6px">
      <button class="btn sm ${per==='ano'?'pri':'ghost'}" data-a="statsPer" data-v="ano" style="flex:1">${ANO_ATUAL()}</button>
      <button class="btn sm ${per==='sempre'?'pri':'ghost'}" data-a="statsPer" data-v="sempre" style="flex:1">Desde sempre</button>
    </div>`;
  if(!liga.matches.length)return `<div class="card">${seg}</div><div class="empty"><div class="big">Nada para contar ainda</div>
    Os números aparecem depois da primeira partida registrada.</div>`;
  const p=who?P(liga,who):null;
  const me=who&&J[who]?J[who]:{nR:0,jogos:0,v:0,e:0,d:0,gols:0,gk:0,seq:0,best:0,ultimos:[],sofridos:0};
  const iniciais=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const av=pid=>`<span class="av">${esc(iniciais(nameOf(liga,pid)))}</span>`;

  /* --- a liga no período --- */
  const ms=liga.matches.filter(m=>!m.voided&&noPeriodo(m,per));
  const rachas={};ms.forEach(m=>rachas[m.sessionId||m.id]=1);
  const nRachas=Object.keys(rachas).length;
  const golsTot=ms.reduce((a,m)=>a+(m.score||[0,0])[0]+(m.score||[0,0])[1],0);
  const empates=ms.filter(m=>m.result==='draw').length;
  const goleada=ms.reduce((g,m)=>{const d=Math.abs((m.score||[0,0])[0]-(m.score||[0,0])[1]);return d>g.d?{d,m}:g},{d:0,m:null});

  /* --- duelos e parcerias da pessoa --- */
  const duelos=Object.keys(DU[who]||{}).map(id=>Object.assign({pid:id},DU[who][id])).sort((a,b)=>b.n-a.n||b.d-a.d);
  const parcerias=Object.keys(PA[who]||{}).map(id=>Object.assign({pid:id},PA[who][id])).sort((a,b)=>b.n-a.n);
  const comMin=arr=>arr.filter(x=>x.n>=Math.min(MIN_JOGOS,Math.max(3,Math.round(me.jogos/10))));
  const carrasco=[...comMin(duelos)].sort((a,b)=>(b.d-b.v)-(a.d-a.v)||b.d-a.d)[0];
  const fregues=[...comMin(duelos)].sort((a,b)=>(b.v-b.d)-(a.v-a.d)||b.v-a.v)[0];
  const dupla=[...comMin(parcerias)].sort((a,b)=>pctDe(b.v,b.n)-pctDe(a.v,a.n)||b.n-a.n)[0];
  const parceiro=parcerias[0];

  /* --- top 5 --- */
  const todos=Object.keys(J).map(id=>J[id]);
  const rkRachas=[...todos].sort((a,b)=>b.nR-a.nR||b.jogos-a.jogos).slice(0,5);
  const rkVit=[...todos].sort((a,b)=>b.v-a.v||b.jogos-a.jogos).slice(0,5);
  const rkPct=todos.filter(x=>x.jogos>=MIN_JOGOS).sort((a,b)=>pctDe(b.v,b.jogos)-pctDe(a.v,a.jogos)||b.jogos-a.jogos).slice(0,5);
  const rkGols=[...todos].filter(x=>x.gols).sort((a,b)=>b.gols-a.gols).slice(0,5);
  const rkSeq=[...todos].filter(x=>x.best>=3).sort((a,b)=>b.best-a.best||b.v-a.v).slice(0,5);
  const rkGk=todos.filter(x=>x.gk>=5).sort((a,b)=>a.sofridos/a.gk-b.sofridos/b.gk||b.gk-a.gk).slice(0,5);
  const duplas=[];const vistos={};
  Object.keys(PA).forEach(a=>Object.keys(PA[a]).forEach(b=>{const k=pairKey(a,b);if(vistos[k])return;vistos[k]=1;
    const y=PA[a][b];if(y.n>=MIN_JOGOS)duplas.push({a,b,n:y.n,v:y.v,pct:pctDe(y.v,y.n)})}));
  duplas.sort((x,y)=>y.pct-x.pct||y.n-x.n);
  const anos=who?statsAnos(liga,who):[];
  const formaDots=arr=>arr.length?`<span class="form">${arr.map(f=>`<i class="${f==='V'?'v':f==='D'?'d':'e'}"></i>`).join('')}</span>`:'';

  /* lista com barra proporcional ao líder; o 1º ganha o dourado */
  const rkBars=(itens,num,fmt,sub,vazio)=>{
    if(!itens.length)return `<div class="tiny muted" style="padding:6px 2px">${vazio||'Sem dados ainda.'}</div>`;
    const max=Math.max(...itens.map(num),1e-9);
    return itens.map((x,i)=>{const sb=sub?sub(x):null;return `<div class="rk2 ${i===0?'top':''}">
      <span class="pos">${i+1}</span>${av(x.pid)}
      <div style="min-width:0"><div class="nm">${esc(nameOf(liga,x.pid))}</div>
        ${sb?`<div class="sub">${sb}</div>`:''}<div class="prog"><i style="width:${Math.max(4,num(x)/max*100)}%"></i></div></div>
      <span class="val">${fmt(x)}</span></div>`}).join('');
  };
  const C=2*Math.PI*43,pct=pctDe(me.v,me.jogos);
  const vedRow=(lab,n,cor)=>`<div class="r"><span>${lab}</span><div class="prog"><i style="width:${me.jogos?n/me.jogos*100:0}%;background:${cor}"></i></div><b class="num">${n}</b></div>`;
  const listaDuelo=(arr,m)=>arr.slice(0,8).map(x=>`<button class="rk2" data-a="duelo" data-id="${x.pid}" data-m="${m}">
      <span class="pos" style="font-size:12px;color:${x.v>x.d?'var(--ok)':x.d>x.v?'var(--bad)':'var(--mute2)'}">${x.v>x.d?'▲':x.d>x.v?'▼':'='}</span>${av(x.pid)}
      <div style="min-width:0"><div class="nm">${esc(nameOf(liga,x.pid))}</div>
        <div class="sub">${pl(x.n,m?'partida':'confronto')}${m?' juntos':''} · ${pctDe(x.v,x.n)}% de vitória</div>${vedBar(x)}</div>
      <span class="val num">${x.v}<small>V</small> ${x.e}<small>E</small> ${x.d}<small>D</small></span></button>`).join('');
  const quem=who===eu?'você':(p?p.name.split(' ')[0]:'');

  return `
  <div class="card">${seg}
    ${eu?'':`<div class="tiny muted" style="margin-top:9px">Ninguém assumiu um perfil neste aparelho ainda — abra a ficha de alguém em Jogadores e toque em “Este perfil sou eu” para o app saber quais partidas são suas.</div>`}
  </div>

  <div class="card">
    <div class="hero">
      <div class="avatar" style="--pc:${vePat(liga)&&p&&temPatente(p,'L')?PATC[patOf(p.L.rank)]:'var(--lime)'}">${esc(iniciais(p?p.name:'?'))}</div>
      <div class="who">
        <div class="k">${who===eu?'Você':'Jogador'} · ${rot}</div>
        <h2>${esc(p?p.name:'—')}</h2>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${vePat(liga)&&p&&temPatente(p,'L')?patBadge(liga,p.L.rank,'solid'):''}
          ${vePat(liga)&&p&&temPatente(p,'G')?patBadge(liga,p.G.rank)+'<span class="tiny muted">🧤</span>':''}
          ${me.ultimos.length?formaDots(me.ultimos):''}
        </div>
      </div>
      <button class="btn sm ghost" data-a="statsWho" style="width:auto;padding:9px 11px">Trocar</button>
    </div>
    <div class="herogrid">
      <div class="ring">
        <svg viewBox="0 0 104 104"><circle class="tr" cx="52" cy="52" r="43"/>
          <circle class="pr" cx="52" cy="52" r="43" stroke-dasharray="${(pct/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg>
        <div class="rv num">${pct}%</div><div class="rl">aproveitamento</div>
      </div>
      <div class="ved">${vedRow('Vitórias',me.v,'var(--ok)')}${vedRow('Empates',me.e,'var(--mute2)')}${vedRow('Derrotas',me.d,'var(--bad)')}</div>
    </div>
    ${me.seq>=2||me.best>=3?`<div class="tiny" style="margin:8px 0 2px">${me.seq>=2?`<span style="color:var(--ok)">🔥 ${me.seq} vitórias seguidas agora</span>`:''}${me.seq>=2&&me.best>=3?' · ':''}${me.best>=3?`<span class="muted">melhor sequência: ${me.best}</span>`:''}</div>`:''}
    <div class="tiles four" style="margin-top:12px">
      <div class="tile" style="--tc:var(--lime)"><b class="num">${me.nR}</b><span>racha${me.nR===1?'':'s'}</span></div>
      <div class="tile" style="--tc:var(--cyan)"><b class="num">${me.jogos}</b><span>partidas</span></div>
      <div class="tile" style="--tc:var(--gold)"><b class="num">${me.gols}</b><span>gols</span></div>
      <div class="tile" style="--tc:var(--coral)"><b class="num">${me.gk}</b><span>no gol</span></div>
    </div>
    <div class="tiny muted" style="margin-top:8px">Uma "partida" é cada formação em campo: quando alguém entra ou sai, começa outra.</div>
    ${anos.length>1||per==='sempre'?`<div class="hr"></div>
      <div class="k2" style="margin-top:0">Ano a ano</div>
      ${anos.map(a=>`<div class="rk"><span class="nm num">${a.ano}</span>
        <span class="tiny muted">${pl(a.nR,'racha')} · ${pl(a.jogos,'partida')} · ${pl(a.gols,'gol','gols')}</span>
        <span class="val num">${pctDe(a.v,a.jogos)}%</span></div>`).join('')}`:''}
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:10px">O racha ${rot}</div>
    <div class="tiles">
      <div class="tile" style="--tc:var(--lime)"><b class="num">${nRachas}</b><span>racha${nRachas===1?'':'s'}</span></div>
      <div class="tile" style="--tc:var(--cyan)"><b class="num">${ms.length}</b><span>partida${ms.length===1?'':'s'}</span></div>
      <div class="tile" style="--tc:var(--gold)"><b class="num">${golsTot}</b><span>gol${golsTot===1?'':'s'}</span></div>
    </div>
    <div style="height:8px"></div>
    <div class="tiles">
      <div class="tile" style="--tc:var(--gold)"><b class="num">${ms.length?(golsTot/ms.length).toFixed(1).replace('.',','):'—'}</b><span>gols por partida</span></div>
      <div class="tile" style="--tc:var(--mute2)"><b class="num">${pctDe(empates,ms.length)}%</b><span>empates</span></div>
      <div class="tile" style="--tc:var(--lime)"><b class="num">${nRachas?Math.round(ms.length/nRachas):'—'}</b><span>partidas por racha</span></div>
    </div>
    ${goleada.m?`<div class="k2">🔥 Maior goleada · ${DIA(goleada.m.ts)}</div>
    <div class="mini" style="margin-top:0">
      <div class="tm ${goleada.m.result===0?'win':''}">${esc(goleada.m.names[0])}</div>
      <div class="sc num">${goleada.m.score[0]}<span class="muted" style="margin:0 5px">–</span>${goleada.m.score[1]}</div>
      <div class="tm r ${goleada.m.result===1?'win':''}">${esc(goleada.m.names[1])}</div>
    </div>`:''}
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:8px">Duelos — quem ${esc(quem)} enfrenta</div>
    ${carrasco||fregues?`<div class="duo">
      ${carrasco?`<div class="hl bad"><div class="t">😤 Maior carrasco</div>
        <div class="n">${esc(nameOf(liga,carrasco.pid))}</div>
        <div class="s">${carrasco.d}V dele × ${carrasco.v}V ${who===eu?'suas':'de '+esc(quem)} em ${carrasco.n}</div></div>`:''}
      ${fregues&&(!carrasco||fregues.pid!==carrasco.pid)?`<div class="hl ok"><div class="t">😎 Freguês</div>
        <div class="n">${esc(nameOf(liga,fregues.pid))}</div>
        <div class="s">${fregues.v}V ${who===eu?'suas':'de '+esc(quem)} × ${fregues.d}V dele em ${fregues.n}</div></div>`:''}
    </div>`:''}
    ${duelos.length?listaDuelo(duelos,0):'<div class="tiny muted">Ainda não enfrentou ninguém neste período.</div>'}
    ${duelos.length?'<div class="tiny muted" style="margin-top:8px">▲ leva vantagem · ▼ leva desvantagem · toque para ver o histórico</div>':''}
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:8px">Parcerias — quem joga do lado de ${esc(quem)}</div>
    ${parceiro?`<div class="duo">
      <div class="hl"><div class="t">🤝 Mais jogou junto</div>
        <div class="n">${esc(nameOf(liga,parceiro.pid))}</div>
        <div class="s">${pl(parceiro.n,'partida')} juntos · ${pctDe(parceiro.v,parceiro.n)}% de vitória</div></div>
      ${dupla?`<div class="hl ok"><div class="t">⭐ Melhor dupla</div>
        <div class="n">${esc(nameOf(liga,dupla.pid))}</div>
        <div class="s">${pctDe(dupla.v,dupla.n)}% em ${pl(dupla.n,'partida')} juntos</div></div>`:''}
    </div>`:''}
    ${parcerias.length?listaDuelo(parcerias,1):'<div class="tiny muted">Ainda não jogou com ninguém neste período.</div>'}
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:2px">Top 5 ${rot}</div>
    <div class="tiny muted" style="margin-bottom:6px">Só histórico: nada aqui usa nível.</div>
    <div class="sec"><div class="k2">📅 Mais presenças</div>${rkBars(rkRachas,x=>x.nR,x=>pl(x.nR,'racha'),x=>pl(x.jogos,'partida'))}</div>
    <div class="sec"><div class="k2">🏆 Mais vitórias</div>${rkBars(rkVit,x=>x.v,x=>x.v+'V',x=>pctDe(x.v,x.jogos)+'% em '+pl(x.jogos,'partida'))}</div>
    <div class="sec"><div class="k2">📈 Maior aproveitamento <span class="tiny muted">(mín. ${MIN_JOGOS} partidas)</span></div>
      ${rkBars(rkPct,x=>pctDe(x.v,x.jogos),x=>pctDe(x.v,x.jogos)+'%',x=>vedTxt(x),'Ninguém bateu ainda as '+MIN_JOGOS+' partidas do período.')}</div>
    <div class="sec"><div class="k2">⚽ Artilharia</div>${rkBars(rkGols,x=>x.gols,x=>x.gols+' gol'+(x.gols===1?'':'s'),x=>(x.gols/Math.max(1,x.jogos)).toFixed(2).replace('.',',')+' por partida','Nenhum gol com autor marcado.')}</div>
    <div class="sec"><div class="k2">🔥 Maior sequência de vitórias <span class="tiny muted">(3 ou mais)</span></div>
      ${rkBars(rkSeq,x=>x.best,x=>x.best+' seguidas',x=>x.seq>=2?'em sequência agora: '+x.seq:null,'Ninguém emendou 3 ainda.')}</div>
    <div class="sec"><div class="k2">🧤 Menos vazado <span class="tiny muted">(mín. 5 partidas no gol)</span></div>
      ${rkBars(rkGk,x=>1/(1+x.sofridos/x.gk),x=>(x.sofridos/x.gk).toFixed(1).replace('.',',')+'<small>por partida</small>',x=>pl(x.gk,'partida')+' no gol · '+x.sofridos+' sofridos','Ninguém com 5 partidas no gol ainda.')}</div>
    <div class="sec"><div class="k2">⭐ Melhor dupla <span class="tiny muted">(mín. ${MIN_JOGOS} partidas juntos)</span></div>
      ${duplas.length?duplas.slice(0,5).map((x,i)=>`<div class="rk2 ${i===0?'top':''}">
        <span class="pos">${i+1}</span><span class="av" style="font-size:11px">${esc(iniciais(nameOf(liga,x.a))[0]||'')}${esc(iniciais(nameOf(liga,x.b))[0]||'')}</span>
        <div style="min-width:0"><div class="nm">${esc(nameOf(liga,x.a))} <span class="muted">&amp;</span> ${esc(nameOf(liga,x.b))}</div>
          <div class="sub">${x.v}V em ${pl(x.n,'partida')} juntos</div><div class="prog"><i style="width:${Math.max(4,x.pct/Math.max(1,duplas[0].pct)*100)}%"></i></div></div>
        <span class="val">${x.pct}%</span></div>`).join(''):`<div class="tiny muted" style="padding:6px 2px">Nenhuma dupla com ${MIN_JOGOS} partidas juntos ainda.</div>`}</div>
  </div>`;
}

/* ---------- histórico ---------- */
function mrow(liga,m,compact,eu){
  const w=m.result,d=(m.disputes||[]).length;
  const nm=s=>`<span class="${w===s?'win':''}">${esc(m.names[s])}</span>`;
  const tre=(m.stints||[]).filter(x=>x.counted).length;
  const lado=eu?ladoNaPartida(liga,m,eu):null;
  const meu=lado===null?'':(w==='draw'?'E':(w===lado?'V':'D'));
  const cor=meu==='V'?'var(--ok)':meu==='D'?'var(--bad)':'var(--mute)';
  return `<div class="mrow${lado===null?'':' eu'}" ${m.voided?'style="opacity:.5"':''}>
    <div class="l1">${nm(0)}${lado===0?' <span class="mine" style="color:'+cor+'">VOCÊ</span>':''}
      <span class="s num sp">${m.score[0]} - ${m.score[1]}</span></div>
    <div class="l1" style="margin-top:2px">${nm(1)}${lado===1?' <span class="mine" style="color:'+cor+'">VOCÊ</span>':''}
      ${m.voided?'<span class="flag" style="color:var(--bad);border:1px solid rgba(255,93,93,.4)">ANULADA</span>'
        :d?`<span class="flag" style="color:var(--gold);border:1px solid rgba(245,197,66,.45)">⚑ ${d}</span>`:''}</div>
    <div class="l2">${new Date(m.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
      · ${w==='draw'?'empate':'venceu '+esc(m.names[w])}${m.mode==='unica'?' · partida única':''}${tre>1?' · '+tre+' trechos':''}${m.voided?' · sem efeito nos níveis':''}
      ${!compact&&(m.moves||[]).length?' · '+m.moves.length+' mudança(s) de nível':''}</div>
    ${compact?'':`<div class="row" style="gap:6px;margin-top:7px">
      <button class="btn sm ghost" data-a="contest" data-id="${m.id}">⚑ Contestar</button>
      ${souAdmin(liga)?`<button class="btn sm ghost" data-a="review" data-id="${m.id}">Revisar</button>`:''}</div>`}
  </div>`;
}
/* O histórico é por RACHA, não por partida: uma noite de 12 partidas em uma
   linha só. Tocar no racha abre as partidas dele. Partida lançada solta (sem
   sessão) vira um grupo do próprio dia.                                      */
function rachasDe(liga,ms){
  const g={},ordem=[];
  ms.forEach(m=>{
    const k=m.sessionId||('avulso-'+new Date(m.ts).toDateString());
    if(!g[k]){g[k]={id:k,ts:m.ts,fim:m.ts,ms:[],gols:0,dis:0,avulso:!m.sessionId};ordem.push(g[k])}
    const r=g[k];r.ms.push(m);r.ts=Math.min(r.ts,m.ts);r.fim=Math.max(r.fim,m.ts);
    r.gols+=(m.score||[0,0])[0]+(m.score||[0,0])[1];
    if((m.disputes||[]).length&&!m.voided)r.dis++;
  });
  return ordem.sort((a,b)=>b.fim-a.fim);
}
const DIA=ts=>{const d=new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  return d.charAt(0).toUpperCase()+d.slice(1)};   // só a primeira letra, nada de "De Ago."
function viewHist(liga){
  if(!liga.matches.length)return `<div class="empty"><div class="big">Nada registrado</div>As partidas aparecem aqui.</div>`;
  const dis=liga.matches.filter(m=>(m.disputes||[]).length&&!m.voided).length;
  const eu=euId(liga);
  const minhas=eu?liga.matches.filter(m=>ladoNaPartida(liga,m,eu)!==null):[];
  const so=!!(eu&&S.ui.histMine);
  const base=so?minhas:liga.matches;
  const grupos=rachasDe(liga,base);
  const aberto=grupos.find(r=>r.id===S.ui.histRacha);
  const topo=`${dis?`<div class="card" style="border-color:rgba(245,197,66,.4);margin-bottom:10px">
      <div class="row"><div><b>${dis}</b> partida(s) contestada(s)</div>
      <div class="tiny muted sp">aguardando revisão</div></div></div>`:''}
    ${eu?`<div class="row" style="gap:6px;margin-bottom:10px">
      <button class="btn sm ${so?'ghost':'pri'}" data-a="histMine" data-v="0" style="flex:1">Todas (${liga.matches.length})</button>
      <button class="btn sm ${so?'pri':'ghost'}" data-a="histMine" data-v="1" style="flex:1">Só as minhas (${minhas.length})</button>
    </div>`:''}`;
  /* --- dentro de um racha --- */
  if(aberto){
    const ms=aberto.ms.slice().sort((a,b)=>b.ts-a.ts);
    const art=(()=>{const c={};aberto.ms.forEach(m=>(m.goals||[]).forEach(g=>{if(g.pid&&!g.own)c[g.pid]=(c[g.pid]||0)+1}));
      const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
      return top?esc(nameOf(liga,top))+' '+c[top]+' gol'+(c[top]===1?'':'s'):null})();
    return topo+`
    <button class="btn sm ghost" data-a="histRacha" data-id="" style="margin-bottom:10px">‹ Todos os rachas</button>
    <div class="card" style="margin-bottom:10px">
      <div class="row"><div class="k">${aberto.avulso?'Partidas avulsas':'Racha'}</div>
        <div class="sp tiny muted">${DIA(aberto.fim)}</div></div>
      <h2 style="font-size:20px;margin:4px 0 6px">${ms.length} partida${ms.length===1?'':'s'}</h2>
      <div class="tiny muted">${aberto.gols} gol${aberto.gols===1?'':'s'}${art?' · artilheiro da noite: <b>'+art+'</b>':''}${aberto.dis?' · <span style="color:var(--gold)">⛑ '+aberto.dis+' contestada(s)</span>':''}</div>
    </div>
    <div class="card" style="padding:0">${ms.map(m=>mrow(liga,m,false,eu)).join('')}</div>`;
  }
  /* --- lista de rachas --- */
  return topo+`<div class="card" style="padding:0">
    ${grupos.length?grupos.slice(0,60).map(r=>{
      const v=r.ms.filter(m=>!m.voided).length;
      const meus=eu?r.ms.filter(m=>ladoNaPartida(liga,m,eu)!==null).length:0;
      return `<button class="rachaRow ${meus?'eu':''}" data-a="histRacha" data-id="${esc(r.id)}">
        <div style="min-width:0;flex:1">
          <div class="nm">${r.avulso?'Partidas avulsas':DIA(r.fim)}</div>
          <div class="meta"><span class="num">${v} partida${v===1?'':'s'}</span>
            <span class="num">${r.gols} gol${r.gols===1?'':'s'}</span>
            ${meus?`<span class="mine" style="color:var(--lime)">VOCÊ ${meus}</span>`:''}
            ${r.dis?`<span style="color:var(--gold)">⛑ ${r.dis}</span>`:''}</div>
        </div>

/* ---------- barra inferior ---------- */
function barFor(liga){
  const lv=liga.live;
  if(S.ui.tab!=='racha')return '';
  if(!lv)return '<button class="btn wide pri" data-a="startRacha">▶ Iniciar racha</button>';
  if(lv.stage==='presenca')return `
    <button class="btn ghost" data-a="cancelRacha">Cancelar</button>
    <button class="btn pri" data-a="toTimes" ${lv.presentIds.length<4?'disabled':''}>Montar times (${lv.presentIds.length})</button>`;
  if(lv.stage==='times')return `
    <button class="btn ghost" data-a="backPres">Voltar</button>
    <button class="btn pri" data-a="startJogo">▶ Começar racha</button>`;
  if(!lv.cur)return `
    <button class="btn ghost" data-a="endRacha">Encerrar racha</button>
    <button class="btn pri" data-a="startMatch">▶ Começar partida</button>`;
  const c=lv.cur,n=[lv.teams[c.a].name,lv.teams[c.b].name];
  const txt=c.score[0]===c.score[1]?`Empate ${c.score[0]}-${c.score[1]}`
    :`${c.score[0]>c.score[1]?n[0]:n[1]} ${Math.max(...c.score)}-${Math.min(...c.score)}`;
  /* Nada de "Encerrar racha" ao lado do "Fim": um toque errado com o proximo
     time entrando nao pode acabar com a noite.                              */
  return `<button class="btn ghost" data-a="undo" style="flex:0 0 62px;padding:13px 0" title="desfazer">↶</button>
    <button class="btn pri" data-a="endMatch">✓ Fim · ${esc(txt)}</button>`;
}

/* ---------- relógio ---------- */
let clockTimer=null;
function tickClock(){
  clearInterval(clockTimer);
  const el=$('#clk');if(!el)return;
  const liga=L(),c=liga&&liga.live&&liga.live.cur;if(!c)return;
  const upd=()=>{
    const s=Math.floor(gameTime(c,Date.now())/1000);
    el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    const alvoGols=liga.cfg.targetGoals>0&&(c.score[0]>=liga.cfg.targetGoals||c.score[1]>=liga.cfg.targetGoals);
    el.classList.toggle('hit',!c.paused&&(s>=liga.cfg.targetMin*60||alvoGols));
  };
  upd();
  if(!c.paused)clockTimer=setInterval(upd,1000);
}
/* A tela não pode apagar com o cronômetro rodando — o celular fica no chão
   da quadra e ninguém quer digitar senha para marcar um gol. Só durante a
   partida: fora dela, solta e deixa o aparelho economizar bateria.          */
let wake=null;
async function manterAcesa(sim){
  try{
    if(!navigator.wakeLock)return;
    if(sim&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
    else if(!sim&&wake){await wake.release();wake=null}
  }catch(e){}
}
function cuidaWake(){
  const liga=L(),c=liga&&liga.live&&liga.live.cur;
  manterAcesa(!!(c&&!c.paused)&&document.visibilityState==='visible');
}

  /* ----- partida ----- */
  /* Times fechados: o racha começa, mas a partida não. A tela seguinte é a de
     "Próxima partida" — quem joga, escalação, chance — e só o apito é o botão
     "Começar partida". Assim dá para conferir/trocar quem entra antes do relógio. */
  startJogo(){
    const l=L(),lv=l.live;
    if(lv.teams.length<2)return toast('Monte os times primeiro');
    if(!Array.isArray(lv.queue))lv.queue=[];
    lv.stage='jogo';lv.cur=null;
    lv.per=lv.per||perTeamSize(l,(lv.gkPool||[]).length>0);
    lv.nextPair=suggestPair(l,lv);resetFill(lv);
    save();render();
  },
  startMatch(){
    const l=L(),lv=l.live;
    if(lv.cur)return;
    if(lv.teams.length<2)return toast('Monte os times primeiro');
    if(!Array.isArray(lv.queue))lv.queue=[];
    const all=lv.teams.map((_,i)=>i);
    let pair=(lv.nextPair||[]).filter(i=>all.includes(i));
    if(pair.length!==2||pair[0]===pair[1])pair=suggestPair(l,lv);
    const [a,b]=pair;
    lv.queue=all.filter(i=>i!==a&&i!==b);       // o resto espera, na ordem dos times
    lv.nextPair=null;
    lv.stage='jogo';
    lv.per=lv.per||perTeamSize(l,(lv.gkPool||[]).length>0);
    // ninguém joga com mais gente que o adversário: o time menor é completado
    // com quem está de fora e, se ainda faltar, o maior entra com menos
    const f=fillDe(l,lv,[a,b]);
    const esc0=[lv.teams[a].ids.slice(0,lv.per).concat(f[0]),lv.teams[b].ids.slice(0,lv.per).concat(f[1])];
    const per=Math.min(lv.per,esc0[0].length,esc0[1].length);
    const gks=assignGks(lv);
    lv.cur={a,b,startedAt:Date.now(),score:[0,0],events:[],paused:false,
      lineups:[esc0[0].slice(0,per),esc0[1].slice(0,per)],gks,
      fill:[f[0].slice(),f[1].slice()]};
    resetFill(lv);
    [0,1].forEach(sd=>{
      const g=gks[sd];
      if(g&&!lv.cur.lineups[sd].includes(g))lv.cur.lineups[sd].push(g);
      if(!gks[sd]){                                   // goleiro do dia escalado no time assume o gol
        const dono=lv.cur.lineups[sd].find(id=>ehGkHoje(lv,id));
        if(dono)gks[sd]=dono;
      }
    });
    /* escalação e goleiros de largada: é a partir daqui que os trechos são reconstruídos */
    lv.cur.startLineups=lv.cur.lineups.map(x=>[...x]);
    lv.cur.startGks=[...gks];
    save();render();
  },

      <div class="tiny muted" style="margin-top:10px;line-height:1.5">Quem está no rodízio troca de lado a cada partida e não ganha nem perde nível. Quem improvisa no gol continua contando normalmente pelo time.</div>`);

  setGk(el){
    const l=L(),lv=l.live,c=lv.cur,s=+el.dataset.s,id=el.dataset.id||null;
    const other=s===0?1:0;
    if(id&&c.gks[other]===id)c.gks[other]=null;      // trocou de lado: libera o outro
    c.gks[s]=id;
    /* trocar quem está no gol muda o nível dos dois lados: fecha o trecho */
    c.events.push({t:Date.now(),type:'gk',side:s,id,gks:[...c.gks]});

  undo(){
    const l=L(),c=l.live.cur;
    if(!c||!c.events.length){
      if(!l.live.matchIds.length)return toast('Nada para desfazer');
      return A.delMatch({dataset:{id:l.live.matchIds[l.live.matchIds.length-1]}});
    }
    const ev=c.events.pop();
    if(ev.type==='goal')c.score[ev.side]--;
    if(ev.type==='sub'){
      const k=c.lineups[ev.side].indexOf(ev.in);if(k>=0)c.lineups[ev.side][k]=ev.out;
      const t=l.live.teams[ev.side===0?c.a:c.b],j=t.ids.indexOf(ev.in);if(j>=0)t.ids[j]=ev.out;
    }
    if(ev.type==='pause')c.paused=false;
    if(ev.type==='resume')c.paused=true;
    if(ev.type==='sub'||ev.type==='gk'){              // volta os goleiros para o estado anterior
      let ant=null;
      for(let i=c.events.length-1;i>=0;i--){const e=c.events[i];
        if(Array.isArray(e.gks)){ant=e.gks;break}}
      c.gks=ant?[...ant]:[...(c.startGks||c.gks)];
    }
    save();render();toast('Desfeito');

        :'<span class="tiny muted">Ninguém no banco. Use “chegou agora” ou marque mais gente na presença.</span>'}</div>
      <div style="height:12px"></div><button class="btn wide ghost" data-a="closeSheet">Cancelar</button>`);

    const l=L(),lv=l.live,c=lv.cur;if(!c)return;

    openSheet(`<h2>${esc(nameOf(l,inn))} entra no lugar de quem?</h2>
      ${[0,1].map(s=>`<div class="teamtag ${TEAMBG[s===0?c.a:c.b]}">${esc(lv.teams[s===0?c.a:c.b].name)}</div>
        <div class="chips" style="margin-bottom:12px">${c.lineups[s].map(x=>`<button class="tp big" data-a="doSub" data-s="${s}" data-out="${x}" data-id="${inn}">${esc(nameOf(l,x))}</button>`).join('')}</div>`).join('')}
      <button class="btn wide ghost" data-a="closeSheet">Cancelar</button>`);
  },
  doSub(el){
    const l=L(),lv=l.live,c=lv.cur;if(!c)return;
    const s=+el.dataset.s,out=el.dataset.out,inn=el.dataset.id,pool=lv.gkPool||[];
    const k=c.lineups[s].indexOf(out);
    if(k>=0)c.lineups[s][k]=inn;else c.lineups[s].push(inn);
    if(!pool.includes(out)&&!pool.includes(inn)){
      const ti=s===0?c.a:c.b,t=lv.teams[ti];
      const jOut=t.ids.indexOf(out),jIn=t.ids.indexOf(inn);
      if(jIn>=0&&jOut>=0){const tmp=t.ids[jOut];t.ids[jOut]=t.ids[jIn];t.ids[jIn]=tmp}   // titular ⇄ reserva
      else{
        if(jOut>=0)t.ids[jOut]=inn;else t.ids.push(inn);
        lv.teams.forEach((tt,i)=>{if(i!==ti){const q=tt.ids.indexOf(inn);if(q>=0)tt.ids.splice(q,1)}});
      }
    }
    if(c.gks[s]===out)c.gks[s]=pool.includes(inn)?inn:null;
    c.events.push({t:Date.now(),type:'sub',side:s,out,in:inn,gks:[...c.gks]});
    closeSheet();save();render();toast('Entrou '+nameOf(l,inn));
  },
  finish(el){
    const l=L(),lv=l.live,c=lv.cur;if(!c)return;
    const result=el.dataset.r==='draw'?'draw':+el.dataset.r;
    const endedAt=Date.now();
    if(c.paused){c.events.push({t:endedAt,type:'resume'});c.paused=false}
    const modo=lv.mode||l.cfg.matchMode||'curtas';
    /* cada formação em campo vira um trecho: é isso que o nível enxerga */
    const stints=splitStints(c,endedAt,l.cfg);
    /* se o vencedor foi corrigido na mão, quem manda é a correção: ela vale
       para o trecho que fechou a partida.                                    */
    if(stints.length&&result!==stintResult(c.score))stints[stints.length-1].result=result;
    const m={id:uid(),ts:endedAt,startedAt:c.startedAt,endedAt,sessionId:lv.id||null,mode:modo,
      names:[lv.teams[c.a].name,lv.teams[c.b].name],
      teamIdx:[c.a,c.b],lineups:c.lineups.map(x=>[...x]),
      startLineups:(c.startLineups||c.lineups).map(x=>[...x]),
      gks:[...c.gks],stints,score:[...c.score],result,
      /* gol sem autor fica registrado com pid nulo: é assim que os destaques
         sabem se a artilharia do período é confiável ("gols sem autor demais") */
      goals:c.events.filter(e=>e.type==='goal').map(e=>({pid:e.pid||null,side:e.side,own:!!e.own,t:e.t,min:gameTime(c,e.t)})),
      /* o log bruto (gols, substituições, pausas, com hora) fica inteiro: os
         trechos são derivados dele, e estatística futura pode querer o resto */
      events:c.events.map(e=>Object.assign({},e)),
      disputes:[],voided:false};
    applyMatch(l,m);
    l.matches.push(m);lv.matchIds.push(m.id);
    const saiu=[];
    if(lv.teams.length>2){
      if(result==='draw'||!l.cfg.winnerStays){        // empate com 3 ou 4 times: os dois saem
        lv.lastWinner=null;lv.queue.push(c.a,c.b);saiu.push(c.a,c.b);
      }else{
        const winner=result===0?c.a:c.b,perdedor=winner===c.a?c.b:c.a;
        lv.lastWinner=winner;lv.queue.push(perdedor);saiu.push(perdedor);
      }
    }else{
      lv.lastWinner=result==='draw'?null:(result===0?c.a:c.b);
      /* dois times: quem perdeu não sai de quadra, mas o time dele roda com a fila */
      if(result!=='draw'&&l.cfg.winnerStays)saiu.push(result===0?c.b:c.a);
    }
    /* "de próximo": quem estava esperando entra no lugar de quem saiu */
    const giros=saiu.map(i=>({i,r:rodaFila(l,lv,i)})).filter(x=>x.r&&x.r.entram.length);
    lv.cur=null;lv.nextPair=suggestPair(l,lv);resetFill(lv);
    closeSheet();save();render();
    /* sem modal e sem falar de nível aqui: o que mudou aparece no fim do racha */
    const placar=result==='draw'?`Empate ${m.score[0]}-${m.score[1]}`
      :`${m.names[result]} ${Math.max(...m.score)}-${Math.min(...m.score)}`;
    toast(giros.length
      ?`${placar} · entra ${giros[0].r.entram.map(id=>nameOf(l,id).split(' ')[0]).join(', ')}`
      :`${placar} · registrado`);
  },

  /* ----- contestação e revisão ----- */
  contest(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    m.disputes=m.disputes||[];
    const who=S.me.name||'você';
    if(m.disputes.some(d=>d.by===who))return toast('Você já contestou');
    m.disputes.push({by:who,ts:Date.now()});
    if(l.cfg.disputeMode==='suspend'&&m.disputes.length>=l.cfg.disputeThreshold&&!m.voided){
      m.voided=true;rebuildAll(l);toast('Partida suspensa até revisão');
    }else toast('Contestada ('+m.disputes.length+'/'+l.cfg.disputeThreshold+')');
    closeSheet();save();render();
  },
  review(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;

  fixResult(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souEditor(l))return toast('Só admin ou editor corrige resultado');
    const novo=el.dataset.r==='draw'?'draw':+el.dataset.r;
    logAdd(l,'result',{mid:m.id,from:m.result,to:novo,voided:m.voided});
    m.result=novo;
    /* a correcao vale para o trecho que fechou a partida — os trechos anteriores
       ja tinham vencedor proprio, cada um com o seu placar                     */
    if(Array.isArray(m.stints)&&m.stints.length){
      const cont=m.stints.filter(x=>x.counted);
      (cont.length?cont[cont.length-1]:m.stints[m.stints.length-1]).result=m.result;
    }
    m.disputes=[];m.voided=false;rebuildAll(l);
    closeSheet();save();render();toast('Corrigido, níveis recalculados');
  },
  voidMatch(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin anula partida');
    m.voided=!m.voided;if(!m.voided)m.disputes=[];
    logAdd(l,m.voided?'void':'unvoid',{mid:m.id});
    rebuildAll(l);closeSheet();save();render();toast(m.voided?'Partida anulada':'Partida reativada');
  },
  clearDisputes(el){
    const l=L(),m=l.matches.find(x=>x.id===el.dataset.id);if(!m)return;
    if(!souAdmin(l))return toast('Só o admin encerra contestação');
    logAdd(l,'keep',{mid:m.id,voided:m.voided});
    m.disputes=[];if(m.voided){m.voided=false;rebuildAll(l)}
    closeSheet();save();render();toast('Resultado mantido');
  },
  delMatch(el){
    const l=L(),i=l.matches.findIndex(m=>m.id===el.dataset.id);if(i<0)return;
    const m=l.matches[i];
    /* desfazer a última partida do racha em andamento é de quem está lançando;
       apagar qualquer outra é revisão, e revisão é do admin */
    const ultimaDoRacha=!!(l.live&&l.live.matchIds.length&&l.live.matchIds[l.live.matchIds.length-1]===m.id);
    if(!ultimaDoRacha&&!souAdmin(l))return toast('Só o admin apaga partida do histórico');
    if(i!==l.matches.length-1&&!confirm('Apagar esta partida? Os níveis são recalculados do zero.'))return;
    logAdd(l,'delMatch',{mid:m.id,ts0:m.ts,score:m.score,result:m.result,names:m.names,ultimaDoRacha});
    l.matches.splice(i,1);rebuildAll(l);
    if(l.live)l.live.matchIds=l.live.matchIds.filter(x=>x!==m.id);
    closeSheet();save();render();toast('Partida apagada');

  /* ----- fim de racha ----- */
  endRacha(){

    const ms=lv.matchIds.map(id=>l.matches.find(m=>m.id===id)).filter(Boolean);

    const gols={},net={};
    ms.forEach(m=>{(m.goals||[]).forEach(g=>{if(g.pid&&!g.own)gols[g.pid]=(gols[g.pid]||0)+1});
      (m.moves||[]).forEach(x=>{const k=x.pid+'|'+(x.role||'L');net[k]=(net[k]||0)+x.dir})});

/* Abinha discreta: "do time" (padrão) | "contra" — troca os nomes para os do outro time. */
function scorerTabs(alvo,t,contra){
  return `<span class="sp tiny" style="display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px">
    <button data-a="scorerSide" data-for="${alvo}" data-t="${t}" data-own="0" style="border:0;border-radius:6px;padding:3px 8px;font:inherit;cursor:pointer;background:${contra?'transparent':'var(--line2)'};color:${contra?'var(--mute)':'var(--chalk)'}">do time</button>
    <button data-a="scorerSide" data-for="${alvo}" data-t="${t}" data-own="1" style="border:0;border-radius:6px;padding:3px 8px;font:inherit;cursor:pointer;background:${contra?'var(--line2)':'transparent'};color:${contra?'var(--chalk)':'var(--mute)'}">contra</button></span>`;

function showScorer(side,contra){

  if(!box)return;
  const lado=contra?1-side:side;
  box.innerHTML=`<div class="scorerbar">

/* ==========================================================================
   PINTAR PRESENÇA — segurar num nome e arrastar marca (ou desmarca) todo
   mundo por onde o dedo passa. O primeiro nome decide: se ele acendeu, o
   arraste acende; se apagou, apaga. No mouse basta clicar e arrastar.
   Toque: precisa do "segurar" (180 ms) para não brigar com a rolagem —
   depois disso o touchmove é cancelado e a página não rola.
   ========================================================================== */
let paint=null;
function paintChipAt(x,y){
  const el=document.elementFromPoint(x,y),chip=el&&el.closest?el.closest('#plist .pchip'):null;
  if(!chip||paint.done.has(chip.dataset.id))return;
  paint.done.add(chip.dataset.id);
  if(chip.classList.contains('on')!==paint.on)A.pres(chip);
}
function beginPaint(chip){
  const l=L();
  if(!l||!l.live||!podeLancar(l)){paint=null;return}
  A.pres(chip);                                   // o primeiro nome vira e dita o resto
  paint.on=chip.classList.contains('on');paint.done.add(chip.dataset.id);paint.active=true;
  document.body.classList.add('painting');buzz(10);
}
function endPaint(){
  if(!paint)return;
  if(paint.timer)clearTimeout(paint.timer);
  const foi=paint.active;paint=null;
  document.body.classList.remove('painting');
  if(foi){suppressClick=true;setTimeout(()=>suppressClick=false,320)}
}
document.addEventListener('touchstart',e=>{
  const chip=e.target.closest&&e.target.closest('#plist .pchip');if(!chip||e.touches.length!==1)return;
  endPaint();
  const t=e.touches[0];
  paint={chip,x0:t.clientX,y0:t.clientY,active:false,done:new Set(),timer:null};
  paint.timer=setTimeout(()=>{if(paint&&!paint.active)beginPaint(chip)},180);
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!paint)return;
  const t=e.touches[0];
  if(!paint.active){                              // mexeu antes de segurar: é rolagem
    if(Math.hypot(t.clientX-paint.x0,t.clientY-paint.y0)>12)endPaint();
    return;
  }
  e.preventDefault();
  paintChipAt(t.clientX,t.clientY);
},{passive:false});
document.addEventListener('touchend',endPaint);
document.addEventListener('touchcancel',endPaint);
document.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  const chip=e.target.closest&&e.target.closest('#plist .pchip');if(!chip)return;
  paint={chip,x0:e.clientX,y0:e.clientY,active:false,done:new Set(),timer:null};
});
document.addEventListener('mousemove',e=>{
  if(!paint)return;
  if(!paint.active){
    if(Math.hypot(e.clientX-paint.x0,e.clientY-paint.y0)<6)return;
    beginPaint(paint.chip);if(!paint)return;
  }
  paintChipAt(e.clientX,e.clientY);
});
document.addEventListener('mouseup',endPaint);

/* ==========================================================================
   ARRASTAR — segurar e arrastar um nome sobre outro. O toque continua
   funcionando igual; o arraste é só um caminho mais direto.
   ========================================================================== */
let drag=null,suppressClick=false;
function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el?el.closest('[data-drop-player],[data-drop-zone]'):null;
}
function clearDropMarks(){$$('.dropok,.dropzone').forEach(e=>e.classList.remove('dropok','dropzone'))}
function beginDrag(e){
  const el=drag.el,r=el.getBoundingClientRect(),g=el.cloneNode(true);
  g.className=el.className+' dragghost';
  g.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+
    'px;pointer-events:none;z-index:300;opacity:.96;transform:scale(1.07);box-shadow:0 12px 28px rgba(0,0,0,.55)';
  document.body.appendChild(g);
  drag.ghost=g;drag.gx=e.clientX-r.left;drag.gy=e.clientY-r.top;drag.active=true;
  el.classList.add('dragging');buzz(12);
}
function endDrag(drop){
  if(drag){
    if(drag.timer)clearTimeout(drag.timer);
    if(drag.ghost)drag.ghost.remove();
    if(drag.el)drag.el.classList.remove('dragging');
  }
  clearDropMarks();drag=null;
  if(drop){suppressClick=true;setTimeout(()=>suppressClick=false,320)}
}
function onDrop(fromId,target){
  const l=L(),lv=l&&l.live;if(!lv||!fromId||!target)return;
  const alvo=target.dataset.dropPlayer,zona=target.dataset.dropZone;
  if(alvo===fromId)return;
  if(lv.stage==='jogo'&&lv.cur){
    const c=lv.cur;
    if(!alvo)return toast('Solte em cima de quem vai sair');
    const sai=[0,1].find(sd=>c.lineups[sd].includes(alvo));
    if(sai===undefined)return toast('Solte em cima de quem está em quadra');
    if(c.lineups[0].includes(fromId)||c.lineups[1].includes(fromId))return toast('Esse já está em quadra');
    A.doSub({dataset:{s:String(sai),out:alvo,id:fromId}});
    return;
  }
  // montagem de times
  if(alvo){
    lv.sel=fromId;A.sel({dataset:{id:alvo}});return;          // troca de lugar
  }
  lv.sel=fromId;
  if(zona==='pool')return A.toPool({dataset:{}});
  if(zona==='bench')return A.toTeam({dataset:{i:'-1'}});
  if(zona&&zona.indexOf('team:')===0)return A.toTeam({dataset:{i:zona.slice(5)}});
  lv.sel=null;
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el)return;
  endDrag(false);
  drag={el,id:el.dataset.id,x0:e.clientX,y0:e.clientY,pid:e.pointerId,active:false,timer:null};
  if(e.pointerType==='mouse')return;                       // no mouse, arrasta ao mover
  drag.timer=setTimeout(()=>{if(drag)beginDrag(e)},180);   // no toque, segura e arrasta
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0,dist=Math.hypot(dx,dy);
  if(!drag.active){
    if(e.pointerType==='mouse'&&dist>6)beginDrag(e);
    else if(dist>12){endDrag(false);return}                // rolou a tela: deixa o navegador cuidar
    if(!drag||!drag.active)return;
  }
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.gx)+'px';
  drag.ghost.style.top=(e.clientY-drag.gy)+'px';
  clearDropMarks();
  const t=dropTargetAt(e.clientX,e.clientY);
  if(t&&t.dataset.dropPlayer!==drag.id)t.classList.add(t.dataset.dropPlayer?'dropok':'dropzone');
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.active){endDrag(false);return}
  const from=drag.id,t=dropTargetAt(e.clientX,e.clientY);
  endDrag(true);
  onDrop(from,t);
});
document.addEventListener('pointercancel',()=>endDrag(false));

/* Folha de baixo: puxar a alça para baixo fecha, como em qualquer app de celular. */
let sheetDrag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('#sheet .grab');if(!g)return;
  sheetDrag={y0:e.clientY,pid:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!sheetDrag||e.pointerId!==sheetDrag.pid)return;
  const dy=Math.max(0,e.clientY-sheetDrag.y0);
  $('#sheet').style.transform='translateY('+dy+'px)';
},{passive:true});
document.addEventListener('pointerup',e=>{
  if(!sheetDrag||e.pointerId!==sheetDrag.pid)return;
  const dy=e.clientY-sheetDrag.y0;sheetDrag=null;
  const sh=$('#sheet');sh.style.transform='';
  if(dy>70)closeSheet();
});

/* ---------- delegação de eventos ---------- */
document.addEventListener('click',e=>{
  if(suppressClick)return;
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  e.stopPropagation();
  const lg=L();
  if(lg&&ACOES_LANCAR.has(el.dataset.a)&&!podeLancar(lg))return toast('Você é Jogador nesta liga — peça ao admin para virar Lançador');
  if(lg&&ACOES_ADMIN.has(el.dataset.a)&&!souAdmin(lg))return toast('Só o admin mexe nos ajustes da liga');
  fn(el);
});
document.addEventListener('change',e=>{
  const el=e.target,l=L();if(!l)return;
  if((el.dataset.cfg||el.dataset.pat!==undefined)&&!souAdmin(l)){render();return toast('Só o admin mexe nos ajustes da liga')}
  if(el.dataset.cfg){
    /* campo numérico vazio ou negativo não pode virar NaN no motor: volta ao que estava */
    const LIM={targetGoals:[0,99],targetMin:[1,180],stintMin:[0,60],disputeThreshold:[1,50]};
    const lim=LIM[el.dataset.cfg]||[0,1e6],v=Math.round(+el.value);
    if(!isFinite(v)){el.value=l.cfg[el.dataset.cfg];return toast('Valor inválido')}
    l.cfg[el.dataset.cfg]=clamp(v,lim[0],lim[1]);el.value=l.cfg[el.dataset.cfg];
    save();toast('Salvo');
  }
  if(el.dataset.pat!==undefined){l.cfg.patNames[+el.dataset.pat]=el.value.trim()||l.cfg.patNames[+el.dataset.pat];save();render()}
});
/* ==========================================================================
   BACKEND — contas e Postgres (Supabase)

   O motor não sabe que existe servidor. Cada liga é UM documento jsonb numa
   linha de `leagues`; save() marca a liga suja e o sincronizador empurra o
   documento com trava otimista (version). Se outra pessoa gravou no meio,
   o servidor devolve o estado bom e a tela se realinha.
   Esquema em supabase/schema.sql.
   ========================================================================== */
const CFG=window.RAXA_CFG||{};
const CONFIGURADO=!!(window.supabase&&CFG.url&&CFG.anonKey&&CFG.url.indexOf('http')===0);
const sb=CONFIGURADO?window.supabase.createClient(CFG.url,CFG.anonKey,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;

/* O Auth exige formato de e-mail; o racha usa usuário e senha. O domínio é
   fictício de propósito — não existe caixa de entrada, nada é enviado.
   Precisa ter um TLD real: o Supabase passou a recusar ".local" e afins
   (email_address_invalid). Trocar isto depois de existir conta = ninguém entra. */
const MAILDOM='@raxa.app';
const userMail=u=>String(u).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+MAILDOM;

let ME=null;                       // {id, username}
let PEND=[];                       // meus pedidos de entrada aguardando o admin [{league_id,name,requested_at}]
const VER={}, SNAP={}, CODE={};    // por liga: versão do servidor, último doc gravado, código de convite
let syncT=null, syncing=false, netErr=false, chan=null;
const dirty=new Set();

/* ---------- preferência de aparelho (não é dado do racha) ---------- */
const UIKEY='raxa_ui';
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify({ui:S.ui,active:S.active}))}catch(e){}}
function loadUI(){
  try{
    const o=JSON.parse(localStorage.getItem(UIKEY)||'{}');
    if(o.ui)S.ui=Object.assign(S.ui,o.ui);
    if(o.active)S.active=o.active;      // normalize() descarta se a liga sumiu
  }catch(e){}
}

/* ---------- sincronizador ---------- */
const ligaData=l=>l;                   // o documento é a própria liga
function markDirty(id){if(!id)return;dirty.add(id);agenda()}
/* Sem rede, a nova tentativa espaça (0,45 s → 1 s → 2 s … até 30 s) em vez de
   martelar o servidor a cada meio segundo; a primeira gravação boa zera.   */
let tentativas=0;
function agenda(){
  clearTimeout(syncT);
  const espera=netErr?Math.min(30000,1000*Math.pow(2,Math.min(tentativas,5))):450;
  syncT=setTimeout(flush,espera);
}

function syncDot(estado){              // salvando | erro | limpo
  let el=$('#sync');
  if(!el){el=document.createElement('div');el.id='sync';
    el.style.cssText='position:fixed;left:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:120;'
      +'font:700 10px/1 var(--cond,sans-serif);letter-spacing:.12em;text-transform:uppercase;'
      +'padding:6px 9px;border-radius:8px;pointer-events:none;transition:opacity .2s';
    document.body.appendChild(el)}
  if(estado==='limpo'){el.style.opacity='0';return}
  el.style.opacity='1';
  el.textContent=estado==='erro'?'sem conexão':'salvando';
  el.style.background=estado==='erro'?'var(--bad,#FF5F5F)':'var(--panel,#111917)';
  el.style.color=estado==='erro'?'#1a0a0a':'var(--mute,#84998E)';
}

async function flush(){
  if(!sb||!ME||syncing)return;
  syncing=true;
  try{
    for(const id of [...dirty]){
      dirty.delete(id);
      const l=S.ligas.find(x=>x.id===id);
      if(!l)continue;
      const json=JSON.stringify(ligaData(l));
      if(SNAP[id]===json)continue;                 // save() sem mudança real (trocar de aba, abrir liga)
      syncDot('salvando');
      const {data,error}=await sb.rpc('save_league',{p_id:id,p_data:JSON.parse(json),p_version:VER[id]||1});
      if(error){netErr=true;tentativas++;syncDot('erro');dirty.add(id);continue}
      netErr=false;tentativas=0;
      if(data&&data.ok===false){                   // alguém gravou antes: o servidor manda o estado bom
        VER[id]=data.version;
        aplicaRemoto(id,data.data,data.name,data.code);
        toast('Atualizado por outra pessoa');
        render();
      }else if(data){
        VER[id]=data.version;SNAP[id]=json;if(data.code)CODE[id]=data.code;
      }
    }
  }finally{
    syncing=false;
    if(dirty.size){agenda();syncDot(netErr?'erro':'salvando')}
    else syncDot(netErr?'erro':'limpo');
  }
}

function aplicaRemoto(id,data,name,code){
  const i=S.ligas.findIndex(x=>x.id===id);
  const l=Object.assign({createdAt:Date.now(),cfg:defCfg(),players:[],matches:[],sessions:[],live:null},
                        data||{},{id:id,name:name||(data&&data.name)||'Liga'});
  if(i<0)S.ligas.push(l);else S.ligas[i]=l;
  if(code)CODE[id]=code;
  S=normalize(S);
  const fin=S.ligas.find(x=>x.id===id);
  if(fin)SNAP[id]=JSON.stringify(ligaData(fin));
}

async function loadAll(){
  const {data,error}=await sb.from('leagues').select('id,name,code,data,version').order('created_at');
  if(error)throw error;
  S.ligas=[];
  (data||[]).forEach(row=>{
    VER[row.id]=row.version;CODE[row.id]=row.code;
    aplicaRemoto(row.id,row.data,row.name,row.code);
  });
  S=normalize(S);
  await loadPend();
}
async function loadPend(){
  try{const r=await sb.rpc('my_requests');PEND=(r.data||[])}catch(e){PEND=[]}
}

/* ---------- tempo real ----------
   O payload de uma liga grande estoura o limite de mensagem do Realtime, então
   o aviso serve só como "mudou": quem busca a linha de novo é o cliente.      */
function watch(){
  if(!sb)return;
  if(chan){sb.removeChannel(chan);chan=null}
  chan=sb.channel('raxa-leagues')
    .on('postgres_changes',{event:'*',schema:'public',table:'leagues'},p=>{
      const id=(p.new&&p.new.id)||(p.old&&p.old.id);
      if(!id)return;
      if(p.eventType==='DELETE'){
        if(!S.ligas.some(l=>l.id===id))return;
        S.ligas=S.ligas.filter(l=>l.id!==id);
        if(S.active===id){S.active=null;toast('Esta liga foi apagada')}
        S=normalize(S);saveUI();render();return;
      }
      refetch(id);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'league_members'},async p=>{
      const row=p.new&&p.new.user_id?p.new:p.old;
      if(!row||row.user_id!==ME.id)return;
      if(p.eventType==='INSERT'){                    // o admin aprovou
        const {data}=await sb.from('leagues').select('id,name,code,data,version').eq('id',row.league_id).maybeSingle();
        if(!data)return;
        VER[data.id]=data.version;CODE[data.id]=data.code;
        aplicaRemoto(data.id,data.data,data.name,data.code);
        PEND=PEND.filter(x=>x.league_id!==data.id);
        S=normalize(S);render();toast('Você entrou em '+data.name);
      }else if(p.eventType==='DELETE'){              // o admin tirou você
        if(!S.ligas.some(l=>l.id===row.league_id))return;
        S.ligas=S.ligas.filter(l=>l.id!==row.league_id);
        if(S.active===row.league_id){S.active=null;toast('Você foi removido da liga')}
        S=normalize(S);saveUI();render();
      }
    })
    .subscribe();
}

/* Não redesenha por cima de digitação, arrasto ou folha aberta. */
function ocupado(){
  const ae=document.activeElement||{};
  if(['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0)return true;
  if(typeof drag!=='undefined'&&drag&&drag.active)return true;
  const sh=$('#sheet');
  return !!(sh&&sh.classList.contains('on'));
}

/* Aviso que chegou enquanto a pessoa digitava ou tinha uma folha aberta não se
   perde: fica pendente e é buscado assim que a folha fecha / o campo solta. */
const pendente=new Set();
function refetchPendentes(){
  if(!pendente.size||ocupado())return;
  const ids=[...pendente];pendente.clear();
  ids.forEach(id=>refetch(id));
}
async function refetch(id,tent){
  if(!sb||!ME)return;
  tent=(tent||0)+1;
  if(syncing||dirty.size){                                              // edição local tem prioridade
    if(tent>60){pendente.add(id);return}
    setTimeout(()=>refetch(id,tent),700);return;
  }
  if(ocupado()){pendente.add(id);return}                                // não redesenha por cima de digitação
  const {data,error}=await sb.from('leagues').select('id,name,code,data,version').eq('id',id).maybeSingle();
  if(error||!data)return;
  if((VER[id]||0)>=data.version)return;             // eco da nossa própria gravação
  VER[id]=data.version;
  aplicaRemoto(id,data.data,data.name,data.code);
  render();
}

function authBusy(txt){
  const b=$('.card .btn.pri');
  if(b){b.textContent=txt;b.style.opacity='.6'}
}

const ERROS={
  'Invalid login credentials':'Usuário ou senha errados.',
  'User already registered':'Esse usuário já existe. Vá em Entrar.',
  'Password should be at least 6 characters.':'A senha precisa de pelo menos 6 caracteres.',
  'Email logins are disabled':'Ative "Email" em Authentication → Providers no Supabase.',
  'Signups not allowed for this instance':'Ative "Allow new users to sign up" em Authentication → Sign In / Providers.'
};
const traduz=e=>{
  const m=(e&&e.message)||String(e);
  if(ERROS[m])return ERROS[m];
  if(/confirm/i.test(m))return 'Desligue "Confirm email" em Authentication → Providers → Email.';
  return m;
};

/* ==========================================================================
   AÇÕES DE CONTA E DE LIGA (sobrepõem as versões locais do protótipo)
   ========================================================================== */
/* A liga aparece na tela na hora, com um id provisório, e só depois troca
   pelo id que o servidor deu. Ninguém fica olhando para o vazio esperando a
   rede — e a criação continua sendo uma função síncrona para quem chama.   */
function mkLiga(name,base){
  const l=Object.assign({createdAt:Date.now(),cfg:defCfg(),players:[],matches:[],sessions:[],live:null},
                        base||{},{id:uid(),name:name});
  S.ligas.push(l);S=normalize(S);
  S.active=l.id;S.ui.tab='racha';saveUI();render();
  return l.id;
}

function reid(de,para){
  const l=S.ligas.find(x=>x.id===de);if(!l)return;
  l.id=para;
  if(S.active===de)S.active=para;
  if(dirty.has(de)){dirty.delete(de);dirty.add(para)}   // mexeu antes da rede responder
  [VER,SNAP,CODE].forEach(m=>{delete m[de]});
}

async function createLeague(name,base){
  const tmp=mkLiga(name,base);
  if(!sb||!ME)return tmp;                    // sem backend configurado (ex.: smoke test)
  const doc=Object.assign({},S.ligas.find(x=>x.id===tmp));
  delete doc.id;
  const {data,error}=await sb.rpc('create_league',{p_name:name,p_data:doc});
  if(error){                                 // desfaz: nada de liga fantasma que nunca grava
    S.ligas=S.ligas.filter(x=>x.id!==tmp);
    if(S.active===tmp)S.active=null;
    dirty.delete(tmp);S=normalize(S);saveUI();render();
    toast('Não deu para criar: '+traduz(error));
    return null;
  }
  reid(tmp,data.id);
  VER[data.id]=data.version;CODE[data.id]=data.code;
  const fin=S.ligas.find(x=>x.id===data.id);
  if(fin)SNAP[data.id]=JSON.stringify(ligaData(fin));
  saveUI();render();
  return data.id;
}

   league_members só mostra o próprio vínculo pela RLS; o admin lista todas as
   contas via RPC (league_accounts). Conta sem jogador é o caso que ficava
   invisível: aqui o admin vincula a um perfil sem dono, cria um jogador com
   o nome da conta ou tira a conta da liga.                                  */
const ACC={};                      // por liga: {at, lista:[{user_id,username,joined_at,is_owner}]}
const ACC_TTL=30000;
async function loadAccounts(id){
  if(!sb||!ME)return;
  const c=ACC[id];
  if(c&&c.carregando)return;
  ACC[id]=Object.assign({},c||{lista:null},{carregando:true});
  const {data,error}=await sb.rpc('league_accounts',{p_id:id});
  ACC[id]={at:Date.now(),lista:error?((c&&c.lista)||[]):(data||[]),erro:error?traduz(error):null};
  if(!ocupado())render();
}
/* Para o admin, o card Membros é a lista de CONTAS (com ou sem jogador): é
   a única lista que ele precisa. Para os outros, a versão do protótipo
   (jogadores com perfil vinculado).                                        */
const membrosCardBase=membrosCard;
membrosCard=function(liga){
  if(!sb||!ME||!souAdmin(liga))return membrosCardBase(liga);
  const c=ACC[liga.id];
  if(!c||(!c.carregando&&Date.now()-c.at>ACC_TTL))setTimeout(()=>loadAccounts(liga.id),0);
  const eu=euId(liga),semConta=liga.players.filter(p=>!p.owner).length;
  if(!c||!c.lista)return `<div class="card"><div class="row" style="margin-bottom:6px"><div class="k">Membros</div></div><div class="tiny muted">Buscando contas…</div></div>`;
  const jog=a=>a.pending?null:liga.players.find(p=>p.owner===a.username);
  const pend=c.lista.filter(a=>a.pending),contas=c.lista.filter(a=>!a.pending);
  const semJog=contas.filter(a=>!jog(a));
  const ord=pend.concat([...contas].sort((a,b)=>{const pa=jog(a),pb=jog(b);
    if(!pa!==!pb)return pa?1:-1;                                   // sem jogador primeiro: é o que precisa de ação
    return ((pa?PAPEL_ORD[pa.role]??2:9)-(pb?PAPEL_ORD[pb.role]??2:9))||a.username.localeCompare(b.username)}));
  const linha=a=>{const p=jog(a);
    if(a.pending)return `<div class="rank" data-a="accSheet" data-u="${esc(a.user_id)}">
      <div style="min-width:0;flex:1"><div class="nm">@${esc(a.username)}</div>
        <div class="meta"><span class="tiny" style="color:var(--lime)">pediu para entrar — toque para aprovar</span></div></div>
      <span class="pat" style="--pc:var(--lime)">Pedido</span>
      <div style="color:var(--mute);font-size:18px">›</div></div>`;
    return p?`<div class="rank" data-a="pSheet" data-id="${p.id}">
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}${p.id===eu?' <span class="tiny muted">(você)</span>':''}</div>
        <div class="meta"><span class="tiny muted">@${esc(a.username)}${a.is_owner?' · dono':''}</span></div></div>
      <span class="pat" style="--pc:${p.role==='admin'?'var(--gold)':p.role==='editor'?'var(--cyan)':'var(--mute)'}">${PAPEL[p.role]||'Jogador'}</span>
      <div style="color:var(--mute);font-size:18px">›</div></div>`
    :`<div class="rank" data-a="accSheet" data-u="${esc(a.user_id)}">
      <div style="min-width:0;flex:1"><div class="nm">@${esc(a.username)}${a.user_id===ME.id?' <span class="tiny muted">(você)</span>':''}</div>
        <div class="meta"><span class="tiny" style="color:var(--gold)">sem jogador — toque para vincular</span></div></div>
      ${a.is_owner?'<span class="pat" style="--pc:var(--gold)">Dono</span>':''}
      <div style="color:var(--mute);font-size:18px">›</div></div>`};
  return `<div class="card">
    <div class="row" style="margin-bottom:6px"><div class="k">Membros</div>
      <div class="sp tiny muted num">${pend.length?pend.length+' pedido'+(pend.length===1?'':'s')+' · ':''}${contas.length} conta${contas.length===1?'':'s'}${semJog.length?' · '+semJog.length+' sem jogador':''}${semConta?' · '+semConta+' só no cadastro':''}</div></div>
    <div class="tiny muted" style="margin-bottom:10px">Você é <b>Admin</b>. Toque num membro para mudar permissão ou vínculo; só você vê as contas ainda sem jogador.</div>

    <div class="card" style="padding:0;margin:0 0 ${semConta?'8px':'0'}">${ord.map(linha).join('')}</div>
    ${semConta?`<div class="tiny muted">${semConta} jogador${semConta===1?'':'es'} sem conta — alguém lança por ele${semConta===1?'':'s'}. Estão na escada abaixo.</div>`:''}
  </div>`;
};

function logCard(liga){

  const nome=pid=>{const p=P(liga,pid);return p?p.name:'(removido)'};
  const linha=e=>{

    else if(e.a==='result')o+=`: ${e.from==='draw'?'empate':'time '+(e.from+1)} → ${e.to==='draw'?'empate':'time '+(e.to+1)}`;
    else if(e.a==='role')o+=` de ${esc(nome(e.pid))}: ${PAPEL[e.from]||'Jogador'} → ${PAPEL[e.to]||'Jogador'}`;
    else if(e.a==='link'||e.a==='unlink')o+=`: @${esc(e.user||'?')} ↔ ${esc(nome(e.pid))}`;
    else if(e.a==='delPlayer'||e.a==='newPlayer')o+=`: ${esc(e.name||nome(e.pid))}`;
    else if(e.a==='delMatch'&&e.names)o+=`: ${esc(e.names[0])} ${e.score?e.score.join('-'):''} ${esc(e.names[1])}`;
    return `<div class="tiny" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted num">${new Date(e.ts).toLocaleDateString('pt-BR')} · @${esc(e.by||'?')}</span><br>${o}</div>`;
  };
  return `<div class="card"><div class="k" style="margin-bottom:6px">Registro de correções</div>
    <div class="tiny muted" style="margin-bottom:6px">Quem mexeu no quê. Só o admin vê; nunca é apagado.</div>
    ${log.length?log.map(linha).join(''):'<div class="tiny muted">Nada corrigido ainda.</div>'}
    ${(liga.log||[]).length>25?`<div class="tiny muted" style="margin-top:6px">…e mais ${liga.log.length-25} no backup.</div>`:''}</div>`;
}

/* ---------- home: entrar por código + conta ---------- */
const renderHomeOrig=renderHome;
renderHome=function(){
  renderHomeOrig();
  const app=$('#app');
  const hr=app.querySelector('.hr');
  if(hr)hr.insertAdjacentHTML('beforebegin',
    '<div style="height:8px"></div><button class="btn wide ghost" data-a="joinLiga">Entrar com um código</button>'
    +(PEND.length?`<div class="card" style="margin-top:12px"><div class="k" style="margin-bottom:6px">Aguardando aprovação</div>
      ${PEND.map(x=>`<div class="row" style="margin-bottom:6px"><div style="min-width:0;flex:1"><b>${esc(x.name)}</b><div class="tiny muted">o admin precisa aprovar sua entrada</div></div>
        <button class="btn sm ghost" data-a="cancelPend" data-id="${esc(x.league_id)}">cancelar</button></div>`).join('')}
      <div class="tiny muted">Pode fechar o app: assim que aprovar, a liga aparece aqui.</div></div>`:''));
  const pe=app.lastElementChild;
  if(pe&&pe.classList.contains('tiny'))pe.innerHTML=
    `Conectado como <b>${esc(ME?ME.username:'—')}</b> · dados no servidor<br>`
    +`<button data-a="logout" style="background:none;border:0;color:var(--mute);text-decoration:underline;`
    +`font:inherit;cursor:pointer;padding:12px 14px;min-height:44px">sair da conta</button>`;
};

/* Enter envia o formulário da tela de conta / do código. */
document.addEventListener('keydown',e=>{
  const sh=$('#sheet'),aberta=!!(sh&&sh.classList.contains('on'));
  if(e.key==='Escape'&&aberta){e.preventDefault();closeSheet();return}
  if(e.key!=='Enter')return;
  if($('#au')&&$('#ap')){e.preventDefault();A[authMode==='criar'?'doSignup':'doLogin']();return}
  if($('#jc')&&document.activeElement===$('#jc')){e.preventDefault();A.doJoin();return}
  /* Enter num campo de texto da folha (nova liga, novo jogador…) aciona o botão principal dela */
  const ae=document.activeElement;
  if(aberta&&ae&&ae.tagName==='INPUT'&&sh.contains(ae)){
    const b=sh.querySelector('.btn.pri[data-a]');
    if(b){e.preventDefault();b.click()}
  }
});

/* Saindo da aba: grava agora, sem esperar o debounce (sendBeacon não serve —
   não dá para mandar o cabeçalho de autenticação nele). Voltando: busca o que
   mudou enquanto estava fora. */
document.addEventListener('visibilitychange',()=>{
  if(!ME)return;
  if(document.visibilityState==='hidden'){clearTimeout(syncT);flush()}
  else if(S.active)refetch(S.active);
});
/* Fechar a aba / o app no celular: última chance de gravar o que está sujo. */
const onWin=(ev,fn)=>{try{window.addEventListener(ev,fn)}catch(e){}};   // os testes rodam sem window de verdade
onWin('pagehide',()=>{if(ME&&dirty.size){clearTimeout(syncT);flush()}});
/* A rede voltou: grava agora, sem esperar o backoff. */
onWin('online',()=>{if(ME&&dirty.size){tentativas=0;clearTimeout(syncT);flush()}});
/* Soltou o campo de texto: se chegou atualização enquanto digitava, busca agora. */
document.addEventListener('focusout',()=>setTimeout(refetchPendentes,80));

boot();
</script>
